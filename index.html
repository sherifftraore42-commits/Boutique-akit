    // ══════════════════════════════════════════════
    // CONFIGURATION CLOUDINARY — AKIT COMMERCE
    // Cloud name: dvv8gytfp | Preset: akit-commerce
    // ══════════════════════════════════════════════
    window.CLOUDINARY_CONFIG = {
      cloudName: "dvv8gytfp",
      uploadPreset: "akit-commerce",
      folder: "akit-commerce/products"
    };

    let db = null;
    try {
      if (firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("REMPLACE")) {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        console.log("✅ Firebase connecté !");
      } else {
        console.warn("⚠️ Firebase non configuré — mode localStorage activé");
      }
    } catch(e) {
      console.error("Erreur Firebase:", e);
    }

    // ══════════════════════════════════════════════
    // FONCTION UPLOAD CLOUDINARY
    // Envoie l'image sur Cloudinary → retourne l'URL publique mondiale
    // ══════════════════════════════════════════════
    window.uploadToCloudinary = async function(file, onProgress) {
      const { cloudName, uploadPreset } = window.CLOUDINARY_CONFIG;
      const url = `https://api.cloudinary.com/v1_1/${cloudName}/image/upload`;
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", uploadPreset);
      formData.append("folder", window.CLOUDINARY_CONFIG.folder);

      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open("POST", url);
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable && onProgress) {
            onProgress(Math.round((e.loaded / e.total) * 100));
          }
        };
        xhr.onload = () => {
          if (xhr.status === 200) {
            const data = JSON.parse(xhr.responseText);
            resolve(data.secure_url); // URL HTTPS mondiale
          } else {
            reject(new Error("Erreur upload: " + xhr.responseText));
          }
        };
        xhr.onerror = () => reject(new Error("Erreur réseau"));
        xhr.send(formData);
      });
    };

    const useFirebaseProducts = () => {
      const isFirebase = !!window.db;
      const loadProducts = async () => {
        if (isFirebase) {
          const snap = await window.db.collection("products").orderBy("createdAt", "asc").get();
          return snap.docs.map(d => ({ ...d.data(), id: d.id }));
        } else {
          try { return JSON.parse(localStorage.getItem("akit_products") || "[]"); } catch { return []; }
        }
      };
      const addProduct = async (product) => {
        if (isFirebase) {
          const ref = await window.db.collection("products").add({ ...product, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
          return ref.id;
        } else {
          const id = Date.now().toString();
          const products = JSON.parse(localStorage.getItem("akit_products") || "[]");
          products.push({ ...product, id });
          localStorage.setItem("akit_products", JSON.stringify(products));
          return id;
        }
      };
      const updateProduct = async (id, product) => {
        if (isFirebase) {
          await window.db.collection("products").doc(id).update(product);
        } else {
          const products = JSON.parse(localStorage.getItem("akit_products") || "[]");
          const idx = products.findIndex(p => p.id === id);
          if (idx !== -1) { products[idx] = { ...products[idx], ...product }; localStorage.setItem("akit_products", JSON.stringify(products)); }
        }
      };
      const deleteProduct = async (id) => {
        if (isFirebase) {
          await window.db.collection("products").doc(id).delete();
        } else {
          const products = JSON.parse(localStorage.getItem("akit_products") || "[]");
          localStorage.setItem("akit_products", JSON.stringify(products.filter(p => p.id !== id)));
        }
      };
      const subscribeProducts = (callback) => {
        if (isFirebase) {
          return window.db.collection("products").orderBy("createdAt", "asc").onSnapshot(snap => {
            callback(snap.docs.map(d => ({ ...d.data(), id: d.id })));
          });
        }
        return null;
      };
      return { isFirebase, loadProducts, addProduct, updateProduct, deleteProduct, subscribeProducts };
    };

    function CloudinaryUpload({ value, onChange, showToast }) {
      const [uploading, setUploading] = useState(false);
      const [progress, setProgress] = useState(0);
      const [dragOver, setDragOver] = useState(false);
      const inputRef = useRef(null);

      const handleFile = async (file) => {
        if (!file) return;
        if (!file.type.startsWith("image/")) { showToast("❌ Fichier non supporté", false); return; }
        if (file.size > 10 * 1024 * 1024) { showToast("❌ Image trop grande (max 10MB)", false); return; }
        setUploading(true);
        setProgress(0);
        try {
          const url = await window.uploadToCloudinary(file, (p) => setProgress(p));
          onChange(url);
          showToast("✅ Image uploadée sur Cloudinary !");
        } catch (err) {
          showToast("❌ Erreur: " + err.message, false);
        } finally {
          setUploading(false);
          setProgress(0);
        }
      };

      const onDrop = (e) => {
        e.preventDefault();
        setDragOver(false);
        const file = e.dataTransfer.files[0];
        if (file) handleFile(file);
      };

      return (
        <div>
          <label style={{fontSize:11,color:"rgba(255,255,255,0.5)",display:"block",marginBottom:6}}>
            🖼️ Image du produit
            <span style={{marginLeft:8,fontSize:9,background:"rgba(16,185,129,0.15)",color:"#10b981",borderRadius:6,padding:"1px 6px",border:"1px solid rgba(16,185,129,0.3)"}}>

            {/* APERÇU */}
            <div style={{width:80,height:80,borderRadius:14,background:"rgba(255,255,255,0.06)",border:"2px solid rgba(217,119,6,0.3)",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0,position:"relative"}}>
              {value
                ? <img src={value} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                : <span style={{fontSize:32}}>📦</span>
              }
              {uploading && (
                <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.7)",display:"flex",alignItems:"center",justifyContent:"center",borderRadius:12}}>
                  <div className="spinner" style={{width:24,height:24,borderWidth:2}}/>
                </div>
              )}
            </div>
            <div style={{flex:1}}>
              <div
                className={`upload-zone ${uploading?"uploading":value?"done":""}`}
                onClick={()=>!uploading&&inputRef.current?.click()}
                onDragOver={e=>{e.preventDefault();setDragOver(true);}}
                onDragLeave={()=>setDragOver(false)}
                onDrop={onDrop}
                style={{borderColor:dragOver?"#f59e0b":undefined}}
              >
                <input ref={inputRef} type="file" accept="image/*" onChange={e=>handleFile(e.target.files[0])} style={{display:"none"}}/>

                  <div>
                    <div style={{fontSize:12,color:"#10b981",fontWeight:700,marginBottom:6}}>⏳ Upload en cours… {progress}%</div>
                    <div className="progress-bar"><div className="progress-fill" style={{width:`${progress}%`}}/></div>
                  </div>
                ) : value ? (

      const toggleWish = (p) => {

      const loginAdmin = () => {
        if (adminPass===ADMIN_PASS) { setAdminLogged(true); setAdminErr(""); setPage("admin"); setMenuOpen(false); }

      const saveProduct = async () => {
        if (!form.name || !form.price) { showToast("Nom et prix requis", false); return; }
        const productData = { ...form, price: Number(form.price) };
        try {
          if (editingProduct !== null) {
            await updateProduct(editingProduct, productData);
            if (!isFirebase) setProducts(ps=>ps.map(p=>p.id===editingProduct?{...productData,id:editingProduct}:p));
            showToast("✅ Produit modifié !");
          } else {
            const newId = await addProduct(productData);
            if (!isFirebase) setProducts(ps=>[...ps, {...productData, id:newId}]);
            showToast("✅ Produit ajouté !");
          }
        } catch(e) { showToast("❌ Erreur: " + e.message, false); }
        setForm(emptyForm);
        setEditingProduct(null);
      };

      const handleDeleteProduct = async (id) => {
        try {
          await deleteProduct(id);
          if (!isFirebase) setProducts(ps=>ps.filter(p=>p.id!==id));
          showToast("🗑️ Produit supprimé");
        } catch(e) { showToast("❌ Erreur suppression", false); }
      };

      const startEdit = (p) => {
        setForm({ name:p.name, price:String(p.price), category:p.category||"", description:p.description||"", emoji:p.emoji||"📦", image:p.image||"", inStock:p.inStock, badge:p.badge||"", rating:String(p.rating||4.5), reviews:String(p.reviews||0) });
        setEditingProduct(p.id);
        window.scrollTo({top:0,behavior:"smooth"});
      };

      const categories = ["all", ...Array.from(new Set(products.map(p=>p.category).filter(Boolean)))];
      const filtered = products.filter(p=>(filterCat==="all"||p.category===filterCat)&&(search===""||p.name.toLowerCase().includes(search.toLowerCase())));
      const navTo = (p) => { setPage(p); setMenuOpen(false); };

      // ── ADMIN LOGIN ──
      if (page === "adminLogin") return (
        <div style={{minHeight:"100vh",background:"#060614",display:"flex",alignItems:"center",justifyContent:"center",padding:24,fontFamily:"'Nunito',sans-serif"}}>
          <div className="glass" style={{borderRadius:24,padding:40,maxWidth:400,width:"100%",animation:"fadeUp .5s ease both",textAlign:"center"}}>
            <div style={{fontSize:56,marginBottom:16}}>🔐</div>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:22,fontWeight:900,marginBottom:4,background:"linear-gradient(135deg,#d97706,#f59e0b)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>ESPACE ADMIN</div>
            <div style={{color:"rgba(255,255,255,0.4)",fontSize:13,marginBottom:20}}>Réservé à {ADMIN_USER}</div>
            <div style={{display:"flex",gap:8,justifyContent:"center",flexWrap:"wrap",marginBottom:20}}>
              <div style={{fontSize:11,padding:"5px 10px",borderRadius:8,background:isFirebase?"rgba(16,185,129,0.1)":"rgba(217,119,6,0.1)",color:isFirebase?"#10b981":"#f59e0b",border:`1px solid ${isFirebase?"#10b98133":"#d9770633"}`}}>
                {isFirebase ? "🔥 Firebase connecté" : "💾 Mode local"}
              </div>
              <div style={{fontSize:11,padding:"5px 10px",borderRadius:8,background:"rgba(16,185,129,0.1)",color:"#10b981",border:"1px solid rgba(16,185,129,0.2)"}}>
                ☁️ Cloudinary · dvv8gytfp
              </div>
            </div>
            <input type="password" placeholder="Mot de passe administrateur" value={adminPass} onChange={e=>setAdminPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&loginAdmin()} className="input-field" style={{marginBottom:12,textAlign:"center",letterSpacing:4}}/>
            {adminErr&&<div style={{color:"#ef4444",fontSize:13,marginBottom:12}}>{adminErr}</div>}
            <button onClick={loginAdmin} className="btn-gold" style={{width:"100%",padding:"12px 0",borderRadius:12,border:"none",fontWeight:900,fontSize:15,color:"#000",cursor:"pointer",marginBottom:12,fontFamily:"'Nunito',sans-serif"}}>CONNEXION</button>
            <button onClick={()=>setPage("home")} style={{background:"none",border:"none",color:"rgba(255,255,255,0.4)",cursor:"pointer",fontSize:13,fontFamily:"'Nunito',sans-serif"}}>← Retour à la boutique</button>
          </div>
        </div>
      );

          <div style={{background:"linear-gradient(90deg,#1a0a00,#2d1600,#1a0a00)",borderBottom:"2px solid #d97706",padding:"14px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:100,flexWrap:"wrap",gap:10}}>

                <div style={{fontFamily:"'Cinzel',serif",fontSize:14,fontWeight:900,color:"#f59e0b"}}>PANNEAU ADMIN</div>

                  <span style={{fontSize:10,color:isFirebase?"#10b981":"#f59e0b"}}>{isFirebase?"🔥 Firebase":"💾 Local"}</span>

              </div>
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>

                        <option value="promo">🔥 Promo</option>
                        <option value="bestseller">⭐ Bestseller</option>
                        <option value="luxe">💎 Luxe</option>

                    <div><label style={{fontSize:11,color:"rgba(255,255,255,0.5)",display:"block",marginBottom:4}}>Nombre d'avis</label><input className="input-field" type="number" value={form.reviews} onChange={e=>setForm(f=>({...f,reviews:e.target.value}))} placeholder="0"/></div>

                  <div><label style={{fontSize:11,color:"rgba(255,255,255,0.5)",display:"block",marginBottom:4}}>Description</label><textarea className="input-field" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} placeholder="Décrivez le produit…" rows={2} style={{resize:"vertical"}}/></div>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <label style={{fontSize:13,color:"rgba(255,255,255,0.7)"}}>En stock</label>

                      <div style={{position:"absolute",top:3,left:form.inStock?22:3,width:18,height:18,borderRadius:"50%",background:"#fff",transition:"left .2s"}}/>

                  </div>
                  <div style={{display:"flex",gap:10,marginTop:4}}>
                    <button onClick={saveProduct} className="btn-gold" style={{flex:1,padding:"11px 0",borderRadius:12,border:"none",fontWeight:900,fontSize:14,color:"#000",cursor:"pointer",fontFamily:"'Nunito',sans-serif"}}>{editingProduct!==null?"💾 Enregistrer":"➕ Ajouter"}</button>
                    {editingProduct!==null&&<button onClick={()=>{setForm(emptyForm);setEditingProduct(null);}} style={{padding:"11px 16px",borderRadius:12,border:"1px solid rgba(255,255,255,0.15)",background:"rgba(255,255,255,0.05)",color:"#fff",cursor:"pointer",fontFamily:"'Nunito',sans-serif",fontSize:14}}>Annuler</button>}
                  </div>
                </div>
              </div>
              {/* LISTE PRODUITS */}

                      {p.image&&<div style={{position:"absolute",bottom:0,right:0,width:14,height:14,borderRadius:"50%",background:"#10b981",display:"flex",alignItems:"center",justifyContent:"center",fontSize:8}}>☁</div>}

                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:13,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.name}</div>

                      <div style={{display:"flex",gap:5,marginTop:2,flexWrap:"wrap"}}>

                        <span style={{fontSize:9,background:p.inStock?"rgba(16,185,129,0.2)":"rgba(239,68,68,0.2)",color:p.inStock?"#10b981":"#ef4444",borderRadius:5,padding:"1px 5px"}}>{p.inStock?"✅ Stock":"❌ Rupture"}</span>

                    <div style={{display:"flex",flexDirection:"column",gap:5}}>

                    </div>
                  </div>
                ))}
              </div>
            </div>

      // ── BOUTIQUE PRINCIPALE ──
      return (
        <div dir={isRTL?"rtl":"ltr"} style={{minHeight:"100vh",background:"#060614",fontFamily:"'Nunito',sans-serif",color:"#fff",overflowX:"hidden"}}>

          <div className="banner-fixed">
            <div style={{display:"flex",animation:"marquee 28s linear infinite",whiteSpace:"nowrap"}}>
