*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
*{touch-action:pan-x pan-y;}
html,body,#root{height:100%;width:100%;}
body{background:#0C0C0F;color:#F0EDE8;font-family:'Inter',sans-serif;overflow-x:hidden;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:#D4A853;border-radius:2px;}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}

.anim-up{animation:fadeUp .45s cubic-bezier(.22,1,.36,1) both;}
.anim-in{animation:fadeIn .3s ease both;}
.anim-scale{animation:scaleIn .35s cubic-bezier(.22,1,.36,1) both;}

/* TYPOGRAPHY */
.font-display{font-family:'Syne',sans-serif;}

/* GLASS CARDS */
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:16px;transition:border-color .2s,transform .25s;}
.card:hover{border-color:rgba(212,168,83,0.3);transform:translateY(-3px);}
.card-flat{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:16px;}

/* GOLD ACCENT */
.gold{color:#D4A853;}
.gold-bg{background:#D4A853;}
.btn-gold{background:#D4A853;color:#0C0C0F;font-weight:700;border:none;cursor:pointer;font-family:'Inter',sans-serif;transition:filter .2s,transform .15s;}
.btn-gold:hover{filter:brightness(1.1);}
.btn-gold:active{transform:scale(.97);}

/* GHOST BUTTON */
.btn-ghost{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#F0EDE8;cursor:pointer;font-family:'Inter',sans-serif;transition:background .2s;}
.btn-ghost:hover{background:rgba(255,255,255,0.1);}

/* INPUT */
.inp{width:100%;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:11px 14px;color:#F0EDE8;font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
.inp:focus{border-color:#D4A853;}
.inp::placeholder{color:rgba(240,237,232,0.35);}
select.inp option{background:#1a1a20;}

/* OVERLAY / MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(8px);}
.modal{background:#13131A;border:1px solid rgba(212,168,83,0.25);border-radius:20px;padding:28px 24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:scaleIn .3s cubic-bezier(.22,1,.36,1) both;}

/* HEADER */
.header{position:fixed;top:36px;left:0;right:0;z-index:200;background:rgba(12,12,15,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);}

/* BANNER */
.banner{position:fixed;top:0;left:0;right:0;z-index:201;height:36px;overflow:hidden;background:#D4A853;display:flex;align-items:center;}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;height:100%;width:280px;background:#0C0C0F;border-right:1px solid rgba(255,255,255,0.08);z-index:250;display:flex;flex-direction:column;transition:transform .35s cubic-bezier(.4,0,.2,1);}

/* PRODUCT CARD */
.pcard{background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.06);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,border-color .2s;}
.pcard:hover{transform:translateY(-4px);border-color:rgba(212,168,83,0.3);}

/* BADGE */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;}

/* TOGGLE */
.toggle{width:44px;height:24px;border-radius:12px;position:relative;cursor:pointer;transition:background .2s;}
.toggle-thumb{position:absolute;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;}

/* SPINNER */
.spin{width:32px;height:32px;border:3px solid rgba(212,168,83,.2);border-top-color:#D4A853;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto;}

/* UPLOAD */
.upload-zone{border:1.5px dashed rgba(212,168,83,0.3);border-radius:14px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;background:rgba(212,168,83,0.03);}
.upload-zone:hover,.upload-zone.drag{border-color:#D4A853;background:rgba(212,168,83,0.07);}

/* STARS */
.star{font-size:11px;}

/* SKELETON */
.skel{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:10px;}

/* PAYMENT METHOD */
.pmcard{padding:12px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.07);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px;}
.pmcard.sel{border-color:#D4A853;background:rgba(212,168,83,0.08);}

/* NAV ITEM */
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:12px;border:none;background:transparent;color:#F0EDE8;cursor:pointer;font-family:'Inter',sans-serif;font-size:14px;font-weight:500;width:100%;text-align:left;transition:background .15s;}
.nav-item:hover{background:rgba(255,255,255,0.06);}
.nav-item.active{background:rgba(212,168,83,0.12);color:#D4A853;}

/* CATEGORY PILL */
.cat-pill{padding:6px 15px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(240,237,232,.6);transition:all .2s;white-space:nowrap;flex-shrink:0;}
.cat-pill.active{border-color:#D4A853;background:rgba(212,168,83,0.15);color:#D4A853;}

/* WA ICON */
.wa-icon svg{display:block;}

/* PROGRESS */
.prog-bar{height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:#D4A853;border-radius:3px;transition:width .3s;}

/* RESPONSIVE */
@media(max-width:600px){
  .products-grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))!important;}
  .hero-split{flex-direction:column!important;}
  .stats-row{grid-template-columns:repeat(2,1fr)!important;}
  .admin-split{grid-template-columns:1fr!important;}
}

window.uploadCLD = (file, onProg) => new Promise((ok,err)=>{
  const fd = new FormData();
  fd.append("file",file);
  fd.append("upload_preset",window.CLD.preset);
  fd.append("folder",window.CLD.folder);
  const xhr = new XMLHttpRequest();
  xhr.open("POST",`https://api.cloudinary.com/v1_1/${window.CLD.cloud}/image/upload`);
  xhr.upload.onprogress=e=>e.lengthComputable&&onProg&&onProg(~~(e.loaded/e.total*100));
  xhr.onload=()=>xhr.status===200?ok(JSON.parse(xhr.responseText).secure_url):err(new Error("Upload échoué"));
  xhr.onerror=()=>err(new Error("Réseau"));
  xhr.send(fd);
});

/* ── FIREBASE / LOCALSTORAGE ── */
function useStore(){
  const fb = !!window.db;
  const load = async()=>{
    if(fb){ const s=await window.db.collection("products").orderBy("createdAt","asc").get(); return s.docs.map(d=>({...d.data(),id:d.id})); }
    try{ return JSON.parse(localStorage.getItem("akit_p")||"[]"); }catch{ return []; }
  };
  const add = async(p)=>{
    if(fb){ const r=await window.db.collection("products").add({...p,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); return r.id; }
    const id=Date.now().toString(); const ps=JSON.parse(localStorage.getItem("akit_p")||"[]"); ps.push({...p,id}); localStorage.setItem("akit_p",JSON.stringify(ps)); return id;
  };
  const upd = async(id,p)=>{
    if(fb){ await window.db.collection("products").doc(id).update(p); return; }
    const ps=JSON.parse(localStorage.getItem("akit_p")||"[]"); const i=ps.findIndex(x=>x.id===id); if(i>=0){ps[i]={...ps[i],...p};localStorage.setItem("akit_p",JSON.stringify(ps));}
  };
  const del = async(id)=>{
    if(fb){ await window.db.collection("products").doc(id).delete(); return; }
    const ps=JSON.parse(localStorage.getItem("akit_p")||"[]"); localStorage.setItem("akit_p",JSON.stringify(ps.filter(x=>x.id!==id)));
  };
  const sub = (cb)=>{
    if(fb) return window.db.collection("products").orderBy("createdAt","asc").onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))));
    return null;
  };
  return {fb,load,add,upd,del,sub};
}

/* ── CLOUDINARY UPLOAD ── */
function ImgUpload({value,onChange,showToast}){
  const [prog,setProg]=useState(0);
  const [busy,setBusy]=useState(false);
  const [drag,setDrag]=useState(false);
  const ref=useRef();

  const handle=async(file)=>{
    if(!file)return;
    if(!file.type.startsWith("image/")){showToast("❌ Fichier invalide",false);return;}
    if(file.size>10*1024*1024){showToast("❌ Max 10MB",false);return;}
    setBusy(true);setProg(0);
    try{
      const url=await window.uploadCLD(file,p=>setProg(p));
      onChange(url);
      showToast("✅ Image uploadée !");
    }catch(e){showToast("❌ "+e.message,false);}
    finally{setBusy(false);setProg(0);}
  };

  return (
    <div>
      <div style={{fontSize:11,color:"rgba(240,237,232,.5)",marginBottom:6,display:"flex",alignItems:"center",gap:8}}>
        Image produit
        <span style={{background:"rgba(16,185,129,.12)",color:"#10b981",border:"1px solid rgba(16,185,129,.25)",borderRadius:6,padding:"1px 7px",fontSize:9}}>☁ CDN mondial</span>
      </div>
      <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
        <div style={{width:76,height:76,borderRadius:12,background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.1)",flexShrink:0,overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center",position:"relative"}}>
          {value?<img src={value} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:28}}>📦</span>}
          {busy&&<div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.7)",display:"flex",alignItems:"center",justifyContent:"center"}}><div className="spin" style={{width:22,height:22,borderWidth:2}}/></div>}
        </div>
        <div style={{flex:1}}>
          <div
            className={`upload-zone${drag?" drag":""}`}
            onClick={()=>!busy&&ref.current?.click()}
            onDragOver={e=>{e.preventDefault();setDrag(true);}}
            onDragLeave={()=>setDrag(false)}
            onDrop={e=>{e.preventDefault();setDrag(false);handle(e.dataTransfer.files[0]);}}
          >
            <input ref={ref} type="file" accept="image/*" onChange={e=>handle(e.target.files[0])} style={{display:"none"}}/>
            {busy?(
              <div>
                <div style={{fontSize:12,color:"#D4A853",fontWeight:600,marginBottom:4}}>Envoi… {prog}%</div>
                <div className="prog-bar"><div className="prog-fill" style={{width:prog+"%"}}/></div>
              </div>
            ):value?(
              <div style={{fontSize:11,color:"#10b981",fontWeight:600}}>✅ Hébergée sur Cloudinary</div>
            ):(
              <div>
                <div style={{fontSize:13,marginBottom:3}}>📁</div>
                <div style={{fontSize:11,color:"rgba(240,237,232,.45)",fontWeight:600}}>Cliquer ou glisser</div>
                <div style={{fontSize:9,color:"rgba(240,237,232,.25)",marginTop:2}}>JPG · PNG · WEBP · max 10MB</div>
              </div>
            )}
          </div>
          {value&&!busy&&(
            <button onClick={()=>onChange("")} style={{width:"100%",marginTop:5,padding:"5px 0",borderRadius:8,border:"1px solid rgba(239,68,68,.35)",background:"rgba(239,68,68,.08)",color:"#ef4444",cursor:"pointer",fontFamily:"Inter,sans-serif",fontWeight:600,fontSize:11}}>
              🗑 Supprimer
            </button>
          )}
        </div>
      </div>

/* ════════════════════════════════════════════════
   ADMIN PANEL — Page complète pour toi seul
════════════════════════════════════════════════ */
function AdminPanel({products,onBack,onLogout,store,showToast}){
  const empty={name:"",price:"",category:"",description:"",emoji:"📦",image:"",inStock:true,badge:"",rating:"4.5",reviews:"0"};
  const [form,setForm]=useState(empty);
  const [editId,setEditId]=useState(null);

  const save=async()=>{
    if(!form.name||!form.price){showToast("Nom et prix requis",false);return;}
    const data={...form,price:Number(form.price)};
    try{
      if(editId!==null){
        await store.upd(editId,data);
        showToast("✅ Produit modifié !");
      } else {
        await store.add(data);
        showToast("✅ Produit ajouté !");
      }
    }catch(e){showToast("❌ "+e.message,false);}
    setForm(empty);setEditId(null);
  };

  const del=async(id)=>{
    try{ await store.del(id); showToast("🗑 Supprimé"); }
    catch(e){showToast("❌ Erreur",false);}
  };

  const startEdit=(p)=>{
    setForm({name:p.name,price:String(p.price),category:p.category||"",description:p.description||"",emoji:p.emoji||"📦",image:p.image||"",inStock:p.inStock,badge:p.badge||"",rating:String(p.rating||4.5),reviews:String(p.reviews||0)});
    setEditId(p.id);
    window.scrollTo({top:0,behavior:"smooth"});
  };

  const stats=[
    {l:"Produits",v:products.length,icon:"📦",c:"#D4A853"},
    {l:"En stock",v:products.filter(p=>p.inStock).length,icon:"✅",c:"#10b981"},
    {l:"Rupture",v:products.filter(p=>!p.inStock).length,icon:"❌",c:"#ef4444"},
    {l:"Catégories",v:new Set(products.map(p=>p.category).filter(Boolean)).size,icon:"🗂",c:"#6366f1"},

        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:38,height:38,borderRadius:10,background:"#D4A853",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Syne,sans-serif",fontWeight:800,fontSize:17,color:"#0C0C0F"}}>A</div>
          <div>
            <div className="font-display" style={{fontSize:15,color:"#D4A853",fontWeight:700}}>Panneau Admin — AKIT</div>
            <div style={{fontSize:11,color:"rgba(240,237,232,.4)"}}>
              {store.fb?"🔥 Firebase":"💾 Local"} · ☁ Cloudinary
            </div>
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={onBack} className="btn-ghost" style={{padding:"7px 14px",borderRadius:10,fontSize:13}}>👁 Boutique</button>
          <button onClick={onLogout} style={{padding:"7px 14px",borderRadius:10,border:"1px solid rgba(239,68,68,.4)",background:"rgba(239,68,68,.08)",color:"#ef4444",cursor:"pointer",fontFamily:"Inter,sans-serif",fontSize:13}}>🚪 Déconnexion</button>
        </div>
      </div>

      <div style={{maxWidth:1100,margin:"0 auto",padding:"24px 14px"}}>
        {/* STATS */}

          {stats.map((s,i)=>(
            <div key={i} style={{background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.06)",borderRadius:14,padding:"14px 16px",borderLeft:`3px solid ${s.c}`}}>
              <div style={{fontSize:22,marginBottom:4}}>{s.icon}</div>
              <div style={{fontSize:26,fontWeight:700,color:s.c}}>{s.v}</div>
              <div style={{fontSize:11,color:"rgba(240,237,232,.4)"}}>{s.l}</div>
            </div>
          ))}
        </div>

        <div className="admin-split" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>

          <div style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.07)",borderRadius:18,padding:22}}>
            <div className="font-display" style={{fontSize:15,color:"#D4A853",marginBottom:18,fontWeight:700}}>

                </div>
              </div>
              <div>
                <label style={{fontSize:11,color:"rgba(240,237,232,.4)",display:"block",marginBottom:4}}>Nom du produit *</label>
                <input className="inp" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Ex: Sac cuir premium"/>
              </div>
              <div>
                <label style={{fontSize:11,color:"rgba(240,237,232,.4)",display:"block",marginBottom:4}}>Prix (FCFA) *</label>
                <input className="inp" type="number" value={form.price} onChange={e=>setForm(f=>({...f,price:e.target.value}))} placeholder="25000"/>

/* ════════════════════════════════════════════════
   ADMIN LOGIN — PAGE SECRÈTE
   Accessible uniquement via code caché
════════════════════════════════════════════════ */
function AdminLogin({onSuccess,onBack}){
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [shake,setShake]=useState(false);

  const attempt=()=>{
    if(pass===window.ADMIN_SECRET){ onSuccess(); }
    else {
      setErr("Code incorrect");
      setShake(true);
      setPass("");
      setTimeout(()=>setShake(false),600);
    }
  };

  return (
    <div style={{minHeight:"100vh",background:"#0C0C0F",display:"flex",alignItems:"center",justifyContent:"center",padding:20,fontFamily:"Inter,sans-serif"}}>
      <div style={{width:"100%",maxWidth:360,animation:"fadeUp .5s ease both"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{width:60,height:60,borderRadius:16,background:"rgba(212,168,83,.1)",border:"1px solid rgba(212,168,83,.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,margin:"0 auto 16px"}}>🔐</div>
          <div className="font-display" style={{fontSize:24,color:"#D4A853",fontWeight:800,marginBottom:4}}>Accès Administrateur</div>
          <div style={{fontSize:13,color:"rgba(240,237,232,.4)"}}>Réservé au propriétaire AKIT</div>
        </div>
        <div style={{background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",borderRadius:16,padding:"24px 20px"}}>
          <div style={{marginBottom:14}}>
            <input
              className="inp"
              type="password"
              value={pass}
              onChange={e=>{setPass(e.target.value);setErr("");}}
              onKeyDown={e=>e.key==="Enter"&&attempt()}
              placeholder="Code secret admin…"
              style={{textAlign:"center",letterSpacing:4,fontSize:16}}
              autoComplete="new-password"
            />
          </div>
          {err&&<div style={{color:"#ef4444",fontSize:12,textAlign:"center",marginBottom:10}}>{err}</div>}
          <button onClick={attempt} className="btn-gold" style={{width:"100%",padding:"12px 0",borderRadius:12,fontSize:14}}>Accéder au panneau</button>
        </div>
        <button onClick={onBack} style={{display:"block",margin:"16px auto 0",background:"none",border:"none",color:"rgba(240,237,232,.35)",cursor:"pointer",fontSize:13,fontFamily:"Inter,sans-serif"}}>← Retour à la boutique</button>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════
   APP PRINCIPALE
════════════════════════════════════════════════ */
function App(){
  const [lang,setLang]=useState("fr");
  const [page,setPage]=useState("home");
  const [products,setProducts]=useState([]);
  const [loading,setLoading]=useState(true);
  const [cart,setCart]=useState([]);
  const [wish,setWish]=useState([]);
  const [search,setSearch]=useState("");
  const [toast,setToast]=useState(null);
  const [adminLogged,setAdminLogged]=useState(false);
  const [filterCat,setFilterCat]=useState("all");
  const [orderModal,setOrderModal]=useState(false);
  const [quickProd,setQuickProd]=useState(null);
  const [menuOpen,setMenuOpen]=useState(false);
  /* SECRET ADMIN ACCESS — triple-tap logo */
  const [tapCount,setTapCount]=useState(0);
  const tapTimer=useRef(null);

  const store=useStore();
  const t=T[lang]||T.fr;
  const isRTL=lang==="ar";

  useEffect(()=>{
    setLoading(true);
    if(store.fb){
      const unsub=store.sub(ps=>{setProducts(ps);setLoading(false);});
      return ()=>unsub&&unsub();
    } else {
      store.load().then(ps=>{setProducts(ps);setLoading(false);});
    }
  },[]);

  const showToast=(msg,ok=true)=>{
    setToast({msg,ok});
    setTimeout(()=>setToast(null),2600);
  };

  /* ── TRIPLE-TAP SUR LE LOGO = ACCÈS ADMIN SECRET ── */
  const handleLogoTap=()=>{
    const next=tapCount+1;
    setTapCount(next);
    clearTimeout(tapTimer.current);
    if(next>=3){
      setTapCount(0);
      setPage("adminLogin");
      setMenuOpen(false);
    } else {
      tapTimer.current=setTimeout(()=>setTapCount(0),1000);
    }
  };

  /* CART */
  const addCart=p=>{
    if(!p.inStock)return;
    setCart(c=>{const e=c.find(x=>x.id===p.id);return e?c.map(x=>x.id===p.id?{...x,qty:x.qty+1}:x):[...c,{...p,qty:1}];});
    showToast(`${p.emoji||"📦"} ${t.addCart}`);
  };
  const rmCart=id=>setCart(c=>c.filter(x=>x.id!==id));
  const updQty=(id,d)=>setCart(c=>c.map(x=>x.id===id?{...x,qty:Math.max(1,x.qty+d)}:x));
  const cartTotal=cart.reduce((s,x)=>s+Number(x.price)*x.qty,0);
  const cartCount=cart.reduce((s,x)=>s+x.qty,0);

  /* WISHLIST */
  const toggleWish=p=>{
    const has=wish.find(x=>x.id===p.id);
    setWish(w=>has?w.filter(x=>x.id!==p.id):[...w,p]);
    showToast(has?t.rmFav:t.addFav);
  };

  const navTo=p=>{setPage(p);setMenuOpen(false);};
  const cats=["all",...Array.from(new Set(products.map(p=>p.category).filter(Boolean)))];
  const filtered=products.filter(p=>(filterCat==="all"||p.category===filterCat)&&(search===""||p.name.toLowerCase().includes(search.toLowerCase())));

  /* ══ ADMIN PAGES ══ */
  if(page==="adminLogin") return <AdminLogin onSuccess={()=>{setAdminLogged(true);setPage("admin");}} onBack={()=>setPage("home")}/>;
  if(page==="admin"&&adminLogged) return (
    <>
      <AdminPanel products={products} onBack={()=>setPage("home")} onLogout={()=>{setAdminLogged(false);setPage("home");}} store={store} showToast={showToast}/>
      {toast&&<Toast msg={toast.msg} ok={toast.ok}/>}
    </>
  );

  /* ══ BOUTIQUE ══ */
  return (
    <div dir={isRTL?"rtl":"ltr"} style={{minHeight:"100vh",background:"#0C0C0F",color:"#F0EDE8",fontFamily:"Inter,sans-serif"}}>
      {orderModal&&<OrderModal cart={cart} total={cartTotal} t={t} onClose={()=>setOrderModal(false)} onDone={()=>{setCart([]);setOrderModal(false);setPage("orderDone");}}/>}
      {quickProd&&<QuickModal product={quickProd} t={t} onClose={()=>setQuickProd(null)} onDone={()=>{setQuickProd(null);setPage("orderDone");}}/>}

      {/* BACKDROP SIDEBAR */}
      {menuOpen&&<div onClick={()=>setMenuOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.7)",zIndex:240,backdropFilter:"blur(4px)"}}/>}

      {/* ═══ BANNER ═══ */}
      <div className="banner">
        <div style={{display:"flex",animation:"marquee 30s linear infinite",whiteSpace:"nowrap"}}>
          {[BANNER,BANNER].map((txt,i)=>(
            <span key={i} style={{paddingRight:60,fontSize:11,fontWeight:700,color:"#0C0C0F",letterSpacing:".05em",flexShrink:0}}>{txt}</span>
          ))}
        </div>
      </div>

      {/* ═══ HEADER ═══ */}
      <header className="header" style={{padding:"8px 14px",display:"flex",alignItems:"center",gap:10}}>
        <button onClick={()=>setMenuOpen(m=>!m)} className="btn-ghost" style={{width:36,height:36,borderRadius:10,fontSize:18,display:"flex",alignItems:"center",justifyContent:"center",padding:0,flexShrink:0}}>☰</button>

        {/* LOGO — TRIPLE-TAP POUR ADMIN */}
        <div onClick={handleLogoTap} style={{width:36,height:36,borderRadius:10,background:"#D4A853",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,userSelect:"none"}}>
          <span className="font-display" style={{fontSize:16,fontWeight:800,color:"#0C0C0F"}}>A</span>
        </div>

        <input
          value={search}
          onChange={e=>setSearch(e.target.value)}
          placeholder={t.search}
          style={{flex:1,background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.09)",borderRadius:10,padding:"8px 12px",color:"#F0EDE8",fontFamily:"Inter,sans-serif",fontSize:13,outline:"none"}}
        />

        <button onClick={()=>navTo("favorites")} style={{position:"relative",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.08)",borderRadius:10,width:36,height:36,fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          ❤️
          {wish.length>0&&<span style={{position:"absolute",top:-4,right:-4,background:"#ef4444",color:"#fff",borderRadius:"50%",width:15,height:15,fontSize:8,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{wish.length}</span>}
        </button>
        <button onClick={()=>navTo("cart")} style={{position:"relative",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.08)",borderRadius:10,width:36,height:36,fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          🛒
          {cartCount>0&&<span style={{position:"absolute",top:-4,right:-4,background:"#D4A853",color:"#0C0C0F",borderRadius:"50%",width:15,height:15,fontSize:8,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{cartCount}</span>}
        </button>
      </header>

      {/* ═══ SIDEBAR ═══ */}
      <div className="sidebar" style={{transform:menuOpen?"translateX(0)":"translateX(-100%)"}}>
        <div style={{padding:"20px 16px 14px",borderBottom:"1px solid rgba(255,255,255,.07)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
            <span className="font-display" style={{fontSize:22,fontWeight:800,color:"#D4A853"}}>AKIT</span>
            <button onClick={()=>setMenuOpen(false)} className="btn-ghost" style={{width:32,height:32,borderRadius:8,fontSize:16,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
          </div>
          <div style={{display:"flex",gap:6}}>
            <span style={{fontSize:10,padding:"3px 8px",borderRadius:6,background:store.fb?"rgba(16,185,129,.1)":"rgba(212,168,83,.1)",color:store.fb?"#10b981":"#D4A853",border:`1px solid ${store.fb?"rgba(16,185,129,.25)":"rgba(212,168,83,.25)"}`}}>
              {store.fb?"🔥 Firebase":"💾 Local"}
            </span>
          </div>
        </div>

        <nav style={{flex:1,padding:"12px 10px",display:"flex",flexDirection:"column",gap:3,overflowY:"auto"}}>
          {[
            {icon:"🏠",label:t.home,p:"home"},
            {icon:"💳",label:t.payment,p:"payment"},
            {icon:"❤️",label:t.favorites,p:"favorites",badge:wish.length||null},
            {icon:"🛒",label:t.cart,p:"cart",badge:cartCount||null},
          ].map((item,i)=>(
            <button key={i} className={`nav-item${page===item.p?" active":""}`} onClick={()=>navTo(item.p)}>
              <span style={{fontSize:18}}>{item.icon}</span>
              <span>{item.label}</span>
              {item.badge?<span style={{marginLeft:"auto",background:"#D4A853",color:"#0C0C0F",borderRadius:"50%",width:20,height:20,fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{item.badge}</span>:null}
            </button>
          ))}

          <div style={{marginTop:8,borderTop:"1px solid rgba(255,255,255,.06)",paddingTop:10}}>
            <div style={{fontSize:10,color:"rgba(240,237,232,.3)",padding:"4px 16px 6px",fontWeight:600,letterSpacing:".06em",textTransform:"uppercase"}}>🌐 {t.lang}</div>
            <div style={{maxHeight:230,overflowY:"auto",borderRadius:10,border:"1px solid rgba(255,255,255,.06)",background:"rgba(0,0,0,.25)"}}>
              {Object.entries(LANGS).map(([k,v])=>(
                <button key={k} onClick={()=>{setLang(k);setMenuOpen(false);}} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"9px 14px",border:"none",background:lang===k?"rgba(212,168,83,.18)":"transparent",color:lang===k?"#D4A853":"rgba(240,237,232,.6)",cursor:"pointer",fontFamily:"Inter,sans-serif",fontWeight:lang===k?700:400,fontSize:13}}>
                  <span style={{fontSize:16}}>{v.flag}</span><span>{v.n}</span>{lang===k&&<span style={{marginLeft:"auto",fontSize:13}}>✓</span>}
                </button>
              ))}
            </div>
          </div>
        </nav>

        <div style={{padding:"12px 14px",borderTop:"1px solid rgba(255,255,255,.07)"}}>
          <div style={{fontSize:10,color:"rgba(240,237,232,.2)",textAlign:"center",lineHeight:1.7}}>AKIT Commerce © 2026<br/>☁ Cloudinary · dvv8gytfp</div>
        </div>
      </div>

      {/* ═══ CONTENU ═══ */}
      <div style={{paddingTop:88}}>

        {/* ──── HOME ──── */}
        {page==="home"&&(
          <main style={{maxWidth:1100,margin:"0 auto",padding:"0 12px 60px"}}>
            {/* HERO */}
            <div style={{margin:"16px 0",borderRadius:20,overflow:"hidden",position:"relative",background:"linear-gradient(135deg,#13130A,#1A1200,#0C0C0F)",border:"1px solid rgba(212,168,83,.2)",padding:"36px 28px"}}>
              <div style={{position:"absolute",top:0,right:0,width:"45%",height:"100%",background:"radial-gradient(ellipse at 80% 50%,rgba(212,168,83,.12),transparent 70%)",pointerEvents:"none"}}/>
              <div style={{position:"relative",zIndex:1,maxWidth:520}}>
                <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"rgba(212,168,83,.1)",border:"1px solid rgba(212,168,83,.3)",borderRadius:20,padding:"5px 14px",marginBottom:14}}>
                  <span style={{animation:"pulse 2s infinite",display:"block",fontSize:12}}>🌍</span>
                  <span style={{fontSize:11,fontWeight:700,color:"#D4A853",letterSpacing:".05em"}}>190+ PAYS · LIVRAISON INTERNATIONALE</span>
                </div>
                <h1 className="font-display" style={{fontSize:"clamp(22px,4vw,38px)",fontWeight:800,lineHeight:1.15,marginBottom:12}}>
                  <span style={{color:"#F0EDE8"}}>Bienvenue sur </span>
                  <span style={{color:"#D4A853"}}>AKIT Commerce</span>
                </h1>
                <p style={{fontSize:13,color:"rgba(240,237,232,.5)",marginBottom:22,lineHeight:1.7}}>
                  Votre boutique mondiale — produits authentiques, livraison rapide, satisfaction garantie.
                </p>
                <button onClick={()=>navTo("payment")} className="btn-gold" style={{padding:"11px 24px",borderRadius:12,fontSize:13}}>
                  💳 {t.payment}
                </button>
              </div>
            </div>

            {/* STATS */}
            <div className="stats-row" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:20}}>
              {[
                {val:"190+",lbl:{fr:"Pays",en:"Countries",ar:"دول",zh:"国家",es:"Países",pt:"Países",de:"Länder",ru:"Стран",tr:"Ülke",ha:"Ƙasashe"},icon:"🌍"},
                {val:"100%",lbl:{fr:"Sécurisé",en:"Secure",ar:"آمن",zh:"安全",es:"Seguro",pt:"Seguro",de:"Sicher",ru:"Безопасно",tr:"Güvenli",ha:"Aminci"},icon:"🔒"},
                {val:"24/7",lbl:{fr:"Support",en:"Support",ar:"دعم",zh:"支持",es:"Soporte",pt:"Suporte",de:"Support",ru:"Поддержка",tr:"Destek",ha:"Tallafi"},icon:"💬"},
                {val:"★4.9",lbl:{fr:"Satisfaction",en:"Satisfaction",ar:"رضا",zh:"满意度",es:"Satisfacción",pt:"Satisfação",de:"Zufriedenheit",ru:"Оценка",tr:"Memnuniyet",ha:"Gamsuwa"},icon:"⭐"},
              ].map((s,i)=>(
                <div key={i} style={{background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.06)",borderRadius:14,padding:"12px 10px",textAlign:"center"}}>
                  <div style={{fontSize:18,marginBottom:3}}>{s.icon}</div>
                  <div className="font-display" style={{fontWeight:800,fontSize:16,color:"#D4A853"}}>{s.val}</div>
                  <div style={{fontSize:9,color:"rgba(240,237,232,.4)",marginTop:2}}>{s.lbl[lang]||s.lbl.fr}</div>
                </div>
              ))}
            </div>

            {/* FILTRES CATÉGORIES */}
            {cats.length>1&&(
              <div style={{display:"flex",gap:7,overflowX:"auto",paddingBottom:6,marginBottom:18}}>
                {cats.map(c=>(
                  <button key={c} className={`cat-pill${filterCat===c?" active":""}`} onClick={()=>setFilterCat(c)}>
                    {c==="all"?t.all:c}
                  </button>
                ))}
              </div>
            )}

            {/* PRODUITS */}
            {loading?(
              <div style={{textAlign:"center",padding:"60px 20px"}}>
                <div className="spin" style={{marginBottom:16}}/>
                <p style={{color:"rgba(240,237,232,.35)",fontSize:14}}>{t.loading}</p>
              </div>
            ):filtered.length===0?(
              <div style={{textAlign:"center",padding:"50px 20px"}}>
                <div style={{fontSize:60,marginBottom:12,opacity:.25}}>🛍</div>
                <div className="font-display" style={{fontSize:18,color:"rgba(240,237,232,.25)",marginBottom:8,fontWeight:700}}>
                  {search?"Aucun résultat":"BOUTIQUE EN PRÉPARATION"}
                </div>
                <div style={{fontSize:13,color:"rgba(240,237,232,.2)",lineHeight:1.8,whiteSpace:"pre-line",maxWidth:320,margin:"0 auto"}}>
                  {search?`"${search}" — aucun produit trouvé`:t.noProducts}
                </div>
              </div>
            ):(
              <div className="products-grid" style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(165px,1fr))",gap:12}}>
                {filtered.map(p=>{
                  const isW=wish.find(x=>x.id===p.id);
                  const bc=p.badge&&BADGES[p.badge];
                  return (
                    <div key={p.id} className="pcard" style={{position:"relative"}}>
                      {bc&&<div style={{position:"absolute",top:8,left:8,zIndex:2,padding:"2px 8px",borderRadius:20,background:bc.bg,color:bc.c,fontSize:9,fontWeight:700,letterSpacing:".03em"}}>{bc.l}</div>}
                      <button onClick={()=>toggleWish(p)} style={{position:"absolute",top:8,right:8,zIndex:2,background:"rgba(0,0,0,.55)",border:"none",borderRadius:"50%",width:28,height:28,fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(8px)"}}>
                        {isW?"❤️":"🤍"}
                      </button>
                      <div style={{height:135,overflow:"hidden",background:"rgba(255,255,255,.03)",display:"flex",alignItems:"center",justifyContent:"center",position:"relative",flexShrink:0}}>
                        {p.image?<img src={p.image} alt={p.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:54,userSelect:"none"}}>{p.emoji||"📦"}</span>}
                        {!p.inStock&&<div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.68)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{background:"rgba(239,68,68,.9)",color:"#fff",fontWeight:700,fontSize:10,padding:"4px 10px",borderRadius:18}}>{t.outStock}</span></div>}
                      </div>
                      <div style={{padding:"10px 12px 12px",flex:1,display:"flex",flexDirection:"column",gap:4}}>
                        <div style={{fontWeight:600,fontSize:12,lineHeight:1.35,color:"rgba(240,237,232,.9)",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden",flex:1}}>{p.name}</div>
                        {p.category&&<div style={{fontSize:9,color:"rgba(240,237,232,.3)"}}>{p.category}</div>}
                        {Number(p.rating)>0&&<div style={{display:"flex",alignItems:"center",gap:4}}><Stars r={p.rating}/><span style={{fontSize:9,color:"rgba(240,237,232,.35)"}}>({p.reviews||0})</span></div>}
                        <div className="font-display" style={{fontWeight:800,fontSize:14,color:"#D4A853",marginBottom:4}}>{fmt(p.price)}</div>
                        <div style={{display:"flex",flexDirection:"column",gap:5}}>
                          <button
                            onClick={()=>p.inStock&&setQuickProd(p)}
                            disabled={!p.inStock}
                            style={{width:"100%",padding:"7px 0",borderRadius:9,border:"none",background:p.inStock?"linear-gradient(135deg,#25D366,#128C7E)":"rgba(255,255,255,.05)",color:p.inStock?"#fff":"rgba(240,237,232,.25)",fontWeight:700,fontSize:11,cursor:p.inStock?"pointer":"default",fontFamily:"Inter,sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:5}}
                          >
                            {p.inStock?<><WaIco s={12}/>{t.orderDirect}</>:t.outStock}
                          </button>
                          {p.inStock&&(
                            <button onClick={()=>addCart(p)} className="btn-gold" style={{width:"100%",padding:"6px 0",borderRadius:9,fontSize:11}}>
                              🛒 {t.addCart}
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>
        )}

        {/* ──── CART ──── */}
        {page==="cart"&&(
          <main style={{maxWidth:700,margin:"0 auto",padding:"24px 12px 80px"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
              <button onClick={()=>setPage("home")} className="btn-ghost" style={{width:36,height:36,borderRadius:10,fontSize:18,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
              <h2 className="font-display" style={{fontSize:20,fontWeight:700}}>{t.cart} ({cartCount})</h2>
            </div>
            {cart.length===0?(
              <div style={{textAlign:"center",padding:"50px 20px"}}>
                <div style={{fontSize:60,marginBottom:14}}>🛒</div>
                <p style={{color:"rgba(240,237,232,.35)",fontSize:15,marginBottom:20}}>{t.emptyCart}</p>
                <button onClick={()=>setPage("home")} className="btn-gold" style={{padding:"11px 28px",borderRadius:14,fontSize:14}}>{t.continueShopping}</button>
              </div>
            ):(
              <>
                <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:18}}>
                  {cart.map(item=>(
                    <div key={item.id} className="card-flat" style={{padding:"12px 14px",display:"flex",gap:12,alignItems:"center"}}>
                      <div style={{width:52,height:52,borderRadius:11,overflow:"hidden",flexShrink:0,background:"rgba(255,255,255,.05)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>
                        {item.image?<img src={item.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover",borderRadius:11}}/>:item.emoji||"📦"}
                      </div>
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:600,fontSize:13,marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.name}</div>
                        <div className="font-display" style={{fontWeight:800,fontSize:13,color:"#D4A853"}}>{fmt(item.price)}</div>
                        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:6}}>
                          <button onClick={()=>updQty(item.id,-1)} className="btn-ghost" style={{width:26,height:26,borderRadius:"50%",fontSize:14,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                          <span style={{fontWeight:700,fontSize:14,minWidth:18,textAlign:"center"}}>{item.qty}</span>
                          <button onClick={()=>updQty(item.id,1)} className="btn-ghost" style={{width:26,height:26,borderRadius:"50%",fontSize:14,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
                          <span style={{fontSize:11,color:"rgba(240,237,232,.4)"}}>= {fmt(item.price*item.qty)}</span>
                        </div>
                      </div>
                      <button onClick={()=>rmCart(item.id)} style={{background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.3)",borderRadius:9,padding:"6px 9px",color:"#ef4444",cursor:"pointer",fontSize:12,fontWeight:600}}>🗑</button>
                    </div>
                  ))}
                </div>
                <div className="card-flat" style={{padding:"14px 18px",marginBottom:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:12,color:"rgba(240,237,232,.45)"}}>
                    <span>{t.shipping}</span><span style={{color:"#10b981",fontWeight:600}}>GRATUIT</span>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:16}}>
                    <span>{t.total}</span>
                    <span className="font-display" style={{color:"#D4A853"}}>{fmt(cartTotal)}</span>
                  </div>
                </div>
                <button onClick={()=>setOrderModal(true)} style={{width:"100%",padding:"14px 0",borderRadius:14,border:"none",background:"linear-gradient(135deg,#25D366,#128C7E)",color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer",fontFamily:"Inter,sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:9}}>
                  <WaIco s={20}/> {t.orderNow} — {fmt(cartTotal)}
                </button>
              </>
            )}
          </main>
        )}

        {/* ──── PAYMENT ──── */}
        {page==="payment"&&(
          <main style={{maxWidth:540,margin:"0 auto",padding:"24px 12px 80px"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
              <button onClick={()=>setPage(cart.length?"cart":"home")} className="btn-ghost" style={{width:36,height:36,borderRadius:10,fontSize:18,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
              <h2 className="font-display" style={{fontSize:20,fontWeight:700}}>{t.payTitle}</h2>
            </div>
            <p style={{color:"rgba(240,237,232,.45)",fontSize:13,marginBottom:22}}>{t.payDesc}</p>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:24}}>
              {PM.map(m=>(
                <div key={m.id} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderRadius:14,border:`1px solid ${m.c}33`,background:`${m.c}0D`}}>
                  <span style={{fontSize:24}}>{m.icon}</span>
                  <span style={{fontWeight:600,fontSize:14}}>{m.n}</span>
                  <span style={{marginLeft:"auto",fontSize:11,color:"rgba(240,237,232,.4)"}}>Disponible</span>
                </div>
              ))}
            </div>
            {cart.length>0?(
              <button onClick={()=>setOrderModal(true)} style={{width:"100%",padding:"14px 0",borderRadius:14,border:"none",background:"linear-gradient(135deg,#25D366,#128C7E)",color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer",fontFamily:"Inter,sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:9}}>
                <WaIco s={20}/> {t.orderNow} — {fmt(cartTotal)}
              </button>
            ):(
              <button onClick={()=>setPage("home")} className="btn-gold" style={{width:"100%",padding:"14px 0",borderRadius:14,fontSize:15}}>🛍 {t.continueShopping}</button>
            )}
            <div style={{display:"flex",justifyContent:"center",gap:16,marginTop:16,fontSize:11,color:"rgba(240,237,232,.25)",flexWrap:"wrap"}}>
              {["🔒 SSL","🛡 3D Secure","🔄 Remboursement 30j"].map((s,i)=><span key={i}>{s}</span>)}
            </div>
          </main>
        )}

        {/* ──── FAVORITES ──── */}
        {page==="favorites"&&(
          <main style={{maxWidth:800,margin:"0 auto",padding:"24px 12px 80px"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:24}}>
              <button onClick={()=>setPage("home")} className="btn-ghost" style={{width:36,height:36,borderRadius:10,fontSize:18,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
              <h2 className="font-display" style={{fontSize:20,fontWeight:700}}>❤️ {t.favorites} ({wish.length})</h2>
            </div>
            {wish.length===0?(
              <div style={{textAlign:"center",padding:"50px 20px"}}>
                <div style={{fontSize:60,marginBottom:14}}>🤍</div>
                <p style={{color:"rgba(240,237,232,.35)",fontSize:15,marginBottom:20}}>{t.wishEmpty}</p>
                <button onClick={()=>setPage("home")} className="btn-gold" style={{padding:"11px 28px",borderRadius:14,fontSize:14}}>{t.continueShopping}</button>
              </div>
            ):(
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(165px,1fr))",gap:12}}>
                {wish.map(p=>(
                  <div key={p.id} className="pcard">
                    <div style={{height:110,overflow:"hidden",background:"rgba(255,255,255,.03)",display:"flex",alignItems:"center",justifyContent:"center"}}>
                      {p.image?<img src={p.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:46}}>{p.emoji||"📦"}</span>}
                    </div>
                    <div style={{padding:"10px 12px"}}>
                      <div style={{fontWeight:600,fontSize:12,marginBottom:5,lineHeight:1.35}}>{p.name}</div>
                      <div className="font-display" style={{fontWeight:800,fontSize:14,color:"#D4A853",marginBottom:8}}>{fmt(p.price)}</div>
                      <div style={{display:"flex",gap:6}}>
                        <button onClick={()=>setQuickProd(p)} style={{flex:1,padding:"6px 0",borderRadius:9,border:"none",background:"linear-gradient(135deg,#25D366,#128C7E)",color:"#fff",fontWeight:700,fontSize:10,cursor:"pointer",fontFamily:"Inter,sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
                          <WaIco s={11}/> Commander
                        </button>
                        <button onClick={()=>toggleWish(p)} style={{padding:"6px 9px",borderRadius:9,border:"1px solid rgba(239,68,68,.35)",background:"rgba(239,68,68,.08)",color:"#ef4444",cursor:"pointer",fontSize:11}}>✕</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>
        )}

        {/* ──── ORDER DONE ──── */}
        {page==="orderDone"&&(
          <main style={{maxWidth:480,margin:"0 auto",padding:"70px 20px",textAlign:"center"}}>
            <div style={{fontSize:72,marginBottom:20,animation:"toastIn .6s cubic-bezier(.34,1.56,.64,1) both"}}>🎉</div>
            <h2 className="font-display" style={{fontSize:26,fontWeight:800,marginBottom:10,color:"#D4A853"}}>{t.orderDone}</h2>
            <p style={{color:"rgba(240,237,232,.5)",lineHeight:1.8,marginBottom:8}}>{t.orderThank}</p>
            <p style={{color:"rgba(240,237,232,.3)",fontSize:13,marginBottom:32}}>📱 +237 698 083 058</p>
            <button onClick={()=>setPage("home")} className="btn-gold" style={{padding:"13px 36px",borderRadius:16,fontSize:15}}>🏠 {t.continueShopping}</button>
          </main>
        )}

        {/* FOOTER */}
        {page==="home"&&(
          <footer style={{borderTop:"1px solid rgba(255,255,255,.06)",padding:"28px 14px",textAlign:"center",marginTop:20}}>
            <div className="font-display" style={{fontSize:20,fontWeight:800,color:"#D4A853",marginBottom:8}}>AKIT COMMERCE</div>
            <p style={{fontSize:11,color:"rgba(240,237,232,.2)",lineHeight:1.9}}>
              🌍 190+ pays · 🔒 Paiement sécurisé · 🔄 Retours gratuits<br/>
              ☁ Images hébergées Cloudinary · CDN mondial<br/>
              📱 WhatsApp: +237 698 083 058<br/>
              © 2026 Centre de Commerce AKIT
            </p>
          </footer>
        )}
      </div>

      {toast&&<Toast msg={toast.msg} ok={toast.ok}/>}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
