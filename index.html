/* ── TOAST ── */
function Toast({msg,ok}){
  return (
    <div style={{position:"fixed",bottom:28,left:"50%",zIndex:999,animation:"toastIn .35s ease both",pointerEvents:"none",transform:"translateX(-50%)"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,padding:"11px 22px",borderRadius:40,fontSize:13,fontWeight:600,background:ok===false?"#ef4444":ok==="share"?"#13131C":"#10b981",color:"#fff",boxShadow:"0 8px 32px rgba(0,0,0,.6)",whiteSpace:"nowrap",border:ok==="share"?"1px solid rgba(201,150,58,.3)":"none"}}>
        {msg}
      </div>
    </div>
  );
}

/* ── STARS ── */
function Stars({r,size=12}){
  r=Number(r)||0;
  return <span className="stars" style={{fontSize:size}}>{[1,2,3,4,5].map(i=>i<=Math.round(r)?"★":"☆").join("")}</span>;
}

/* ── CLOUDINARY UPLOAD ── */
function ImgUpload({value,onChange,showToast,label="Image produit"}){
  const [prog,setProg]=useState(0);
  const [busy,setBusy]=useState(false);
  const [drag,setDrag]=useState(false);
  const ref=useRef();
  const handle=async(file)=>{
    if(!file)return;
    if(!file.type.startsWith("image/")){showToast("❌ Fichier invalide",false);return;}
    if(file.size>10*1024*1024){showToast("❌ Max 10MB",false);return;}
    setBusy(true);setProg(0);
    try{ const url=await window.uploadCLD(file,p=>setProg(p)); onChange(url); showToast("✅ Image uploadée !"); }
    catch(e){showToast("❌ "+e.message,false);}
    finally{setBusy(false);setProg(0);}
  };
  return (
    <div>
      <div style={{fontSize:11,color:"var(--text-dim)",marginBottom:6}}>{label}</div>
      <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>
        <div style={{width:72,height:72,borderRadius:11,background:"var(--surface2)",border:"1px solid var(--border)",flexShrink:0,overflow:"hidden",display:"flex",alignItems:"center",justifyContent:"center",position:"relative"}}>
          {value?<img src={value} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:26}}>📦</span>}
          {busy&&<div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.75)",display:"flex",alignItems:"center",justifyContent:"center"}}><div className="spin" style={{width:22,height:22}}/></div>}
        </div>
        <div style={{flex:1}}>
          <div className={`upload-zone${drag?" drag":""}`} onClick={()=>!busy&&ref.current?.click()}
            onDragOver={e=>{e.preventDefault();setDrag(true);}} onDragLeave={()=>setDrag(false)}
            onDrop={e=>{e.preventDefault();setDrag(false);handle(e.dataTransfer.files[0]);}}>
            <input ref={ref} type="file" accept="image/*" onChange={e=>handle(e.target.files[0])} style={{display:"none"}}/>
            {busy?(<div><div style={{fontSize:12,color:"var(--gold)",fontWeight:600,marginBottom:4}}>Envoi… {prog}%</div><div className="prog-bar"><div className="prog-fill" style={{width:prog+"%"}}/></div></div>)
              :value?(<div style={{fontSize:11,color:"#10b981",fontWeight:600}}>✅ Sur Cloudinary</div>)
              :(<div><div style={{fontSize:18,marginBottom:3}}>📁</div><div style={{fontSize:11,color:"var(--text-ghost)",fontWeight:600}}>Cliquer ou glisser</div></div>)}
          </div>
          {value&&!busy&&<button onClick={()=>onChange("")} style={{width:"100%",marginTop:5,padding:"5px 0",borderRadius:8,border:"1px solid rgba(239,68,68,.3)",background:"rgba(239,68,68,.07)",color:"#ef4444",cursor:"pointer",fontFamily:"DM Sans,sans-serif",fontWeight:600,fontSize:11}}>🗑 Supprimer</button>}
        </div>
      </div>
    </div>
  );
}

/* ── MULTI IMAGE UPLOAD ── */
function MultiImgUpload({images=[],onChange,showToast}){
  const MAX=5;
  const addImg = async(file)=>{
    if(images.length>=MAX){showToast(`Max ${MAX} photos`,false);return;}
    if(!file||!file.type.startsWith("image/")){showToast("❌ Fichier invalide",false);return;}
    showToast("⏳ Upload en cours…","share");
    try{
      const url=await window.uploadCLD(file,()=>{});
      onChange([...images,url]);
      showToast("✅ Photo ajoutée !");
    }catch(e){showToast("❌ "+e.message,false);}
  };
  const rm=(i)=>onChange(images.filter((_,j)=>j!==i));
  const ref=useRef();
  return (
    <div>
      <div style={{fontSize:11,color:"var(--text-dim)",marginBottom:8}}>Photos du produit ({images.length}/{MAX})</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {images.map((url,i)=>(
          <div key={i} style={{position:"relative",width:64,height:64,borderRadius:10,overflow:"hidden",border:"1px solid var(--border)"}}>
            <img src={url} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
            <button onClick={()=>rm(i)} style={{position:"absolute",top:2,right:2,width:18,height:18,borderRadius:"50%",background:"rgba(0,0,0,.75)",border:"none",color:"#fff",cursor:"pointer",fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",lineHeight:1}}>✕</button>
            {i===0&&<div style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(201,150,58,.85)",fontSize:8,fontWeight:700,textAlign:"center",color:"#0A0A0F",padding:"1px 0"}}>PRINCIPALE</div>}
          </div>
        ))}
        {images.length<MAX&&(
          <div onClick={()=>ref.current?.click()} style={{width:64,height:64,borderRadius:10,border:"1.5px dashed var(--gold-border)",background:"var(--gold-dim)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",fontSize:22,color:"var(--gold)"}}>
            +<input ref={ref} type="file" accept="image/*" onChange={e=>addImg(e.target.files[0])} style={{display:"none"}}/>
          </div>
        )}
      </div>
    </div>
  );
}

/* ── ZOOM IMAGE ── */
function ZoomImage({src,alt=""}){
  const [zoomed,setZoomed]=useState(false);
  const [pos,setPos]=useState({x:50,y:50});
  const ref=useRef();
  const handleMove=e=>{
    if(!zoomed)return;
    const r=ref.current.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width)*100;
    const y=((e.clientY-r.top)/r.height)*100;
    setPos({x,y});
  };
  if(!src) return <div style={{width:"100%",aspectRatio:"1/1",background:"var(--surface2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:60}}>📦</div>;
  return (
    <div ref={ref} className={`zoom-container${zoomed?" zoomed":""}`}
      style={{width:"100%",aspectRatio:"1/1",overflow:"hidden"}}
      onClick={()=>setZoomed(z=>!z)}
      onMouseMove={handleMove}
      onMouseLeave={()=>setZoomed(false)}>
      <img src={src} alt={alt} className="zoom-img"
        style={{width:"100%",height:"100%",objectFit:"cover",transform:zoomed?`scale(2.2) translate(${(pos.x-50)*0.4}%, ${(pos.y-50)*0.4}%)`:"scale(1)",transformOrigin:`${pos.x}% ${pos.y}%`,transition:zoomed?"none":"transform .3s ease"}}/>
      {!zoomed&&<div style={{position:"absolute",bottom:10,right:10,background:"rgba(0,0,0,.6)",borderRadius:"50%",width:32,height:32,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,pointerEvents:"none"}}>🔍</div>}
    </div>
  );
}

/* ── REVIEW FORM ── */
function ReviewForm({productId,store,onDone,showToast}){
  const [name,setName]=useState("");
  const [rating,setRating]=useState(5);
  const [comment,setComment]=useState("");
  const [busy,setBusy]=useState(false);
  const send=async()=>{
    if(!name.trim()||!comment.trim()){showToast("Remplis tous les champs",false);return;}
    setBusy(true);
    try{
      await store.addReview(productId,{name:name.trim(),rating,comment:comment.trim()});
      showToast("✅ Avis envoyé, merci !");
      onDone();
    }catch(e){showToast("❌ Erreur",false);}
    finally{setBusy(false);}
  };
  return (
    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      <div style={{fontSize:13,fontWeight:600,color:"var(--gold)",marginBottom:2}}>Laisser un avis</div>
      <div>
        <label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:4}}>Ton nom</label>
        <input className="inp" value={name} onChange={e=>setName(e.target.value)} placeholder="Ex: Mamadou K."/>
      </div>
      <div>
        <label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:6}}>Note</label>
        <div style={{display:"flex",gap:6}}>
          {[1,2,3,4,5].map(s=>(
            <button key={s} onClick={()=>setRating(s)} style={{fontSize:24,background:"none",border:"none",cursor:"pointer",opacity:s<=rating?1:.3,transition:"opacity .15s,transform .15s",transform:s<=rating?"scale(1.15)":"scale(1)"}}>⭐</button>
          ))}
        </div>
      </div>
      <div>
        <label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:4}}>Commentaire</label>
        <textarea className="inp" value={comment} onChange={e=>setComment(e.target.value)} placeholder="Ton avis sur le produit…" rows={3} style={{resize:"vertical"}}/>
      </div>
      <button onClick={send} disabled={busy} className="btn-gold" style={{padding:"11px 0",borderRadius:12,fontSize:14}}>
        {busy?"Envoi…":"Envoyer mon avis ⭐"}
      </button>
    </div>
  );
}

/* ── PRODUCT DETAIL PAGE ── */
function ProductDetail({product,store,cart,onAddCart,onClose,onQuickOrder,showToast,wish,onToggleWish}){
  const [activeImg,setActiveImg]=useState(0);
  const [reviews,setReviews]=useState([]);
  const [showReviewForm,setShowReviewForm]=useState(false);
  const [loadingReviews,setLoadingReviews]=useState(true);
  const [qty,setQty]=useState(1);

  const images=useMemo(()=>{
    const imgs=[];
    if(product.images?.length) imgs.push(...product.images);
    else if(product.image) imgs.push(product.image);
    return imgs;
  },[product]);

  useEffect(()=>{
    setLoadingReviews(true);
    store.getReviews(product.id).then(rv=>{setReviews(rv);setLoadingReviews(false);});
  },[product.id]);

  const avgRating=reviews.length?reviews.reduce((s,r)=>s+Number(r.rating),0)/reviews.length:Number(product.rating)||0;

  const share=()=>{
    const url=window.location.href.split('?')[0]+"?produit="+product.id;
    const txt=`🛍️ *${product.name}*\n💰 ${fmt(product.price)}\n\nVoir sur AKIT Commerce :\n${url}`;
    if(navigator.share){navigator.share({title:product.name,text:txt,url});}
    else{
      navigator.clipboard.writeText(url).then(()=>showToast("🔗 Lien copié !","share")).catch(()=>{
        window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,"_blank");
      });
    }
  };

  const shareWa=()=>{
    const url=window.location.href.split('?')[0]+"?produit="+product.id;
    const txt=`🛍️ *${product.name}*\n💰 ${fmt(product.price)}\n\nVoir sur AKIT Commerce :\n${url}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,"_blank");
  };

  const isW=wish?.find(x=>x.id===product.id);
  const bc=product.badge&&BADGES[product.badge];

  return (
    <div style={{background:"#0A0A0F",minHeight:"100vh",paddingBottom:100}}>
      {/* Header */}
      <div style={{position:"sticky",top:0,zIndex:50,background:"rgba(10,10,15,.95)",backdropFilter:"blur(20px)",borderBottom:"1px solid var(--border)",padding:"10px 14px",display:"flex",alignItems:"center",gap:12}}>
        <button onClick={onClose} className="btn-ghost" style={{width:38,height:38,borderRadius:12,fontSize:20,display:"flex",alignItems:"center",justifyContent:"center",padding:0,flexShrink:0}}>←</button>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,fontSize:14,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{product.name}</div>
        </div>
        <button onClick={()=>onToggleWish(product)} style={{width:38,height:38,borderRadius:12,background:"var(--surface2)",border:"1px solid var(--border)",fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{isW?"❤️":"🤍"}</button>
        <button onClick={share} style={{width:38,height:38,borderRadius:12,background:"var(--surface2)",border:"1px solid var(--border)",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>🔗</button>
      </div>

      {/* Gallery */}
      <div style={{background:"#0D0D14"}}>
        <div style={{position:"relative"}}>
          {bc&&<div style={{position:"absolute",top:14,left:14,zIndex:2,padding:"3px 10px",borderRadius:20,background:bc.bg,color:bc.c,fontSize:10,fontWeight:700}}>{bc.l}</div>}
          {!product.inStock&&<div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.7)",zIndex:2,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{background:"rgba(239,68,68,.9)",color:"#fff",fontWeight:700,fontSize:14,padding:"8px 20px",borderRadius:24}}>Rupture de stock</span></div>}
          <ZoomImage src={images[activeImg]} alt={product.name}/>
        </div>
        {images.length>1&&(
          <div style={{display:"flex",gap:8,padding:"10px 14px",overflowX:"auto"}}>
            {images.map((img,i)=>(
              <img key={i} src={img} alt="" className={`gallery-thumb${activeImg===i?" active":""}`} onClick={()=>setActiveImg(i)}/>
            ))}
          </div>
        )}
      </div>

      {/* Info */}
      <div style={{padding:"20px 16px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:12,marginBottom:8}}>
          <h1 className="font-display" style={{fontSize:22,fontWeight:800,lineHeight:1.2,flex:1}}>{product.name}</h1>
          <div className="font-display" style={{fontSize:22,fontWeight:900,color:"var(--gold)",flexShrink:0}}>{fmt(product.price)}</div>
        </div>
        {product.category&&<div style={{fontSize:12,color:"var(--text-dim)",marginBottom:10}}>📂 {product.category}</div>}
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
          <Stars r={avgRating} size={14}/>
          <span style={{fontSize:13,color:"var(--text-dim)"}}>{avgRating.toFixed(1)} ({reviews.length} avis)</span>
        </div>
        {product.description&&(
          <div style={{fontSize:14,color:"rgba(242,239,233,.65)",lineHeight:1.75,marginBottom:20,background:"var(--surface2)",padding:"14px",borderRadius:12,border:"1px solid var(--border)"}}>
            {product.description}
          </div>
        )}

        {/* Qty + actions */}
        {product.inStock&&(
          <>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:16,background:"var(--surface2)",borderRadius:14,padding:"10px 14px",border:"1px solid var(--border)"}}>
              <span style={{fontSize:13,color:"var(--text-dim)",flex:1}}>Quantité</span>
              <button onClick={()=>setQty(n=>Math.max(1,n-1))} className="btn-ghost" style={{width:32,height:32,borderRadius:"50%",fontSize:18,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
              <span style={{fontWeight:700,fontSize:18,minWidth:24,textAlign:"center"}}>{qty}</span>
              <button onClick={()=>setQty(n=>n+1)} className="btn-ghost" style={{width:32,height:32,borderRadius:"50%",fontSize:18,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
              <span style={{fontSize:13,color:"var(--gold)",fontWeight:700,minWidth:90,textAlign:"right"}}>{fmt(product.price*qty)}</span>
            </div>
            <div style={{display:"flex",gap:10,marginBottom:10}}>
              <button onClick={()=>{for(let i=0;i<qty;i++)onAddCart(product);}} className="btn-gold" style={{flex:1,padding:"13px 0",borderRadius:14,fontSize:14}}>
                🛒 Ajouter au panier
              </button>
              <button onClick={()=>onQuickOrder({...product,_qty:qty})} className="btn-wa" style={{flex:1,padding:"13px 0",borderRadius:14,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>
                <WaIco s={16}/> Commander
              </button>
            </div>
          </>
        )}

        {/* Partage */}
        <div style={{display:"flex",gap:8,marginBottom:24}}>
          <button onClick={share} className="btn-ghost" style={{flex:1,padding:"10px 0",borderRadius:12,fontSize:13,display:"flex",alignItems:"center",justifyContent:"center",gap:7}}>
            🔗 Copier le lien
          </button>
          <button onClick={shareWa} style={{flex:1,padding:"10px 0",borderRadius:12,border:"none",background:"rgba(37,211,102,.1)",color:"#25D366",fontWeight:600,fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:7,fontFamily:"DM Sans,sans-serif",border:"1px solid rgba(37,211,102,.2)"}}>
            <WaIco s={14}/> Partager
          </button>
        </div>

        {/* Reviews */}
        <div style={{borderTop:"1px solid var(--border)",paddingTop:20}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
            <div className="font-display" style={{fontSize:16,fontWeight:700}}>Avis clients ({reviews.length})</div>
            <button onClick={()=>setShowReviewForm(f=>!f)} className="btn-ghost" style={{padding:"6px 14px",borderRadius:10,fontSize:12}}>
              {showReviewForm?"Annuler":"+ Mon avis"}
            </button>
          </div>
          {showReviewForm&&(
            <div style={{marginBottom:18,background:"var(--surface2)",padding:"14px",borderRadius:14,border:"1px solid var(--border)"}}>
              <ReviewForm productId={product.id} store={store} onDone={()=>{setShowReviewForm(false);store.getReviews(product.id).then(setReviews);}} showToast={showToast}/>
            </div>
          )}
          {loadingReviews?<div style={{textAlign:"center",padding:"20px 0"}}><div className="spin" style={{width:24,height:24,margin:"0 auto"}}/></div>
          :reviews.length===0?<div style={{textAlign:"center",padding:"24px 0",color:"var(--text-dim)",fontSize:13}}>Aucun avis pour l'instant. Sois le premier ! 🌟</div>
          :(
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {reviews.map((r,i)=>(
                <div key={i} className="review-card">
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{width:32,height:32,borderRadius:"50%",background:"var(--gold-dim)",border:"1px solid var(--gold-border)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,color:"var(--gold)"}}>{r.name?.[0]?.toUpperCase()||"?"}</div>
                      <div>
                        <div style={{fontSize:13,fontWeight:600}}>{r.name}</div>
                        <Stars r={r.rating} size={11}/>
                      </div>
                    </div>
                  </div>
                  <p style={{fontSize:13,color:"rgba(242,239,233,.6)",lineHeight:1.55,margin:0}}>{r.comment}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── ORDER MODAL ── */
function OrderModal({cart,total,onClose,onDone,store}){
  const [v,setV]=useState(""); const [q,setQ]=useState(""); const [p,setP]=useState(""); const [pm,setPm]=useState("orange"); const [err,setErr]=useState("");
  const send=async()=>{
    if(!v.trim()||!q.trim()||!p.trim()){setErr("Remplis tous les champs");return;}
    const lines=cart.map(i=>`• ${i.emoji||"📦"} ${i.name} ×${i.qty} = ${fmt(i.price*i.qty)}`).join("\n");
    const m=PM.find(x=>x.id===pm);
    const orderData={items:cart.map(i=>({name:i.name,qty:i.qty,price:i.price})),total,ville:v,quartier:q,phone:p,paiement:m.n};
    try{await store.addOrder(orderData);}catch(e){}
    const msg=`🛍️ *COMMANDE — BOUTIQUE TRAORÉ*\n\n${lines}\n\n💰 *TOTAL: ${fmt(total)}*\n💳 ${m.n}\n\n📍 ${v} / ${q}\n📞 ${p}\n\n_AKIT Commerce — Boutique Traoré 🌍_`;
    window.open(`https://wa.me/${window.WA}?text=${encodeURIComponent(msg)}`,"_blank");
    onDone();
  };
  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{padding:"24px 18px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
          <div className="font-display" style={{fontSize:17,color:"var(--gold)"}}>Informations de livraison</div>
          <button onClick={onClose} className="btn-ghost" style={{width:32,height:32,borderRadius:8,fontSize:16}}>✕</button>
        </div>
        <div style={{background:"var(--surface2)",borderRadius:12,padding:"12px 14px",marginBottom:14,border:"1px solid var(--border)"}}>
          {cart.map(i=>(
            <div key={i.id} style={{display:"flex",justifyContent:"space-between",fontSize:13,padding:"3px 0"}}>
              <span style={{color:"var(--text-dim)"}}>{i.emoji||"📦"} {i.name} ×{i.qty}</span>
              <span style={{color:"var(--gold)",fontWeight:700}}>{fmt(i.price*i.qty)}</span>
            </div>
          ))}
          <div style={{borderTop:"1px solid var(--border)",marginTop:8,paddingTop:8,display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:14}}>
            <span>Total</span><span style={{color:"var(--gold)"}}>{fmt(total)}</span>
          </div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
          <div><label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:4}}>🏙 Ville</label><input className="inp" value={v} onChange={e=>setV(e.target.value)} placeholder="Douala, Yaoundé…"/></div>
          <div><label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:4}}>🏘 Quartier</label><input className="inp" value={q} onChange={e=>setQ(e.target.value)} placeholder="Akwa, Bonamoussadi…"/></div>
          <div><label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:4}}>📞 Téléphone</label><input className="inp" type="tel" value={p} onChange={e=>setP(e.target.value)} placeholder="+237 6XX XXX XXX"/></div>
        </div>
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,color:"var(--text-dim)",marginBottom:8}}>💳 Paiement</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
            {PM.map(m=>(
              <div key={m.id} className={`pmcard${pm===m.id?" sel":""}`} onClick={()=>setPm(m.id)}>
                <span style={{fontSize:16}}>{m.icon}</span>
                <span style={{fontSize:12,fontWeight:600,lineHeight:1.2}}>{m.n}</span>
              </div>
            ))}
          </div>
        </div>
        {err&&<div style={{color:"#ef4444",fontSize:12,marginBottom:10,textAlign:"center"}}>{err}</div>}
        <button onClick={send} className="btn-wa" style={{width:"100%",padding:"13px 0",borderRadius:14,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",gap:9}}>
          <WaIco s={18}/> Confirmer & envoyer
        </button>
      </div>
    </div>
  );
}

/* ── QUICK ORDER ── */
function QuickModal({product,onClose,onDone,store}){
  const [v,setV]=useState(""); const [q,setQ]=useState(""); const [p,setP]=useState("");
  const [qty,setQty]=useState(product._qty||1); const [pm,setPm]=useState("orange"); const [err,setErr]=useState("");
  const total=product.price*qty;
  const send=async()=>{
    if(!v.trim()||!q.trim()||!p.trim()){setErr("Remplis tous les champs");return;}
    const m=PM.find(x=>x.id===pm);
    const orderData={items:[{name:product.name,qty,price:product.price}],total,ville:v,quartier:q,phone:p,paiement:m.n};
    try{await store.addOrder(orderData);}catch(e){}
    const msg=`🛍️ *COMMANDE DIRECTE — BOUTIQUE TRAORÉ*\n\n• ${product.emoji||"📦"} *${product.name}* ×${qty} = ${fmt(total)}\n\n💰 *TOTAL: ${fmt(total)}*\n💳 ${m.n}\n\n📍 ${v} / ${q}\n📞 ${p}\n\n_AKIT Commerce 🌍_`;
    window.open(`https://wa.me/${window.WA}?text=${encodeURIComponent(msg)}`,"_blank");
    onDone();
  };
  return (
    <div className="overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" style={{padding:"22px 18px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
          <div style={{display:"flex",gap:12,alignItems:"center"}}>
            <div style={{width:50,height:50,borderRadius:12,overflow:"hidden",flexShrink:0,background:"var(--surface2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>
              {product.images?.[0]||product.image?<img src={product.images?.[0]||product.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:product.emoji||"📦"}
            </div>
            <div>
              <div style={{fontWeight:700,fontSize:14,marginBottom:2}}>{product.name}</div>
              <div style={{color:"var(--gold)",fontWeight:700,fontSize:15}}>{fmt(product.price)}</div>
            </div>
          </div>
          <button onClick={onClose} className="btn-ghost" style={{width:32,height:32,borderRadius:8,fontSize:16,flexShrink:0}}>✕</button>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:14,background:"var(--surface2)",borderRadius:12,padding:"10px 14px",border:"1px solid var(--border)"}}>
          <span style={{fontSize:13,color:"var(--text-dim)",flex:1}}>Quantité</span>
          <button onClick={()=>setQty(n=>Math.max(1,n-1))} className="btn-ghost" style={{width:30,height:30,borderRadius:"50%",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",padding:0}}>−</button>
          <span style={{fontWeight:700,fontSize:17,minWidth:22,textAlign:"center"}}>{qty}</span>
          <button onClick={()=>setQty(n=>n+1)} className="btn-ghost" style={{width:30,height:30,borderRadius:"50%",fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",padding:0}}>+</button>
          <span style={{fontSize:13,color:"var(--gold)",fontWeight:700,minWidth:80,textAlign:"right"}}>{fmt(total)}</span>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:9,marginBottom:14}}>
          <div><label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:4}}>🏙 Ville</label><input className="inp" value={v} onChange={e=>setV(e.target.value)} placeholder="Douala…"/></div>
          <div><label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:4}}>🏘 Quartier</label><input className="inp" value={q} onChange={e=>setQ(e.target.value)} placeholder="Akwa…"/></div>
          <div><label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:4}}>📞 Téléphone</label><input className="inp" type="tel" value={p} onChange={e=>setP(e.target.value)} placeholder="+237 6XX XXX XXX"/></div>
        </div>
        <div style={{marginBottom:13}}>
          <div style={{fontSize:11,color:"var(--text-dim)",marginBottom:7}}>💳 Paiement</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
            {PM.map(m=>(
              <div key={m.id} className={`pmcard${pm===m.id?" sel":""}`} onClick={()=>setPm(m.id)}>
                <span style={{fontSize:15}}>{m.icon}</span>
                <span style={{fontSize:11,fontWeight:600,lineHeight:1.2}}>{m.n}</span>
              </div>
            ))}
          </div>
        </div>
        {err&&<div style={{color:"#ef4444",fontSize:12,marginBottom:10,textAlign:"center"}}>{err}</div>}
        <button onClick={send} className="btn-wa" style={{width:"100%",padding:"12px 0",borderRadius:13,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
          <WaIco s={17}/> Commander — {fmt(total)}
        </button>
      </div>
    </div>
  );
}

/* ════════════════════════════════
   ADMIN PANEL
════════════════════════════════ */
function AdminPanel({products,onBack,onLogout,store,showToast}){
  const empty={name:"",price:"",category:"",description:"",emoji:"📦",images:[],image:"",inStock:true,badge:"",rating:"4.5",reviews:"0"};
  const [form,setForm]=useState(empty);
  const [editId,setEditId]=useState(null);
  const [orders,setOrders]=useState([]);
  const [loadOrders,setLoadOrders]=useState(true);
  const [tab,setTab]=useState("products");

  useEffect(()=>{
    store.getOrders().then(o=>{setOrders(o);setLoadOrders(false);});
  },[]);

  const save=async()=>{
    if(!form.name||!form.price){showToast("Nom et prix requis",false);return;}
    const imgs=form.images?.length?form.images:(form.image?[form.image]:[]);
    const data={...form,price:Number(form.price),images:imgs,image:imgs[0]||""};
    try{
      if(editId!==null){await store.upd(editId,data);showToast("✅ Produit modifié !");}
      else{await store.add(data);showToast("✅ Produit ajouté !");}
    }catch(e){showToast("❌ "+e.message,false);}
    setForm(empty);setEditId(null);
  };

  const del=async(id)=>{ try{await store.del(id);showToast("🗑 Supprimé");}catch(e){showToast("❌ Erreur",false);} };

  const startEdit=(p)=>{
    setForm({name:p.name,price:String(p.price),category:p.category||"",description:p.description||"",emoji:p.emoji||"📦",images:p.images||[],image:p.image||"",inStock:p.inStock,badge:p.badge||"",rating:String(p.rating||4.5),reviews:String(p.reviews||0)});
    setEditId(p.id);
    window.scrollTo({top:0,behavior:"smooth"});
  };

  const totalRevenue=orders.reduce((s,o)=>s+Number(o.total||0),0);
  const topProducts=useMemo(()=>{
    const map={};
    orders.forEach(o=>(o.items||[]).forEach(it=>{map[it.name]=(map[it.name]||0)+Number(it.qty||1);}));
    return Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,5);
  },[orders]);

  const stats=[
    {l:"Produits",v:products.length,icon:"📦",c:"var(--gold)"},
    {l:"En stock",v:products.filter(p=>p.inStock).length,icon:"✅",c:"#10b981"},
    {l:"Rupture",v:products.filter(p=>!p.inStock).length,icon:"❌",c:"#ef4444"},
    {l:"Commandes",v:orders.length,icon:"🛍",c:"#6366f1"},
    {l:"Revenu total",v:fmt(totalRevenue),icon:"💰",c:"var(--gold)",wide:true},
  ];

  const exportCSV=()=>{
    const rows=[["Date","Produits","Total","Ville","Quartier","Phone","Paiement"],...orders.map(o=>[
      o.createdAt?.toDate?.()?.toLocaleDateString("fr-FR")||o.createdAt||"",
      (o.items||[]).map(i=>`${i.name}x${i.qty}`).join(" | "),
      o.total,o.ville,o.quartier,o.phone,o.paiement
    ])];
    const csv=rows.map(r=>r.map(c=>`"${c}"`).join(",")).join("\n");
    const a=document.createElement("a");
    a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
    a.download="commandes_akit.csv";a.click();
    showToast("📊 Export téléchargé !");
  };

  return (
    <div style={{minHeight:"100vh",background:"#0A0A0F",color:"var(--text)",fontFamily:"DM Sans,sans-serif"}}>
      {/* Header admin */}
      <div style={{position:"sticky",top:0,zIndex:100,background:"rgba(10,10,15,.97)",backdropFilter:"blur(20px)",borderBottom:"1px solid var(--gold-border)",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:38,height:38,borderRadius:10,background:"linear-gradient(135deg,var(--gold),var(--gold-light))",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"Syne,sans-serif",fontWeight:900,fontSize:16,color:"#0A0A0F"}}>BT</div>
          <div>
            <div className="font-display" style={{fontSize:15,color:"var(--gold)",fontWeight:700}}>Admin — Boutique Traoré</div>
            <div style={{fontSize:11,color:"var(--text-dim)"}}>{store.fb?"🔥 Firebase":"💾 Local"} · ☁ Cloudinary</div>
          </div>
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={onBack} className="btn-ghost" style={{padding:"7px 14px",borderRadius:10,fontSize:13}}>👁 Boutique</button>
          <button onClick={onLogout} style={{padding:"7px 14px",borderRadius:10,border:"1px solid rgba(239,68,68,.4)",background:"rgba(239,68,68,.08)",color:"#ef4444",cursor:"pointer",fontFamily:"DM Sans,sans-serif",fontSize:13}}>🚪 Déco</button>
        </div>
      </div>

      <div style={{maxWidth:1100,margin:"0 auto",padding:"20px 14px"}}>
        {/* Stats */}
        <div className="stats-row" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10,marginBottom:20}}>
          {stats.filter(s=>!s.wide).map((s,i)=>(
            <div key={i} className="stat-card" style={{borderLeft:`3px solid ${s.c}`}}>
              <div style={{fontSize:20}}>{s.icon}</div>
              <div className="font-display" style={{fontSize:24,fontWeight:800,color:s.c}}>{s.v}</div>
              <div style={{fontSize:11,color:"var(--text-dim)"}}>{s.l}</div>
            </div>
          ))}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:24}}>
          {stats.filter(s=>s.wide).map((s,i)=>(
            <div key={i} className="stat-card" style={{borderLeft:`3px solid ${s.c}`,gridColumn:"1/-1"}}>
              <div style={{display:"flex",alignItems:"center",gap:14}}>
                <span style={{fontSize:24}}>{s.icon}</span>
                <div>
                  <div className="font-display" style={{fontSize:22,fontWeight:800,color:s.c}}>{s.v}</div>
                  <div style={{fontSize:11,color:"var(--text-dim)"}}>{s.l}</div>
                </div>
                <button onClick={exportCSV} className="btn-gold" style={{marginLeft:"auto",padding:"8px 16px",borderRadius:10,fontSize:12}}>📊 Export CSV</button>
              </div>
            </div>
          ))}
        </div>

        {/* Tabs */}
        <div style={{display:"flex",gap:8,marginBottom:20}}>
          {["products","orders","top"].map(t=>(
            <button key={t} onClick={()=>setTab(t)} style={{padding:"8px 18px",borderRadius:20,border:`1px solid ${tab===t?"var(--gold)":"var(--border)"}`,background:tab===t?"var(--gold-dim)":"var(--surface2)",color:tab===t?"var(--gold)":"var(--text-dim)",cursor:"pointer",fontFamily:"DM Sans,sans-serif",fontWeight:600,fontSize:13}}>
              {t==="products"?"📦 Produits":t==="orders"?"🛍 Commandes":"⭐ Top vendus"}
            </button>
          ))}
        </div>

        {/* Tab Produits */}
        {tab==="products"&&(
          <div className="admin-split" style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
            {/* Form */}
            <div style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:18,padding:22}}>
              <div className="font-display" style={{fontSize:15,color:"var(--gold)",marginBottom:16,fontWeight:700}}>{editId!==null?"✏️ Modifier":"➕ Ajouter un produit"}</div>
              <div style={{display:"flex",flexDirection:"column",gap:11}}>
                <MultiImgUpload images={form.images||[]} onChange={imgs=>setForm(f=>({...f,images:imgs,image:imgs[0]||""}))} showToast={showToast}/>
                {!(form.images?.length)&&(
                  <div>
                    <label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:4}}>Emoji (si pas d'image)</label>
                    <input className="inp" value={form.emoji} onChange={e=>setForm(f=>({...f,emoji:e.target.value}))} placeholder="📦" style={{textAlign:"center",fontSize:22}}/>
                  </div>
                )}
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:9}}>
                  <div>
                    <label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:4}}>Badge</label>
                    <select className="inp" value={form.badge} onChange={e=>setForm(f=>({...f,badge:e.target.value}))} style={{cursor:"pointer"}}>
                      <option value="">Aucun</option>
                      <option value="nouveau">🆕 Nouveau</option>
                      <option value="promo">🔥 Promo</option>
                      <option value="bestseller">⭐ Bestseller</option>
                      <option value="luxe">💎 Luxe</option>
                      <option value="tendance">📈 Tendance</option>
                      <option value="exclusif">✨ Exclusif</option>
                    </select>
                  </div>
                  <div>
                    <label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:4}}>Catégorie</label>
                    <input className="inp" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))} placeholder="Mode, Tech…"/>
                  </div>
                </div>
                <div>
                  <label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:4}}>Nom du produit *</label>
                  <input className="inp" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Ex: Sac cuir premium"/>
                </div>
                <div>
                  <label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:4}}>Prix (FCFA) *</label>
                  <input className="inp" type="number" value={form.price} onChange={e=>setForm(f=>({...f,price:e.target.value}))} placeholder="25000"/>
                </div>
                <div>
                  <label style={{fontSize:11,color:"var(--text-dim)",display:"block",marginBottom:4}}>Description</label>
                  <textarea className="inp" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} placeholder="Décrivez le produit…" rows={3} style={{resize:"vertical"}}/>
                </div>
                <div style={{display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:13,color:"var(--text-dim)"}}>En stock</span>
                  <div className="toggle" style={{background:form.inStock?"#10b981":"#374151"}} onClick={()=>setForm(f=>({...f,inStock:!f.inStock}))}>
                    <div className="toggle-thumb" style={{left:form.inStock?24:3}}/>
                  </div>
                  <span style={{fontSize:12,color:form.inStock?"#10b981":"#ef4444"}}>{form.inStock?"Disponible":"Rupture"}</span>
                </div>
                <div style={{display:"flex",gap:9,marginTop:4}}>
                  <button onClick={save} className="btn-gold" style={{flex:1,padding:"11px 0",borderRadius:12,fontSize:14}}>{editId!==null?"💾 Enregistrer":"➕ Ajouter"}</button>
                  {editId!==null&&<button onClick={()=>{setForm(empty);setEditId(null);}} className="btn-ghost" style={{padding:"11px 16px",borderRadius:12,fontSize:13}}>Annuler</button>}
                </div>
              </div>
            </div>
            {/* Liste produits */}
            <div style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:18,padding:22,maxHeight:700,overflowY:"auto"}}>
              <div className="font-display" style={{fontSize:15,color:"var(--gold)",marginBottom:16,fontWeight:700}}>📦 Produits ({products.length})</div>
              {products.length===0?(
                <div style={{textAlign:"center",padding:"40px 20px",color:"var(--text-dim)"}}>
                  <div style={{fontSize:36,marginBottom:10}}>📭</div>
                  <p style={{fontSize:13}}>Aucun produit encore.</p>
                </div>
              ):products.map(p=>(
                <div key={p.id} style={{display:"flex",gap:11,alignItems:"center",padding:"11px 0",borderBottom:"1px solid var(--border)"}}>
                  <div style={{width:44,height:44,borderRadius:10,overflow:"hidden",flexShrink:0,background:"var(--surface2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>
                    {p.images?.[0]||p.image?<img src={p.images?.[0]||p.image} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:p.emoji||"📦"}
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{p.name}</div>
                    <div style={{fontSize:12,color:"var(--gold)",fontWeight:700}}>{fmt(p.price)}</div>
                    <div style={{display:"flex",gap:4,marginTop:2}}>
                      {p.images?.length>1&&<span style={{fontSize:9,background:"var(--gold-dim)",color:"var(--gold)",borderRadius:5,padding:"1px 5px"}}>📸 {p.images.length}</span>}
                      <span style={{fontSize:9,background:p.inStock?"rgba(16,185,129,.2)":"rgba(239,68,68,.2)",color:p.inStock?"#10b981":"#ef4444",borderRadius:5,padding:"1px 5px"}}>{p.inStock?"✅":"❌"}</span>
                    </div>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:5}}>
                    <button onClick={()=>startEdit(p)} style={{padding:"5px 9px",borderRadius:7,border:"1px solid #6366f1",background:"rgba(99,102,241,.12)",color:"#818cf8",cursor:"pointer",fontSize:11}}>✏️</button>
                    <button onClick={()=>del(p.id)} style={{padding:"5px 9px",borderRadius:7,border:"1px solid #ef4444",background:"rgba(239,68,68,.12)",color:"#ef4444",cursor:"pointer",fontSize:11}}>🗑</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Tab Commandes */}
        {tab==="orders"&&(
          <div style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:18,padding:22}}>
            <div className="font-display" style={{fontSize:15,color:"var(--gold)",marginBottom:16,fontWeight:700}}>🛍 Commandes ({orders.length})</div>
            {loadOrders?<div style={{textAlign:"center",padding:"30px"}}><div className="spin" style={{width:28,height:28,margin:"0 auto"}}/></div>
            :orders.length===0?<div style={{textAlign:"center",padding:"40px",color:"var(--text-dim)",fontSize:13}}>Aucune commande pour l'instant.</div>
            :(
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {orders.map((o,i)=>(
                  <div key={o.id||i} style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:"14px 16px"}}>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                      <div style={{fontSize:12,color:"var(--text-dim)"}}>{o.createdAt?.toDate?.()?.toLocaleString("fr-FR")||o.createdAt?.slice?.(0,16)||"—"}</div>
                      <div className="font-display" style={{color:"var(--gold)",fontWeight:700,fontSize:14}}>{fmt(o.total||0)}</div>
                    </div>
                    <div style={{fontSize:13,marginBottom:6}}>{(o.items||[]).map(it=>`${it.name} ×${it.qty}`).join(", ")}</div>
                    <div style={{fontSize:12,color:"var(--text-dim)"}}>📍 {o.ville} / {o.quartier} · 📞 {o.phone} · 💳 {o.paiement}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Tab Top vendus */}
        {tab==="top"&&(
          <div style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:18,padding:22}}>
            <div className="font-display" style={{fontSize:15,color:"var(--gold)",marginBottom:16,fontWeight:700}}>⭐ Top 5 produits commandés</div>
            {topProducts.length===0?<div style={{textAlign:"center",padding:"40px",color:"var(--text-dim)",fontSize:13}}>Pas encore de données.</div>:(
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                {topProducts.map(([name,qty],i)=>(
                  <div key={i} style={{display:"flex",alignItems:"center",gap:14,padding:"12px 16px",background:"var(--surface)",borderRadius:12,border:"1px solid var(--border)"}}>
                    <div className="font-display" style={{fontSize:20,fontWeight:900,color:i===0?"var(--gold)":i===1?"#B0B0C0":i===2?"#C9843A":"var(--text-dim)",minWidth:28}}>#{i+1}</div>
                    <div style={{flex:1,fontWeight:600,fontSize:14}}>{name}</div>
                    <div style={{fontWeight:700,fontSize:14,color:"var(--gold)"}}>{qty} vente{qty>1?"s":""}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

/* ── ADMIN LOGIN ── */
function AdminLogin({onSuccess,onBack}){
  const [pass,setPass]=useState(""); const [err,setErr]=useState("");
  const attempt=()=>{
    if(pass===window.ADMIN_SECRET){ onSuccess(); }
    else{ setErr("Code incorrect"); setPass(""); }
  };
  return (
    <div style={{minHeight:"100vh",background:"#0A0A0F",display:"flex",alignItems:"center",justifyContent:"center",padding:20,fontFamily:"DM Sans,sans-serif"}}>
      <div style={{width:"100%",maxWidth:360,animation:"fadeUp .5s ease both"}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{width:64,height:64,borderRadius:18,background:"linear-gradient(135deg,var(--gold),var(--gold-light))",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,margin:"0 auto 16px",boxShadow:"0 8px 32px rgba(201,150,58,.3)"}}>🔐</div>
          <div className="font-display" style={{fontSize:24,color:"var(--gold)",fontWeight:800,marginBottom:4}}>Accès Administrateur</div>
          <div style={{fontSize:13,color:"var(--text-dim)"}}>Boutique Traoré — AKIT</div>
        </div>
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:18,padding:"24px 20px"}}>
          <input className="inp" type="password" value={pass} onChange={e=>{setPass(e.target.value);setErr("");}}
            onKeyDown={e=>e.key==="Enter"&&attempt()} placeholder="Code secret admin…"
            style={{textAlign:"center",letterSpacing:4,fontSize:16,marginBottom:err?8:14}} autoComplete="new-password"/>
          {err&&<div style={{color:"#ef4444",fontSize:12,textAlign:"center",marginBottom:10}}>{err}</div>}
          <button onClick={attempt} className="btn-gold" style={{width:"100%",padding:"12px 0",borderRadius:12,fontSize:14}}>Accéder</button>
        </div>
        <button onClick={onBack} style={{display:"block",margin:"16px auto 0",background:"none",border:"none",color:"var(--text-ghost)",cursor:"pointer",fontSize:13,fontFamily:"DM Sans,sans-serif"}}>← Retour à la boutique</button>
      </div>
    </div>
  );
}

/* ════════════════════════════════
   APP PRINCIPALE
════════════════════════════════ */
function App(){
  const [page,setPage]=useState("home");
  const [products,setProducts]=useState([]);
  const [loading,setLoading]=useState(true);
  const [cart,setCart]=useState([]);
  const [wish,setWish]=useState([]);
  const [search,setSearch]=useState("");
  const [toast,setToast]=useState(null);
  const [adminLogged,setAdminLogged]=useState(false);
  const [filterCat,setFilterCat]=useState("all");
  const [orderModal,setOrderModal]=useState(false);
  const [quickProd,setQuickProd]=useState(null);
  const [menuOpen,setMenuOpen]=useState(false);
  const [selectedProduct,setSelectedProduct]=useState(null);
  const [tapCount,setTapCount]=useState(0);
  const tapTimer=useRef(null);
  const store=useStore();

  useEffect(()=>{
    setLoading(true);
    if(store.fb){
      const unsub=store.sub(ps=>{setProducts(ps);setLoading(false);});
      return ()=>unsub&&unsub();
    } else {
      store.load().then(ps=>{setProducts(ps);setLoading(false);});
    }
  },[]);

  const showToast=(msg,ok=true)=>{ setToast({msg,ok}); setTimeout(()=>setToast(null),2800); };

  const handleLogoTap=()=>{
    const next=tapCount+1; setTapCount(next); clearTimeout(tapTimer.current);
    if(next>=3){ setTapCount(0); setPage("adminLogin"); setMenuOpen(false); }
    else{ tapTimer.current=setTimeout(()=>setTapCount(0),1000); }
  };

  /* CART */
  const addCart=p=>{
    if(!p.inStock)return;
    setCart(c=>{const e=c.find(x=>x.id===p.id);return e?c.map(x=>x.id===p.id?{...x,qty:x.qty+1}:x):[...c,{...p,qty:1}];});
    showToast(`✅ Ajouté au panier`);
  };
  const rmCart=id=>setCart(c=>c.filter(x=>x.id!==id));
  const updQty=(id,d)=>setCart(c=>c.map(x=>x.id===id?{...x,qty:Math.max(1,x.qty+d)}:x));
  const cartTotal=cart.reduce((s,x)=>s+Number(x.price)*x.qty,0);
  const cartCount=cart.reduce((s,x)=>s+x.qty,0);

  /* WISHLIST */
  const toggleWish=p=>{
    const has=wish.find(x=>x.id===p.id);
    setWish(w=>has?w.filter(x=>x.id!==p.id):[...w,p]);
    showToast(has?"💔 Retiré des favoris":"❤️ Ajouté aux favoris");
  };

  const navTo=p=>{setPage(p);setMenuOpen(false);setSelectedProduct(null);};
  const cats=["all",...Array.from(new Set(products.map(p=>p.category).filter(Boolean)))];
  const filtered=products.filter(p=>(filterCat==="all"||p.category===filterCat)&&(search===""||p.name.toLowerCase().includes(search.toLowerCase())));

  /* ═══ ADMIN ═══ */
  if(page==="adminLogin") return <AdminLogin onSuccess={()=>{setAdminLogged(true);setPage("admin");}} onBack={()=>setPage("home")}/>;
  if(page==="admin"&&adminLogged) return (
    <>
      <AdminPanel products={products} onBack={()=>setPage("home")} onLogout={()=>{setAdminLogged(false);setPage("home");}} store={store} showToast={showToast}/>
      {toast&&<Toast msg={toast.msg} ok={toast.ok}/>}
    </>
  );

  /* ═══ PAGE PRODUIT DETAIL ═══ */
  if(selectedProduct) return (
    <>
      <ProductDetail product={selectedProduct} store={store} cart={cart} onAddCart={addCart}
        onClose={()=>setSelectedProduct(null)} onQuickOrder={p=>{setSelectedProduct(null);setQuickProd(p);}}
        showToast={showToast} wish={wish} onToggleWish={toggleWish}/>
      {quickProd&&<QuickModal product={quickProd} onClose={()=>setQuickProd(null)} onDone={()=>{setQuickProd(null);setPage("orderDone");}} store={store}/>}
      {toast&&<Toast msg={toast.msg} ok={toast.ok}/>}
    </>
  );

  return (
    <div style={{minHeight:"100vh",background:"#0A0A0F",color:"var(--text)",fontFamily:"DM Sans,sans-serif"}}>
      {orderModal&&<OrderModal cart={cart} total={cartTotal} onClose={()=>setOrderModal(false)} onDone={()=>{setCart([]);setOrderModal(false);setPage("orderDone");}} store={store}/>}
      {quickProd&&<QuickModal product={quickProd} onClose={()=>setQuickProd(null)} onDone={()=>{setQuickProd(null);setPage("orderDone");}} store={store}/>}

      {menuOpen&&<div onClick={()=>setMenuOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.75)",zIndex:240,backdropFilter:"blur(4px)"}}/>}

      {/* ═══ BANNER ═══ */}
      <div className="banner">
        <div style={{display:"flex",animation:"marquee 35s linear infinite",whiteSpace:"nowrap"}}>
          {[BANNER_TXT,BANNER_TXT].map((txt,i)=>(
            <span key={i} style={{paddingRight:60,fontSize:11,fontWeight:700,color:"#0A0A0F",letterSpacing:".05em",flexShrink:0}}>{txt}</span>
          ))}
        </div>
      </div>

      {/* ═══ HEADER ═══ */}
      <header className="header" style={{padding:"8px 12px",display:"flex",alignItems:"center",gap:10}}>
        <button onClick={()=>setMenuOpen(m=>!m)} className="btn-ghost" style={{width:38,height:38,borderRadius:12,fontSize:18,display:"flex",alignItems:"center",justifyContent:"center",padding:0,flexShrink:0}}>☰</button>

        {/* LOGO BT — triple tap = admin */}
        <div onClick={handleLogoTap} style={{width:38,height:38,borderRadius:11,background:"linear-gradient(135deg,var(--gold),var(--gold-light))",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,userSelect:"none",boxShadow:"0 2px 12px rgba(201,150,58,.3)"}}>
          <span className="font-display" style={{fontSize:15,fontWeight:900,color:"#0A0A0F",letterSpacing:"-0.5px"}}>BT</span>
        </div>

        <input value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="Rechercher un produit…"
          style={{flex:1,background:"var(--surface3)",border:"1px solid var(--border)",borderRadius:11,padding:"8px 12px",color:"var(--text)",fontFamily:"DM Sans,sans-serif",fontSize:13,outline:"none",transition:"border-color .2s"}}
          onFocus={e=>e.target.style.borderColor="var(--gold)"}
          onBlur={e=>e.target.style.borderColor="var(--border)"}/>

        <button onClick={()=>navTo("favorites")} style={{position:"relative",background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:12,width:38,height:38,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          ❤️
          {wish.length>0&&<span style={{position:"absolute",top:-4,right:-4,background:"#ef4444",color:"#fff",borderRadius:"50%",width:16,height:16,fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{wish.length}</span>}
        </button>
        <button onClick={()=>navTo("cart")} style={{position:"relative",background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:12,width:38,height:38,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
          🛒
          {cartCount>0&&<span style={{position:"absolute",top:-4,right:-4,background:"var(--gold)",color:"#0A0A0F",borderRadius:"50%",width:16,height:16,fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{cartCount}</span>}
        </button>
      </header>

      {/* ═══ SIDEBAR ═══ */}
      <div className="sidebar" style={{transform:menuOpen?"translateX(0)":"translateX(-100%)"}}>
        <div style={{padding:"20px 16px 14px",borderBottom:"1px solid var(--border)"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <div style={{width:40,height:40,borderRadius:12,background:"linear-gradient(135deg,var(--gold),var(--gold-light))",display:"flex",alignItems:"center",justifyContent:"center"}}>
                <span className="font-display" style={{fontSize:16,fontWeight:900,color:"#0A0A0F"}}>BT</span>
              </div>
              <div>
                <div className="font-display" style={{fontSize:15,fontWeight:800,color:"var(--gold)"}}>Boutique Traoré</div>
                <div style={{fontSize:10,color:"var(--text-dim)"}}>AKIT Commerce</div>
              </div>
            </div>
            <button onClick={()=>setMenuOpen(false)} className="btn-ghost" style={{width:32,height:32,borderRadius:8,fontSize:16,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
          </div>
          <div style={{display:"flex",gap:6}}>
            <span style={{fontSize:10,padding:"3px 8px",borderRadius:6,background:store.fb?"rgba(16,185,129,.1)":"var(--gold-dim)",color:store.fb?"#10b981":"var(--gold)",border:`1px solid ${store.fb?"rgba(16,185,129,.25)":"var(--gold-border)"}`}}>
              {store.fb?"🔥 Firebase":"💾 Local"}
            </span>
          </div>
        </div>
        <nav style={{flex:1,padding:"12px 10px",display:"flex",flexDirection:"column",gap:4,overflowY:"auto"}}>
          {[
            {icon:"🏠",label:"Accueil",p:"home"},
            {icon:"💳",label:"Paiement",p:"payment"},
            {icon:"❤️",label:"Favoris",p:"favorites",badge:wish.length||null},
            {icon:"🛒",label:"Panier",p:"cart",badge:cartCount||null},
          ].map((item,i)=>(
            <button key={i} className={`nav-item${page===item.p?" active":""}`} onClick={()=>navTo(item.p)}>
              <span style={{fontSize:18}}>{item.icon}</span>
              <span>{item.label}</span>
              {item.badge?<span style={{marginLeft:"auto",background:"var(--gold)",color:"#0A0A0F",borderRadius:"50%",width:20,height:20,fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{item.badge}</span>:null}
            </button>
          ))}
        </nav>
        <div style={{padding:"12px 14px",borderTop:"1px solid var(--border)"}}>
          <div style={{fontSize:10,color:"var(--text-ghost)",textAlign:"center",lineHeight:1.8}}>Boutique Traoré — AKIT Commerce © 2026<br/>📱 +237 698 083 058</div>
        </div>
      </div>

      {/* ═══ CONTENU PRINCIPAL ═══ */}
      <div style={{paddingTop:90}}>

        {/* ──── HOME ──── */}
        {page==="home"&&(
          <main style={{maxWidth:1100,margin:"0 auto",padding:"0 12px 80px"}}>
            {/* HERO */}
            <div style={{margin:"14px 0 18px",borderRadius:22,overflow:"hidden",position:"relative",background:"linear-gradient(135deg,#0D0B06,#16120A,#0A0A0F)",border:"1px solid var(--gold-border)",padding:"32px 24px 32px"}}>
              <div style={{position:"absolute",top:-60,right:-40,width:280,height:280,borderRadius:"50%",background:"radial-gradient(circle,rgba(201,150,58,.12),transparent 70%)",pointerEvents:"none"}}/>
              <div style={{position:"absolute",bottom:-40,left:-20,width:200,height:200,borderRadius:"50%",background:"radial-gradient(circle,rgba(201,150,58,.07),transparent 70%)",pointerEvents:"none"}}/>
              <div style={{position:"relative",zIndex:1,maxWidth:480}}>
                <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"var(--gold-dim)",border:"1px solid var(--gold-border)",borderRadius:20,padding:"5px 14px",marginBottom:14}}>
                  <span style={{animation:"pulse 2s infinite",display:"block",fontSize:11}}>🌍</span>
                  <span style={{fontSize:11,fontWeight:700,color:"var(--gold)",letterSpacing:".05em"}}>190+ PAYS · LIVRAISON INTERNATIONALE</span>
                </div>
                <h1 className="font-display" style={{fontSize:"clamp(24px,5vw,40px)",fontWeight:900,lineHeight:1.1,marginBottom:10}}>
                  <span style={{color:"#F2EFE9"}}>Bienvenue à la </span>
                  <span style={{color:"var(--gold)"}}>Boutique<br/>Traoré</span>
                </h1>
                <p style={{fontSize:13,color:"rgba(242,239,233,.45)",marginBottom:22,lineHeight:1.7}}>Produits authentiques · Livraison rapide · Satisfaction garantie</p>
                <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                  <button onClick={()=>navTo("payment")} className="btn-gold" style={{padding:"11px 22px",borderRadius:12,fontSize:13}}>💳 Modes de paiement</button>
                  <a href={`https://wa.me/${window.WA}`} target="_blank" rel="noreferrer" className="btn-wa" style={{padding:"11px 22px",borderRadius:12,fontSize:13,textDecoration:"none",display:"inline-flex",alignItems:"center",gap:7}}><WaIco s={15}/> Contacter</a>
                </div>
              </div>
            </div>

            {/* STATS */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:20}}>
              {[
                {val:"190+",lbl:"Pays",icon:"🌍"},
                {val:"100%",lbl:"Sécurisé",icon:"🔒"},
                {val:"24/7",lbl:"Support",icon:"💬"},
                {val:"★4.9",lbl:"Note",icon:"⭐"},
              ].map((s,i)=>(
                <div key={i} style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:14,padding:"12px 10px",textAlign:"center"}}>
                  <div style={{fontSize:18,marginBottom:3}}>{s.icon}</div>
                  <div className="font-display" style={{fontWeight:800,fontSize:16,color:"var(--gold)"}}>{s.val}</div>
                  <div style={{fontSize:9,color:"var(--text-dim)",marginTop:2}}>{s.lbl}</div>
                </div>
              ))}
            </div>

            {/* FILTRES */}
            {cats.length>1&&(
              <div style={{display:"flex",gap:7,overflowX:"auto",paddingBottom:6,marginBottom:18,scrollbarWidth:"none"}}>
                {cats.map(c=>(
                  <button key={c} className={`cat-pill${filterCat===c?" active":""}`} onClick={()=>setFilterCat(c)}>
                    {c==="all"?"Tout":c}
                  </button>
                ))}
              </div>
            )}

            {/* PRODUITS */}
            {loading?(
              <div style={{textAlign:"center",padding:"70px 20px"}}>
                <div className="spin" style={{width:36,height:36,margin:"0 auto 16px"}}/>
                <p style={{color:"var(--text-dim)",fontSize:14}}>Chargement…</p>
              </div>
            ):filtered.length===0?(
              <div style={{textAlign:"center",padding:"50px 20px"}}>
                <div style={{fontSize:60,marginBottom:12,opacity:.2}}>🛍</div>
                <div className="font-display" style={{fontSize:18,color:"var(--text-ghost)",marginBottom:8,fontWeight:700}}>
                  {search?"Aucun résultat":"BOUTIQUE EN PRÉPARATION"}
                </div>
                <div style={{fontSize:13,color:"var(--text-ghost)",lineHeight:1.8,maxWidth:300,margin:"0 auto"}}>
                  {search?`"${search}" introuvable`:("L'admin ajoutera bientôt des articles.")}
                </div>
              </div>
            ):(
              <div className="products-grid" style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(165px,1fr))",gap:12}}>
                {filtered.map(p=>{
                  const isW=wish.find(x=>x.id===p.id);
                  const bc=p.badge&&BADGES[p.badge];
                  const mainImg=p.images?.[0]||p.image||"";
                  return (
                    <div key={p.id} className="pcard" style={{position:"relative"}} onClick={()=>setSelectedProduct(p)}>
                      {bc&&<div style={{position:"absolute",top:8,left:8,zIndex:2,padding:"2px 8px",borderRadius:20,background:bc.bg,color:bc.c,fontSize:9,fontWeight:700}}>{bc.l}</div>}
                      <button onClick={e=>{e.stopPropagation();toggleWish(p);}} style={{position:"absolute",top:8,right:8,zIndex:2,background:"rgba(0,0,0,.6)",border:"none",borderRadius:"50%",width:30,height:30,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(6px)"}}>
                        {isW?"❤️":"🤍"}
                      </button>
                      {/* Multi-image indicator */}
                      {p.images?.length>1&&<div style={{position:"absolute",top:8,left:"50%",transform:"translateX(-50%)",zIndex:2,display:"flex",gap:3}}>
                        {p.images.slice(0,4).map((_,i)=><div key={i} style={{width:4,height:4,borderRadius:"50%",background:i===0?"var(--gold)":"rgba(255,255,255,.5)"}}/>)}
                      </div>}
                      <div style={{height:150,overflow:"hidden",background:"var(--surface2)",display:"flex",alignItems:"center",justifyContent:"center",position:"relative",flexShrink:0}}>
                        {mainImg?<img src={mainImg} alt={p.name} style={{width:"100%",height:"100%",objectFit:"cover",transition:"transform .4s"}}/>:<span style={{fontSize:54,userSelect:"none"}}>{p.emoji||"📦"}</span>}
                        {!p.inStock&&<div style={{position:"absolute",inset:0,background:"rgba(0,0,0,.7)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{background:"rgba(239,68,68,.9)",color:"#fff",fontWeight:700,fontSize:10,padding:"4px 10px",borderRadius:18}}>Rupture</span></div>}
                      </div>
                      <div style={{padding:"10px 12px 12px",flex:1,display:"flex",flexDirection:"column",gap:4}}>
                        <div style={{fontWeight:600,fontSize:12,lineHeight:1.35,color:"rgba(242,239,233,.88)",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden",flex:1}}>{p.name}</div>
                        {p.category&&<div style={{fontSize:9,color:"var(--text-dim)"}}>{p.category}</div>}
                        {Number(p.rating)>0&&<div style={{display:"flex",alignItems:"center",gap:4}}><Stars r={p.rating} size={10}/><span style={{fontSize:9,color:"var(--text-dim)"}}>({p.reviews||0})</span></div>}
                        <div className="font-display" style={{fontWeight:800,fontSize:14,color:"var(--gold)",marginBottom:4}}>{fmt(p.price)}</div>
                        <div style={{display:"flex",gap:6}}>
                          <button onClick={e=>{e.stopPropagation();p.inStock&&setQuickProd(p);}}
                            disabled={!p.inStock}
                            style={{flex:1,padding:"7px 0",borderRadius:9,border:"none",background:p.inStock?"linear-gradient(135deg,#25D366,#128C7E)":"rgba(255,255,255,.05)",color:p.inStock?"#fff":"rgba(242,239,233,.2)",fontWeight:700,fontSize:10,cursor:p.inStock?"pointer":"default",fontFamily:"DM Sans,sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
                            {p.inStock?<><WaIco s={11}/>Commander</>:"Rupture"}
                          </button>
                          {p.inStock&&(
                            <button onClick={e=>{e.stopPropagation();addCart(p);}} className="btn-gold" style={{padding:"7px 10px",borderRadius:9,fontSize:13}}>🛒</button>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>
        )}

        {/* ──── CART ──── */}
        {page==="cart"&&(
          <main style={{maxWidth:700,margin:"0 auto",padding:"20px 12px 80px"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:22}}>
              <button onClick={()=>setPage("home")} className="btn-ghost" style={{width:38,height:38,borderRadius:12,fontSize:18,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
              <h2 className="font-display" style={{fontSize:20,fontWeight:800}}>🛒 Panier ({cartCount})</h2>
            </div>
            {cart.length===0?(
              <div style={{textAlign:"center",padding:"50px 20px"}}>
                <div style={{fontSize:60,marginBottom:14}}>🛒</div>
                <p style={{color:"var(--text-dim)",fontSize:15,marginBottom:20}}>Ton panier est vide</p>
                <button onClick={()=>setPage("home")} className="btn-gold" style={{padding:"11px 28px",borderRadius:14,fontSize:14}}>Continuer mes achats</button>
              </div>
            ):(
              <>
                <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:18}}>
                  {cart.map(item=>{
                    const mainImg=item.images?.[0]||item.image||"";
                    return (
                      <div key={item.id} className="card-flat" style={{padding:"12px 14px",display:"flex",gap:12,alignItems:"center"}}>
                        <div style={{width:54,height:54,borderRadius:12,overflow:"hidden",flexShrink:0,background:"var(--surface2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26}}>
                          {mainImg?<img src={mainImg} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:item.emoji||"📦"}
                        </div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:600,fontSize:13,marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.name}</div>
                          <div className="font-display" style={{fontWeight:800,fontSize:13,color:"var(--gold)"}}>{fmt(item.price)}</div>
                          <div style={{display:"flex",alignItems:"center",gap:8,marginTop:6}}>
                            <button onClick={()=>updQty(item.id,-1)} className="btn-ghost" style={{width:28,height:28,borderRadius:"50%",fontSize:14,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>−</button>
                            <span style={{fontWeight:700,fontSize:14,minWidth:18,textAlign:"center"}}>{item.qty}</span>
                            <button onClick={()=>updQty(item.id,1)} className="btn-ghost" style={{width:28,height:28,borderRadius:"50%",fontSize:14,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
                            <span style={{fontSize:11,color:"var(--text-dim)"}}>= {fmt(item.price*item.qty)}</span>
                          </div>
                        </div>
                        <button onClick={()=>rmCart(item.id)} style={{background:"rgba(239,68,68,.1)",border:"1px solid rgba(239,68,68,.3)",borderRadius:9,padding:"6px 9px",color:"#ef4444",cursor:"pointer",fontSize:12,fontWeight:600}}>🗑</button>
                      </div>
                    );
                  })}
                </div>
                <div className="card-flat" style={{padding:"14px 18px",marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:12,color:"var(--text-dim)"}}>
                    <span>Livraison</span><span style={{color:"#10b981",fontWeight:600}}>GRATUITE</span>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontWeight:700,fontSize:16}}>
                    <span>Total</span>
                    <span className="font-display" style={{color:"var(--gold)"}}>{fmt(cartTotal)}</span>
                  </div>
                </div>
                <button onClick={()=>setOrderModal(true)} className="btn-wa" style={{width:"100%",padding:"14px 0",borderRadius:14,fontSize:15,display:"flex",alignItems:"center",justifyContent:"center",gap:9}}>
                  <WaIco s={20}/> Commander via WhatsApp — {fmt(cartTotal)}
                </button>
              </>
            )}
          </main>
        )}

        {/* ──── PAYMENT ──── */}
        {page==="payment"&&(
          <main style={{maxWidth:540,margin:"0 auto",padding:"20px 12px 80px"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:22}}>
              <button onClick={()=>setPage("home")} className="btn-ghost" style={{width:38,height:38,borderRadius:12,fontSize:18,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
              <h2 className="font-display" style={{fontSize:20,fontWeight:800}}>💳 Modes de paiement</h2>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:24}}>
              {PM.map(m=>(
                <div key={m.id} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px",borderRadius:14,border:`1px solid ${m.c}33`,background:`${m.c}0D`}}>
                  <span style={{fontSize:24}}>{m.icon}</span>
                  <span style={{fontWeight:600,fontSize:14}}>{m.n}</span>
                  <span style={{marginLeft:"auto",fontSize:11,color:"var(--text-dim)"}}>Disponible</span>
                </div>
              ))}
            </div>
            {cart.length>0?(
              <button onClick={()=>setOrderModal(true)} className="btn-wa" style={{width:"100%",padding:"14px 0",borderRadius:14,fontSize:15,display:"flex",alignItems:"center",justifyContent:"center",gap:9}}>
                <WaIco s={20}/> Commander — {fmt(cartTotal)}
              </button>
            ):(
              <button onClick={()=>setPage("home")} className="btn-gold" style={{width:"100%",padding:"14px 0",borderRadius:14,fontSize:15}}>🛍 Voir les produits</button>
            )}
          </main>
        )}

        {/* ──── FAVORITES ──── */}
        {page==="favorites"&&(
          <main style={{maxWidth:800,margin:"0 auto",padding:"20px 12px 80px"}}>
            <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:22}}>
              <button onClick={()=>setPage("home")} className="btn-ghost" style={{width:38,height:38,borderRadius:12,fontSize:18,padding:0,display:"flex",alignItems:"center",justifyContent:"center"}}>←</button>
              <h2 className="font-display" style={{fontSize:20,fontWeight:800}}>❤️ Favoris ({wish.length})</h2>
            </div>
            {wish.length===0?(
              <div style={{textAlign:"center",padding:"50px 20px"}}>
                <div style={{fontSize:60,marginBottom:14}}>🤍</div>
                <p style={{color:"var(--text-dim)",fontSize:15,marginBottom:20}}>Aucun favori pour l'instant</p>
                <button onClick={()=>setPage("home")} className="btn-gold" style={{padding:"11px 28px",borderRadius:14,fontSize:14}}>Découvrir les produits</button>
              </div>
            ):(
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(165px,1fr))",gap:12}}>
                {wish.map(p=>{
                  const mainImg=p.images?.[0]||p.image||"";
                  return (
                    <div key={p.id} className="pcard" onClick={()=>setSelectedProduct(p)}>
                      <div style={{height:120,overflow:"hidden",background:"var(--surface2)",display:"flex",alignItems:"center",justifyContent:"center"}}>
                        {mainImg?<img src={mainImg} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontSize:46}}>{p.emoji||"📦"}</span>}
                      </div>
                      <div style={{padding:"10px 12px"}}>
                        <div style={{fontWeight:600,fontSize:12,marginBottom:5,lineHeight:1.35}}>{p.name}</div>
                        <div className="font-display" style={{fontWeight:800,fontSize:14,color:"var(--gold)",marginBottom:8}}>{fmt(p.price)}</div>
                        <div style={{display:"flex",gap:6}}>
                          <button onClick={e=>{e.stopPropagation();setQuickProd(p);}} className="btn-wa" style={{flex:1,padding:"6px 0",borderRadius:9,fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",gap:4}}>
                            <WaIco s={11}/> Commander
                          </button>
                          <button onClick={e=>{e.stopPropagation();toggleWish(p);}} style={{padding:"6px 9px",borderRadius:9,border:"1px solid rgba(239,68,68,.35)",background:"rgba(239,68,68,.08)",color:"#ef4444",cursor:"pointer",fontSize:11}}>✕</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>
        )}

        {/* ──── ORDER DONE ──── */}
        {page==="orderDone"&&(
          <main style={{maxWidth:480,margin:"0 auto",padding:"80px 20px",textAlign:"center"}}>
            <div style={{fontSize:72,marginBottom:20,animation:"countIn .6s cubic-bezier(.34,1.56,.64,1) both"}}>🎉</div>
            <h2 className="font-display" style={{fontSize:28,fontWeight:900,marginBottom:10,color:"var(--gold)"}}>Commande envoyée !</h2>
            <p style={{color:"var(--text-dim)",lineHeight:1.8,marginBottom:8}}>Merci ! On vous contacte très vite.</p>
            <p style={{color:"var(--text-ghost)",fontSize:13,marginBottom:36}}>📱 +237 698 083 058</p>
            <button onClick={()=>setPage("home")} className="btn-gold" style={{padding:"13px 36px",borderRadius:16,fontSize:15}}>🏠 Continuer mes achats</button>
          </main>
        )}

        {/* FOOTER */}
        {page==="home"&&(
          <footer style={{borderTop:"1px solid var(--border)",padding:"28px 14px",textAlign:"center",marginTop:20}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:8}}>
              <div style={{width:36,height:36,borderRadius:10,background:"linear-gradient(135deg,var(--gold),var(--gold-light))",display:"flex",alignItems:"center",justifyContent:"center"}}>
                <span className="font-display" style={{fontSize:14,fontWeight:900,color:"#0A0A0F"}}>BT</span>
              </div>
              <div>
                <div className="font-display" style={{fontSize:16,fontWeight:800,color:"var(--gold)"}}>Boutique Traoré</div>
                <div style={{fontSize:10,color:"var(--text-dim)"}}>AKIT Commerce</div>
              </div>
            </div>
            <p style={{fontSize:11,color:"var(--text-ghost)",lineHeight:2}}>
              🌍 190+ pays · 🔒 Paiement sécurisé · 🔄 Retours gratuits<br/>
              📱 WhatsApp : +237 698 083 058<br/>
              © 2026 Boutique Traoré — AKIT Commerce
            </p>
          </footer>
        )}
      </div>

      {toast&&<Toast msg={toast.msg} ok={toast.ok}/>}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
