/* SPLASH */

.splash-ring2{position:absolute;inset:14px;border-radius:50%;border:1px solid transparent;border-bottom-color:#C9963A;border-left-color:rgba(201,150,58,.2);animation:splashSpin 1.8s cubic-bezier(.6,.2,.4,.8) infinite reverse;}
.splash-bt{position:relative;z-index:1;font-family:'Syne',sans-serif;font-size:52px;font-weight:900;letter-spacing:-3px;color:#C9963A;animation:btPulse 1.4s ease-in-out infinite;text-shadow:0 0 40px rgba(201,150,58,.4);}
.splash-full{margin-top:20px;text-align:center;animation:splashTextIn .8s ease .3s both;}

.splash-dots{display:flex;gap:6px;margin-top:32px;animation:splashTextIn .8s ease .6s both;}

.splash-dot:nth-child(2){animation-delay:.15s;}

.firebase-status.ok{background:rgba(34,197,94,.15);color:#22c55e;border:1px solid rgba(34,197,94,.3);}

<script>
/* ══════════════════════════════════════════════════
   🔥 FIREBASE CONFIG — REMPLACEZ PAR VOS VRAIES CLÉS
   Console Firebase → Project Settings → Your apps
   ══════════════════════════════════════════════════ */
const firebaseConfig = {
  apiKey:            "VOTRE_API_KEY",
  authDomain:        "VOTRE_PROJET.firebaseapp.com",
  projectId:         "VOTRE_PROJET_ID",
  storageBucket:     "VOTRE_PROJET.appspot.com",
  messagingSenderId: "VOTRE_SENDER_ID",

};

/* ══ CLOUDINARY ══ */
window.CLD = {

window.ADMIN_SECRET = "BT-TRAORE-2026";

window.WA = "237698083058";

/* ══════════════════════════════════════════
   INITIALISATION FIREBASE — CORRECTION PRINCIPALE
   On initialise TOUJOURS si les clés sont renseignées
   ══════════════════════════════════════════ */
window.db = null;
window.FB_READY = false;

(function initFirebase() {
  const hasRealConfig = (
    firebaseConfig.apiKey &&
    firebaseConfig.apiKey !== "VOTRE_API_KEY" &&
    firebaseConfig.projectId &&
    firebaseConfig.projectId !== "VOTRE_PROJET_ID"
  );

  if (!hasRealConfig) {
    console.warn("[BT] Firebase non configuré — mode localStorage actif.");
    updateSplashStatus(false);
    return;
  }

  try {
    firebase.initializeApp(firebaseConfig);
    window.db = firebase.firestore();
    // Activer la persistance hors-ligne (produits visibles même sans internet)
    window.db.enablePersistence({ synchronizeTabs: true })
      .catch(err => {
        if (err.code === 'failed-precondition') {
          // Plusieurs onglets ouverts — OK, pas critique
        } else if (err.code === 'unimplemented') {
          // Navigateur ne supporte pas — OK
        }
      });
    window.FB_READY = true;
    console.log("[BT] ✅ Firebase connecté — tous les clients voient les produits en temps réel.");
    updateSplashStatus(true);
  } catch(e) {
    console.error("[BT] Erreur Firebase:", e.message);
    updateSplashStatus(false);
  }
})();

function updateSplashStatus(ok) {
  const el = document.getElementById('fb-splash-status');
  if (!el) return;
  if (ok) {
    el.className = 'firebase-status ok';
    el.textContent = '🔥 Firebase connecté — temps réel actif';
  } else {
    el.className = 'firebase-status local';
    el.textContent = '💾 Mode local (configurez Firebase)';
  }
}

/* ══ UPLOAD CLOUDINARY ══ */
window.uploadCLD = (file, onProg) => new Promise((ok, err) => {
  const fd = new FormData();
  fd.append("file", file);
  fd.append("upload_preset", window.CLD.preset);
  fd.append("folder", window.CLD.folder);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", `https://api.cloudinary.com/v1_1/${window.CLD.cloud}/image/upload`);
  xhr.upload.onprogress = e => e.lengthComputable && onProg && onProg(~~(e.loaded / e.total * 100));
  xhr.onload = () => xhr.status === 200
    ? ok(JSON.parse(xhr.responseText).secure_url)
    : err(new Error("Upload échoué"));
  xhr.onerror = () => err(new Error("Réseau"));
  xhr.send(fd);
});

/* ══ SPLASH ══ */
setTimeout(() => {

}, 2800);

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const BANNER_TEXT = "✦  BOUTIQUE TRAORE — LIVRAISON GRATUITE DÈS 10 000 FCFA  ✦  PAIEMENT SÉCURISÉ  ✦  SATISFACTION GARANTIE  ✦  COMMANDEZ VIA WHATSAPP  ✦  ";
const FREE_DELIVERY = window.FREE_DELIVERY || 10000;

const PM = [
  {id:"orange",n:"Orange Money",icon:"🟠",c:"#FF6600"},
  {id:"mtn",n:"MTN MoMo",icon:"💛",c:"#FFCC00"},
  {id:"wave",n:"Wave",icon:"🌊",c:"#1ABCFE"},
  {id:"moov",n:"Moov Money",icon:"🔵",c:"#0066FF"},
  {id:"card",n:"Carte Bancaire",icon:"💳",c:"#6366f1"},
  {id:"paypal",n:"PayPal",icon:"🅿️",c:"#003087"},
];

const BADGES = {
  nouveau:{bg:"#6366f1",c:"#fff",l:"Nouveau"},
  promo:{bg:"#ef4444",c:"#fff",l:"Promo"},
  bestseller:{bg:"#C9963A",c:"#080810",l:"Best"},
  luxe:{bg:"#8b5cf6",c:"#fff",l:"Luxe"},
  tendance:{bg:"#10b981",c:"#fff",l:"Tendance"},
  exclusif:{bg:"#ec4899",c:"#fff",l:"Exclusif"},
};

const fmt = n => Number(n).toLocaleString("fr-FR") + " FCFA";

/* ════════════════════════════════
   STORE — Firebase temps réel ou localStorage
   ════════════════════════════════ */
function useStore() {
  const fb = window.FB_READY && !!window.db;

  /* Charger les produits une fois */
  const load = async () => {
    if (fb) {
      const snap = await window.db.collection("products").orderBy("createdAt", "asc").get();
      return snap.docs.map(d => ({ ...d.data(), id: d.id }));
    }
    try { return JSON.parse(localStorage.getItem("akit_p") || "[]"); } catch { return []; }
  };

  /* Ajouter un produit */
  const add = async (p) => {
    if (fb) {
      const ref = await window.db.collection("products").add({
        ...p,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        views: 0,
        orders: 0
      });
      return ref.id;
    }
    const id = Date.now().toString();
    const ps = JSON.parse(localStorage.getItem("akit_p") || "[]");
    ps.push({ ...p, id, views: 0, orders: 0 });
    localStorage.setItem("akit_p", JSON.stringify(ps));
    return id;
  };

  /* Modifier un produit */
  const upd = async (id, p) => {
    if (fb) {
      await window.db.collection("products").doc(id).update(p);
      return;
    }
    const ps = JSON.parse(localStorage.getItem("akit_p") || "[]");
    const i = ps.findIndex(x => x.id === id);
    if (i >= 0) { ps[i] = { ...ps[i], ...p }; localStorage.setItem("akit_p", JSON.stringify(ps)); }
  };

  /* Supprimer */
  const del = async (id) => {
    if (fb) {
      await window.db.collection("products").doc(id).delete();
      return;
    }
    const ps = JSON.parse(localStorage.getItem("akit_p") || "[]");
    localStorage.setItem("akit_p", JSON.stringify(ps.filter(x => x.id !== id)));
  };

  /* 🔴 TEMPS RÉEL — tous les clients reçoivent les mises à jour automatiquement */
  const subscribe = (cb) => {
    if (fb) {
      return window.db.collection("products")
        .orderBy("createdAt", "asc")
        .onSnapshot(
          snap => cb(snap.docs.map(d => ({ ...d.data(), id: d.id }))),
          err => console.error("[BT] Erreur écoute Firestore:", err)
        );
    }
    return null;
  };

  return { fb, load, add, upd, del, subscribe };
}

  };
  return { get, add };
}

/* ════ DELIVERY ALERT ════ */
function DeliveryAlert({ cartTotal }) {

    <div className={`delivery-bar ${free ? "success" : "warning"}`} style={{ animation: "fadeUp .4s ease both" }}>

/* ════ IMAGE UPLOAD ════ */
function ImgUpload({ value, onChange, showToast }) {
  const [prog, setProg] = useState(0);
  const [busy, setBusy] = useState(false);
  const [drag, setDrag] = useState(false);
  const ref = useRef();
  const handle = async (file) => {
    if (!file) return;
    if (!file.type.startsWith("image/")) { showToast("Fichier invalide", false); return; }
    if (file.size > 10 * 1024 * 1024) { showToast("Max 10MB", false); return; }
    setBusy(true); setProg(0);
    try {
      const url = await window.uploadCLD(file, p => setProg(p));
      onChange(url); showToast("Image uploadée !", true);
    } catch (e) { showToast(e.message, false); }
    finally { setBusy(false); setProg(0); }
  };
  return (
    <div>
      <div style={{ fontSize: 11, color: "var(--text3)", marginBottom: 6, display: "flex", alignItems: "center", gap: 8 }}>
        Image produit <span style={{ background: "rgba(16,185,129,.12)", color: "#10b981", border: "1px solid rgba(16,185,129,.25)", borderRadius: 6, padding: "1px 6px", fontSize: 9 }}>☁ CDN</span>
      </div>
      <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
        <div style={{ width: 70, height: 70, borderRadius: 12, background: "var(--bg3)", border: "1px solid var(--border)", flexShrink: 0, overflow: "hidden", display: "flex", alignItems: "center", justifyContent: "center", position: "relative" }}>
          {value ? <img src={value} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ fontSize: 26 }}>📦</span>}
          {busy && <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,.7)", display: "flex", alignItems: "center", justifyContent: "center" }}><div className="spin" style={{ width: 20, height: 20, borderWidth: 2 }} /></div>}
        </div>
        <div style={{ flex: 1 }}>
          <div className={`upload-zone${drag ? " drag" : ""}`} onClick={() => !busy && ref.current?.click()}
            onDragOver={e => { e.preventDefault(); setDrag(true); }}
            onDragLeave={() => setDrag(false)}
            onDrop={e => { e.preventDefault(); setDrag(false); handle(e.dataTransfer.files[0]); }}>
            <input ref={ref} type="file" accept="image/*" onChange={e => handle(e.target.files[0])} style={{ display: "none" }} />
            {busy ? (
              <div><div style={{ fontSize: 12, color: "var(--gold)", fontWeight: 600, marginBottom: 4 }}>Envoi… {prog}%</div><div className="prog-bar"><div className="prog-fill" style={{ width: prog + "%" }} /></div></div>
            ) : value ? (
              <div style={{ fontSize: 11, color: "#10b981", fontWeight: 600 }}>✅ Hébergée sur Cloudinary</div>
            ) : (
              <div><div style={{ fontSize: 12, marginBottom: 2 }}>📁 Cliquer ou glisser</div><div style={{ fontSize: 10, color: "var(--text3)" }}>JPG · PNG · WEBP · max 10MB</div></div>
            )}
          </div>
          {value && !busy && (
            <button onClick={() => onChange("")} style={{ width: "100%", marginTop: 5, padding: "5px 0", borderRadius: 8, border: "1px solid rgba(239,68,68,.35)", background: "rgba(239,68,68,.08)", color: "#ef4444", cursor: "pointer", fontFamily: "Inter,sans-serif", fontWeight: 600, fontSize: 11 }}>
              🗑 Supprimer
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

  useEffect(() => { document.body.style.overflow = 'hidden'; return () => { document.body.style.overflow = ''; }; }, []);
  const go = (dir) => {
    if (dir === "next" && idx < products.length - 1) {
      setAnim("exit-left");
      setTimeout(() => { setIdx(i => i + 1); setAnim("enter-right"); setTimeout(() => setAnim(null), 300); }, 250);
    } else if (dir === "prev" && idx > 0) {
      setAnim("exit-right");
      setTimeout(() => { setIdx(i => i - 1); setAnim("enter-left"); setTimeout(() => setAnim(null), 300); }, 250);
    }
  };
  const onTouchStart = e => { touchStart.current = e.touches[0].clientX; touchStartY.current = e.touches[0].clientY; };
  const onTouchEnd = e => {
    if (!touchStart.current) return;
    const dx = touchStart.current - e.changedTouches[0].clientX;
    const dy = Math.abs(touchStartY.current - e.changedTouches[0].clientY);
    if (dy > Math.abs(dx) * 1.5) return;
    if (Math.abs(dx) > 50) { dx > 0 ? go("next") : go("prev"); }
    touchStart.current = null;
  };
  const isW = wish.find(x => x.id === p.id);
  const bc = p.badge && BADGES[p.badge];
  return (
    <div className="swipe-container" style={{ zIndex: 500 }} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
      <div className={`swipe-card ${anim || ""}`}>
        <div style={{ flex: 1, position: "relative", overflow: "hidden" }}>
          {p.image ? <img src={p.image} alt={p.name} style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <div style={{ width: "100%", height: "100%", display: "flex", alignItems: "center", justifyContent: "center", background: "rgba(255,255,255,.04)", fontSize: 80 }}>{p.emoji || "📦"}</div>}
          <div style={{ position: "absolute", inset: 0, background: "linear-gradient(to top, rgba(8,8,16,.98) 0%, rgba(8,8,16,.5) 40%, transparent 70%)" }} />
          <div style={{ position: "absolute", top: 0, left: 0, right: 0, padding: "14px 16px", display: "flex", alignItems: "center", justifyContent: "space-between", background: "linear-gradient(to bottom, rgba(8,8,16,.8), transparent)" }}>
            <button onClick={onClose} style={{ background: "rgba(255,255,255,.12)", border: "none", borderRadius: "50%", width: 38, height: 38, fontSize: 18, cursor: "pointer", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(8px)" }}>✕</button>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 12, color: "rgba(255,255,255,.7)", fontWeight: 600 }}>{idx + 1} / {products.length}</span>
              <button onClick={() => onToggleWish(p)} style={{ background: "rgba(255,255,255,.12)", border: "none", borderRadius: "50%", width: 38, height: 38, fontSize: 18, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(8px)" }}>{isW ? "❤️" : "🤍"}</button>
            </div>
          </div>
          {bc && <div style={{ position: "absolute", top: 14, left: "50%", transform: "translateX(-50%)", padding: "3px 12px", borderRadius: 20, background: bc.bg, color: bc.c, fontSize: 10, fontWeight: 700 }}>{bc.l}</div>}
        </div>
        <div style={{ padding: "20px 20px 32px", background: "#080810" }}>
          {p.category && <div style={{ fontSize: 10, color: "var(--text3)", textTransform: "uppercase", letterSpacing: ".08em", marginBottom: 4 }}>{p.category}</div>}
          <div className="font-display" style={{ fontSize: 20, fontWeight: 800, marginBottom: 4 }}>{p.name}</div>
          {Number(p.rating) > 0 && <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 8 }}><Stars r={p.rating} /><span style={{ fontSize: 11, color: "var(--text3)" }}>({p.reviews || 0})</span></div>}
          {p.description && <div style={{ fontSize: 12, color: "var(--text2)", marginBottom: 10, lineHeight: 1.6 }}>{p.description}</div>}
          <div className="font-display" style={{ fontSize: 24, fontWeight: 900, color: "var(--gold)", marginBottom: 14 }}>{fmt(p.price)}</div>
          <div style={{ display: "flex", gap: 10 }}>
            {p.inStock ? <>
              <button onClick={() => onAddCart(p)} className="btn-gold" style={{ flex: 1, padding: "12px 0", borderRadius: 12, fontSize: 13, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>🛒 Panier</button>
              <button onClick={() => onQuickOrder(p)} className="btn-wa" style={{ flex: 1, padding: "12px 0", borderRadius: 12, fontSize: 13, display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}><WaIco s={15} /> Commander</button>
            </> : <div style={{ flex: 1, padding: "12px 0", borderRadius: 12, fontSize: 13, textAlign: "center", background: "rgba(239,68,68,.1)", border: "1px solid rgba(239,68,68,.2)", color: "#ef4444", fontWeight: 700 }}>❌ Rupture de stock</div>}
          </div>
        </div>
      </div>
      {idx > 0 && <button onClick={() => go("prev")} style={{ position: "absolute", left: 16, top: "40%", transform: "translateY(-50%)", background: "rgba(255,255,255,.1)", border: "none", borderRadius: "50%", width: 42, height: 42, fontSize: 20, cursor: "pointer", color: "#fff", backdropFilter: "blur(8px)" }}>‹</button>}
      {idx < products.length - 1 && <button onClick={() => go("next")} style={{ position: "absolute", right: 16, top: "40%", transform: "translateY(-50%)", background: "rgba(255,255,255,.1)", border: "none", borderRadius: "50%", width: 42, height: 42, fontSize: 20, cursor: "pointer", color: "#fff", backdropFilter: "blur(8px)" }}>›</button>}
      <div style={{ position: "absolute", bottom: 180, left: "50%", transform: "translateX(-50%)", display: "flex", gap: 5 }}>
        {products.map((_, i) => (<div key={i} onClick={() => { if (i !== idx) { i > idx ? go("next") : go("prev"); } }} style={{ width: i === idx ? 18 : 6, height: 6, borderRadius: 3, background: i === idx ? "var(--gold)" : "rgba(255,255,255,.2)", transition: "all .2s", cursor: "pointer" }} />))}
      </div>
      <div style={{ position: "absolute", bottom: 140, left: "50%", transform: "translateX(-50%)", fontSize: 11, color: "rgba(255,255,255,.3)", fontWeight: 600, letterSpacing: ".08em", pointerEvents: "none", animation: "swipeHint 2.5s ease 1s 2" }}>
        ← Swipe pour naviguer →
      </div>
    </div>
  );
}

/* ════ ADMIN PANEL ════ */
function AdminPanel({ products, onBack, onLogout, store, showToast, fbReady }) {
  const empty = { name: "", price: "", category: "", description: "", emoji: "📦", image: "", inStock: true, badge: "", rating: "4.5", reviews: "0" };
  const [form, setForm] = useState(empty);
  const [editId, setEditId] = useState(null);
  const [tab, setTab] = useState("products");

  const save = async () => {
    if (!form.name || !form.price) { showToast("Nom et prix requis", false); return; }
    const data = { ...form, price: Number(form.price) };
    try {
      if (editId !== null) { await store.upd(editId, data); showToast("Produit modifié !", true); }
      else { await store.add(data); showToast("Produit ajouté !", true); }
    } catch (e) { showToast(e.message, false); }
    setForm(empty); setEditId(null);
  };

  const del = async (id) => {
    if (!confirm("Supprimer ce produit ?")) return;
    try { await store.del(id); showToast("Supprimé", true); }
    catch (e) { showToast("Erreur", false); }
  };

  const startEdit = (p) => {
    setForm({ name: p.name, price: String(p.price), category: p.category || "", description: p.description || "", emoji: p.emoji || "📦", image: p.image || "", inStock: p.inStock !== false, badge: p.badge || "", rating: String(p.rating || 4.5), reviews: String(p.reviews || 0) });
    setEditId(p.id); setTab("products");
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const totalRevenuePotentiel = products.reduce((s, p) => s + Number(p.price), 0);
  const avgPrice = products.length ? Math.round(products.reduce((s, p) => s + Number(p.price), 0) / products.length) : 0;
  const cats = [...new Set(products.map(p => p.category).filter(Boolean))];
  const maxPrice = products.length ? Math.max(...products.map(p => Number(p.price))) : 1;

  const statsCards = [
    { l: "Total produits", v: products.length, icon: "📦", accent: "#C9963A" },
    { l: "En stock", v: products.filter(p => p.inStock !== false).length, icon: "✅", accent: "#22c55e" },
    { l: "Rupture", v: products.filter(p => p.inStock === false).length, icon: "❌", accent: "#ef4444" },
    { l: "Catégories", v: cats.length || 0, icon: "🗂", accent: "#6366f1" },
    { l: "Prix moyen", v: fmt(avgPrice), icon: "💰", accent: "#C9963A" },
    { l: "Valeur stock", v: fmt(totalRevenuePotentiel), icon: "💎", accent: "#8b5cf6" },
  ];

  return (
    <div style={{ minHeight: "100vh", background: "#080810", color: "var(--text)", fontFamily: "Inter,sans-serif" }}>
      <div style={{ position: "sticky", top: 0, zIndex: 100, background: "rgba(8,8,16,.97)", backdropFilter: "blur(20px)", borderBottom: "1px solid rgba(201,150,58,.3)", padding: "14px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{ width: 40, height: 40, borderRadius: 12, background: "linear-gradient(135deg,#C9963A,#E8B55A)", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Syne,sans-serif", fontWeight: 900, fontSize: 16, color: "#080810" }}>BT</div>
          <div>
            <div className="font-display" style={{ fontSize: 15, color: "var(--gold)", fontWeight: 700 }}>Admin — Boutique Traore</div>
            <div style={{ fontSize: 11, color: "var(--text3)" }}>{fbReady ? "🔥 Firebase temps réel" : "💾 Local (config Firebase)"}</div>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button onClick={onBack} className="btn-ghost" style={{ padding: "7px 14px", borderRadius: 10, fontSize: 13 }}>👁 Boutique</button>
          <button onClick={onLogout} style={{ padding: "7px 14px", borderRadius: 10, border: "1px solid rgba(239,68,68,.4)", background: "rgba(239,68,68,.08)", color: "#ef4444", cursor: "pointer", fontFamily: "Inter,sans-serif", fontSize: 13 }}>🚪</button>
        </div>
      </div>

      <div style={{ maxWidth: 1100, margin: "0 auto", padding: "20px 14px" }}>
        {/* BANDEAU STATUT FIREBASE */}
        {fbReady ? (
          <div className="fb-banner">
            <span style={{ fontSize: 18 }}>🔥</span>
            <div>
              <div>Firebase connecté — tous les clients voient vos produits en temps réel !</div>
              <div style={{ fontSize: 11, opacity: .7, marginTop: 2 }}>Les modifications sont visibles immédiatement sur tous les appareils</div>
            </div>
            <span style={{ fontSize: 18, marginLeft: "auto" }}>✅</span>
          </div>
        ) : (
          <div className="fb-banner warn">
            <span style={{ fontSize: 18 }}>⚠️</span>
            <div>
              <div style={{ fontWeight: 700 }}>Mode localStorage — les autres ne voient PAS vos produits !</div>
              <div style={{ fontSize: 11, opacity: .8, marginTop: 2 }}>Remplacez les clés Firebase dans le fichier HTML (section firebaseConfig) puis rechargez.</div>
            </div>
          </div>
        )}

        {/* TABS */}
        <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
          {[{ id: "products", l: "📦 Produits" }, { id: "stats", l: "📊 Statistiques" }].map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} style={{ padding: "8px 18px", borderRadius: 10, border: `1px solid ${tab === t.id ? "var(--gold)" : "var(--border)"}`, background: tab === t.id ? "var(--gold-dim)" : "transparent", color: tab === t.id ? "var(--gold)" : "var(--text2)", cursor: "pointer", fontFamily: "Inter,sans-serif", fontWeight: 600, fontSize: 13, transition: "all .2s" }}>
              {t.l}
            </button>
          ))}
        </div>

        {tab === "stats" && (
          <div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(160px,1fr))", gap: 12, marginBottom: 24 }}>
              {statsCards.map((s, i) => (
                <div key={i} className="admin-stat-card" style={{ "--accent": s.accent }}>
                  <div style={{ fontSize: 26, marginBottom: 6 }}>{s.icon}</div>
                  <div className="font-display" style={{ fontWeight: 800, fontSize: s.v.toString().length > 6 ? 15 : 22, color: s.accent, animation: `statCount .5s ease ${i * .1}s both` }}>{s.v}</div>
                  <div style={{ fontSize: 11, color: "var(--text3)", marginTop: 2 }}>{s.l}</div>
                </div>
              ))}
            </div>
            {cats.length > 0 && (
              <div style={{ background: "var(--bg2)", border: "1px solid var(--border)", borderRadius: 16, padding: 20, marginBottom: 16 }}>
                <div className="font-display" style={{ fontSize: 14, color: "var(--gold)", marginBottom: 16, fontWeight: 700 }}>📊 Produits par catégorie</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  {cats.map(c => {
                    const count = products.filter(p => p.category === c).length;
                    const pct = Math.round((count / products.length) * 100);
                    return (
                      <div key={c} style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <div style={{ width: 100, fontSize: 12, color: "var(--text2)", fontWeight: 500, flexShrink: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c}</div>
                        <div className="stat-bar-wrap"><div className="stat-bar-fill" style={{ width: pct + "%" }} /></div>
                        <div style={{ fontSize: 12, fontWeight: 700, color: "var(--gold)", minWidth: 36, textAlign: "right" }}>{count}</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
            <div style={{ background: "var(--bg2)", border: "1px solid var(--border)", borderRadius: 16, padding: 20 }}>
              <div className="font-display" style={{ fontSize: 14, color: "var(--gold)", marginBottom: 16, fontWeight: 700 }}>💰 Top produits par prix</div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {[...products].sort((a, b) => Number(b.price) - Number(a.price)).slice(0, 5).map((p, i) => (
                  <div key={p.id} style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <div style={{ width: 22, height: 22, borderRadius: "50%", background: i === 0 ? "linear-gradient(135deg,#C9963A,#E8B55A)" : i === 1 ? "rgba(255,255,255,.1)" : "var(--bg3)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 800, color: i === 0 ? "#080810" : "var(--text2)", flexShrink: 0 }}>{i + 1}</div>
                    <div style={{ width: 36, height: 36, borderRadius: 9, overflow: "hidden", flexShrink: 0, background: "var(--bg3)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 18 }}>
                      {p.image ? <img src={p.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : p.emoji || "📦"}
                    </div>
                    <div style={{ flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", fontSize: 13 }}>{p.name}</div>
                    <div className="stat-bar-wrap" style={{ maxWidth: 80 }}><div className="stat-bar-fill" style={{ width: Math.round((Number(p.price) / maxPrice) * 100) + "%" }} /></div>
                    <div style={{ fontSize: 12, fontWeight: 700, color: "var(--gold)", flexShrink: 0 }}>{fmt(p.price)}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        )}

        {tab === "products" && (
          <div className="admin-split" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16 }}>
            {/* FORMULAIRE */}
            <div style={{ background: "var(--bg2)", border: "1px solid var(--border)", borderRadius: 18, padding: 20 }}>
              <div className="font-display" style={{ fontSize: 15, color: "var(--gold)", marginBottom: 16, fontWeight: 700 }}>
                {editId !== null ? "✏️ Modifier le produit" : "➕ Ajouter un produit"}
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                <ImgUpload value={form.image} onChange={url => setForm(f => ({ ...f, image: url, emoji: url ? "" : f.emoji }))} showToast={showToast} />
                {!form.image && (
                  <div>
                    <label style={{ fontSize: 11, color: "var(--text3)", display: "block", marginBottom: 4 }}>Emoji (sans image)</label>
                    <input className="inp" value={form.emoji} onChange={e => setForm(f => ({ ...f, emoji: e.target.value }))} placeholder="📦" style={{ textAlign: "center", fontSize: 22 }} />
                  </div>
                )}
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  <div>
                    <label style={{ fontSize: 11, color: "var(--text3)", display: "block", marginBottom: 4 }}>Badge</label>
                    <select className="inp" value={form.badge} onChange={e => setForm(f => ({ ...f, badge: e.target.value }))} style={{ cursor: "pointer" }}>
                      <option value="">Aucun</option>
                      <option value="nouveau">🆕 Nouveau</option>
                      <option value="promo">🔥 Promo</option>
                      <option value="bestseller">⭐ Bestseller</option>
                      <option value="luxe">💎 Luxe</option>
                      <option value="tendance">📈 Tendance</option>
                      <option value="exclusif">✨ Exclusif</option>
                    </select>
                  </div>
                  <div>
                    <label style={{ fontSize: 11, color: "var(--text3)", display: "block", marginBottom: 4 }}>Catégorie</label>
                    <input className="inp" value={form.category} onChange={e => setForm(f => ({ ...f, category: e.target.value }))} placeholder="Mode, Tech…" />
                  </div>
                </div>
                <div>
                  <label style={{ fontSize: 11, color: "var(--text3)", display: "block", marginBottom: 4 }}>Nom du produit *</label>
                  <input className="inp" value={form.name} onChange={e => setForm(f => ({ ...f, name: e.target.value }))} placeholder="Ex: Sac cuir premium" />
                </div>
                <div>
                  <label style={{ fontSize: 11, color: "var(--text3)", display: "block", marginBottom: 4 }}>Prix (FCFA) *</label>
                  <input className="inp" type="number" value={form.price} onChange={e => setForm(f => ({ ...f, price: e.target.value }))} placeholder="25000" />
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                  <div>
                    <label style={{ fontSize: 11, color: "var(--text3)", display: "block", marginBottom: 4 }}>Note (0-5)</label>
                    <input className="inp" type="number" min="0" max="5" step="0.1" value={form.rating} onChange={e => setForm(f => ({ ...f, rating: e.target.value }))} />
                  </div>
                  <div>
                    <label style={{ fontSize: 11, color: "var(--text3)", display: "block", marginBottom: 4 }}>Nb avis</label>
                    <input className="inp" type="number" value={form.reviews} onChange={e => setForm(f => ({ ...f, reviews: e.target.value }))} />
                  </div>
                </div>
                <div>
                  <label style={{ fontSize: 11, color: "var(--text3)", display: "block", marginBottom: 4 }}>Description</label>
                  <textarea className="inp" value={form.description} onChange={e => setForm(f => ({ ...f, description: e.target.value }))} placeholder="Décrivez le produit…" rows={3} style={{ resize: "vertical" }} />
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                  <span style={{ fontSize: 13, color: "var(--text2)" }}>En stock</span>
                  <div className="toggle" style={{ background: form.inStock ? "#22c55e" : "#374151" }} onClick={() => setForm(f => ({ ...f, inStock: !f.inStock }))}>
                    <div className="toggle-thumb" style={{ left: form.inStock ? 22 : 3 }} />
                  </div>
                  <span style={{ fontSize: 12, color: form.inStock ? "#22c55e" : "#ef4444" }}>{form.inStock ? "Disponible" : "Rupture"}</span>
                </div>
                <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                  <button onClick={save} className="btn-gold" style={{ flex: 1, padding: "11px 0", borderRadius: 12, fontSize: 14 }}>{editId !== null ? "💾 Enregistrer" : "➕ Ajouter"}</button>
                  {editId !== null && <button onClick={() => { setForm(empty); setEditId(null); }} className="btn-ghost" style={{ padding: "11px 14px", borderRadius: 12, fontSize: 13 }}>Annuler</button>}
                </div>
              </div>
            </div>

            {/* LISTE PRODUITS */}
            <div style={{ background: "var(--bg2)", border: "1px solid var(--border)", borderRadius: 18, padding: 20, maxHeight: 680, overflowY: "auto" }}>
              <div className="font-display" style={{ fontSize: 15, color: "var(--gold)", marginBottom: 16, fontWeight: 700 }}>📦 Produits ({products.length})</div>
              {products.length === 0 ? (
                <div style={{ textAlign: "center", padding: "40px 20px", color: "var(--text3)" }}>
                  <div style={{ fontSize: 36, marginBottom: 10 }}>📭</div>
                  <p style={{ fontSize: 13 }}>Aucun produit encore. Ajoutez votre premier !</p>
                </div>
              ) : products.map(p => (
                <div key={p.id} style={{ display: "flex", gap: 10, alignItems: "center", padding: "10px 0", borderBottom: "1px solid var(--border)" }}>
                  <div style={{ width: 44, height: 44, borderRadius: 10, overflow: "hidden", flexShrink: 0, background: "var(--bg3)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20 }}>
                    {p.image ? <img src={p.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : p.emoji || "📦"}
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontWeight: 600, fontSize: 13, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</div>
                    <div style={{ fontSize: 12, color: "var(--gold)", fontWeight: 700 }}>{fmt(p.price)}</div>
                    <div style={{ display: "flex", gap: 4, marginTop: 2, flexWrap: "wrap" }}>
                      {p.category && <span style={{ fontSize: 9, background: "rgba(99,102,241,.2)", color: "#818cf8", borderRadius: 5, padding: "1px 5px" }}>{p.category}</span>}
                      <span style={{ fontSize: 9, background: p.inStock !== false ? "rgba(34,197,94,.15)" : "rgba(239,68,68,.15)", color: p.inStock !== false ? "#22c55e" : "#ef4444", borderRadius: 5, padding: "1px 5px" }}>{p.inStock !== false ? "✅ Stock" : "❌ Rupture"}</span>
                    </div>
                  </div>
                  <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
                    <button onClick={() => startEdit(p)} style={{ padding: "5px 9px", borderRadius: 7, border: "1px solid #6366f1", background: "rgba(99,102,241,.12)", color: "#818cf8", cursor: "pointer", fontSize: 11 }}>✏️</button>
                    <button onClick={() => del(p.id)} style={{ padding: "5px 9px", borderRadius: 7, border: "1px solid #ef4444", background: "rgba(239,68,68,.12)", color: "#ef4444", cursor: "pointer", fontSize: 11 }}>🗑</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ════ ADMIN LOGIN ════ */
function AdminLogin({ onSuccess, onBack }) {
  const [pass, setPass] = useState(""); const [err, setErr] = useState("");
  const attempt = () => {
    if (pass === window.ADMIN_SECRET) { onSuccess(); }
    else { setErr("Code incorrect"); setPass(""); }
  };
  return (
    <div style={{ minHeight: "100vh", background: "#080810", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div style={{ width: "100%", maxWidth: 340, animation: "fadeUp .5s ease both" }}>
        <div style={{ textAlign: "center", marginBottom: 28 }}>
          <div style={{ width: 64, height: 64, borderRadius: 18, background: "var(--gold-dim)", border: "1px solid var(--border-gold)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 28, margin: "0 auto 16px" }}>🔐</div>
          <div className="font-display" style={{ fontSize: 22, color: "var(--gold)", fontWeight: 800, marginBottom: 4 }}>Accès Admin</div>
          <div style={{ fontSize: 13, color: "var(--text3)" }}>Réservé au propriétaire Boutique Traore</div>
        </div>
        <div style={{ background: "var(--bg2)", border: "1px solid var(--border)", borderRadius: 16, padding: "22px 18px" }}>
          <input className="inp" type="password" value={pass} onChange={e => { setPass(e.target.value); setErr(""); }} onKeyDown={e => e.key === "Enter" && attempt()} placeholder="Code secret…" style={{ textAlign: "center", letterSpacing: 4, fontSize: 16, marginBottom: err ? 0 : 12 }} autoComplete="new-password" />
          {err && <div style={{ color: "#ef4444", fontSize: 12, textAlign: "center", margin: "8px 0" }}>{err}</div>}
          <button onClick={attempt} className="btn-gold" style={{ width: "100%", padding: "12px 0", borderRadius: 12, fontSize: 14, marginTop: 12 }}>Accéder au panneau</button>
        </div>
        <button onClick={onBack} style={{ display: "block", margin: "14px auto 0", background: "none", border: "none", color: "var(--text3)", cursor: "pointer", fontSize: 13 }}>← Retour</button>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════
   APP PRINCIPALE
════════════════════════════════════════ */
function App() {
  const [page, setPage] = useState("home");
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [cart, setCart] = useState([]);
  const [wish, setWish] = useState([]);
  const [search, setSearch] = useState("");
  const [toast, setToast] = useState(null);
  const [adminLogged, setAdminLogged] = useState(false);
  const [filterCat, setFilterCat] = useState("all");
  const [orderModal, setOrderModal] = useState(false);
  const [quickProd, setQuickProd] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [detailProd, setDetailProd] = useState(null);
  const [swipeProd, setSwipeProd] = useState(null);
  const [particles, setParticles] = useState([]);
  const [cartBounce, setCartBounce] = useState(false);
  const [recent, setRecent] = useState([]);

  const [tapCount, setTapCount] = useState(0);
  const tapTimer = useRef(null);
  const cartIconRef = useRef(null);

  const store = useStore();
  const recentlyViewed = useRecentlyViewed();

  /* ── CHARGEMENT PRODUITS EN TEMPS RÉEL ── */
  useEffect(() => {
    setLoading(true);

    if (store.fb) {
      // 🔴 Firebase : écoute temps réel — tous les clients voient les produits
      const unsub = store.subscribe(ps => {
        setProducts(ps);
        setLoading(false);
      });
      return () => unsub && unsub();
    } else {
      // Fallback localStorage
      store.load().then(ps => { setProducts(ps); setLoading(false); });
    }
    setRecent(recentlyViewed.get());
  }, []);

  const showToast = (msg, ok = true, icon = null) => {
    setToast({ msg, ok, icon });
    setTimeout(() => setToast(null), 2800);
  };

  /* Triple-tap admin */
  const handleLogoTap = () => {
    const next = tapCount + 1;
    setTapCount(next);
    clearTimeout(tapTimer.current);
    if (next >= 3) { setTapCount(0); setPage("adminLogin"); setMenuOpen(false); }
    else { tapTimer.current = setTimeout(() => setTapCount(0), 900); }
  };

  /* Fly to cart */
  const flyToCart = (e, emoji) => {
    if (!cartIconRef.current) return;
    const srcRect = e.currentTarget.getBoundingClientRect();
    const dstRect = cartIconRef.current.getBoundingClientRect();
    const id = Date.now();
    const fx = (dstRect.left + dstRect.width / 2) - (srcRect.left + srcRect.width / 2);
    const fy = (dstRect.top + dstRect.height / 2) - (srcRect.top + srcRect.height / 2);
    const particle = { id, x: srcRect.left + srcRect.width / 2 - 13, y: srcRect.top + srcRect.height / 2 - 13, emoji: emoji || "📦", fx, fy };
    setParticles(pp => [...pp, particle]);
    setTimeout(() => {
      setParticles(pp => pp.filter(p => p.id !== id));
      setCartBounce(true);
      setTimeout(() => setCartBounce(false), 500);
    }, 600);
  };

  /* Cart */
  const addCart = (p, e) => {
    if (!p.inStock) return;
    if (e) flyToCart(e, p.emoji || "🛒");
    setCart(c => { const ex = c.find(x => x.id === p.id); return ex ? c.map(x => x.id === p.id ? { ...x, qty: x.qty + 1 } : x) : [...c, { ...p, qty: 1 }]; });
    showToast("Ajouté au panier !", true, "🛒");
  };
  const rmCart = id => setCart(c => c.filter(x => x.id !== id));
  const updQty = (id, d) => setCart(c => c.map(x => x.id === id ? { ...x, qty: Math.max(1, x.qty + d) } : x));
  const cartTotal = cart.reduce((s, x) => s + Number(x.price) * x.qty, 0);
  const cartCount = cart.reduce((s, x) => s + x.qty, 0);

  /* Wish */
  const toggleWish = p => {
    const has = wish.find(x => x.id === p.id);
    setWish(w => has ? w.filter(x => x.id !== p.id) : [...w, p]);
    showToast(has ? "Retiré des favoris" : "Ajouté aux favoris", true, has ? "💔" : "❤️");
  };

  /* Detail */
  const openDetail = (p) => {
    recentlyViewed.add(p);
    setRecent(recentlyViewed.get());
    setDetailProd(p);
  };

  const navTo = p => { setPage(p); setMenuOpen(false); };
  const cats = ["all", ...Array.from(new Set(products.map(p => p.category).filter(Boolean)))];
  const filtered = products.filter(p => (filterCat === "all" || p.category === filterCat) && (search === "" || p.name.toLowerCase().includes(search.toLowerCase())));

  /* Pages admin */
  if (page === "adminLogin") return <AdminLogin onSuccess={() => { setAdminLogged(true); setPage("admin"); }} onBack={() => setPage("home")} />;
  if (page === "admin" && adminLogged) return (
    <>
      <AdminPanel products={products} onBack={() => setPage("home")} onLogout={() => { setAdminLogged(false); setPage("home"); }} store={store} showToast={showToast} fbReady={store.fb} />
      {toast && <Toast msg={toast.msg} ok={toast.ok} icon={toast.icon} />}
    </>
  );

  /* Swipe view */
  if (swipeProd) return (
    <>
      <SwipeView products={swipeProd.products} startIdx={swipeProd.startIdx} onClose={() => setSwipeProd(null)} onAddCart={p => addCart(p)} onQuickOrder={p => { setSwipeProd(null); setQuickProd(p); }} onToggleWish={toggleWish} wish={wish} />
      {quickProd && <QuickModal product={quickProd} onClose={() => setQuickProd(null)} onDone={() => { setQuickProd(null); setPage("orderDone"); }} />}
      {toast && <Toast msg={toast.msg} ok={toast.ok} icon={toast.icon} />}
    </>
  );

  return (
    <div style={{ minHeight: "100vh", background: "#080810", color: "var(--text)", fontFamily: "Inter,sans-serif" }}>
      {particles.map(p => (
        <div key={p.id} className="fly-particle" style={{ left: p.x, top: p.y, "--fx": p.fx + "px", "--fy": p.fy + "px" }}>{p.emoji}</div>
      ))}

      {orderModal && <OrderModal cart={cart} total={cartTotal} onClose={() => setOrderModal(false)} onDone={() => { setCart([]); setOrderModal(false); setPage("orderDone"); }} />}
      {quickProd && <QuickModal product={quickProd} onClose={() => setQuickProd(null)} onDone={() => { setQuickProd(null); setPage("orderDone"); }} />}
      {detailProd && <ProductDetail product={detailProd} onClose={() => setDetailProd(null)} onAddCart={(p, e) => addCart(p, e)} onQuickOrder={p => { setDetailProd(null); setQuickProd(p); }} onToggleWish={toggleWish} isWished={!!wish.find(x => x.id === detailProd.id)} />}

      {menuOpen && <div onClick={() => setMenuOpen(false)} style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,.75)", zIndex: 290, backdropFilter: "blur(4px)" }} />}

      {/* BANNER */}
      <div className="banner">
        <div style={{ display: "flex", animation: "marquee 28s linear infinite", whiteSpace: "nowrap" }}>
          {[BANNER_TEXT, BANNER_TEXT].map((txt, i) => (
            <span key={i} style={{ paddingRight: 50, fontSize: 11, fontWeight: 700, color: "#080810", letterSpacing: ".04em", flexShrink: 0 }}>{txt}</span>
          ))}
        </div>
      </div>

      {/* HEADER */}
      <header className="header" style={{ padding: "9px 14px", display: "flex", alignItems: "center", gap: 10 }}>
        <button onClick={() => setMenuOpen(m => !m)} className="btn-ghost" style={{ width: 38, height: 38, borderRadius: 10, fontSize: 18, display: "flex", alignItems: "center", justifyContent: "center", padding: 0, flexShrink: 0 }}>☰</button>
        <div onClick={handleLogoTap} style={{ width: 38, height: 38, borderRadius: 11, background: "linear-gradient(135deg,#C9963A,#E8B55A)", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0, userSelect: "none" }}>
          <span className="font-display" style={{ fontSize: 14, fontWeight: 900, color: "#080810", letterSpacing: "-1px" }}>BT</span>
        </div>
        <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Rechercher…" style={{ flex: 1, background: "var(--bg3)", border: "1px solid var(--border)", borderRadius: 10, padding: "8px 12px", color: "var(--text)", fontFamily: "Inter,sans-serif", fontSize: 13, outline: "none" }} />
        {filtered.length > 0 && page === "home" && (
          <button onClick={() => setSwipeProd({ products: filtered, startIdx: 0 })} className="btn-ghost" style={{ width: 38, height: 38, borderRadius: 10, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center", padding: 0, flexShrink: 0 }} title="Mode swipe">↔️</button>
        )}
        <button onClick={() => navTo("favorites")} style={{ position: "relative", background: "var(--bg3)", border: "1px solid var(--border)", borderRadius: 10, width: 38, height: 38, fontSize: 15, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
          ❤️{wish.length > 0 && <span style={{ position: "absolute", top: -4, right: -4, background: "#ef4444", color: "#fff", borderRadius: "50%", width: 16, height: 16, fontSize: 8, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{wish.length}</span>}
        </button>
        <button ref={cartIconRef} onClick={() => navTo("cart")} style={{ position: "relative", background: "var(--bg3)", border: "1px solid var(--border)", borderRadius: 10, width: 38, height: 38, fontSize: 15, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, animation: cartBounce ? "cartBounce .5s ease" : "none", transformOrigin: "center" }}>
          🛒{cartCount > 0 && <span style={{ position: "absolute", top: -4, right: -4, background: "var(--gold)", color: "#080810", borderRadius: "50%", width: 16, height: 16, fontSize: 8, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{cartCount}</span>}
        </button>
      </header>

      {/* SIDEBAR */}
      <div className="sidebar" style={{ transform: menuOpen ? "translateX(0)" : "translateX(-100%)" }}>
        <div style={{ padding: "20px 16px 14px", borderBottom: "1px solid var(--border)" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
            <div>
              <div className="font-display" style={{ fontSize: 18, fontWeight: 900, color: "var(--gold)", letterSpacing: "-1px" }}>BOUTIQUE</div>
              <div className="font-display" style={{ fontSize: 18, fontWeight: 900, color: "var(--text)", letterSpacing: "-1px" }}>TRAORE</div>
            </div>
            <button onClick={() => setMenuOpen(false)} className="btn-ghost" style={{ width: 32, height: 32, borderRadius: 8, fontSize: 16, padding: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>✕</button>
          </div>
          <span style={{ fontSize: 10, padding: "3px 8px", borderRadius: 6, background: store.fb ? "rgba(34,197,94,.1)" : "rgba(201,150,58,.1)", color: store.fb ? "#22c55e" : "var(--gold)", border: `1px solid ${store.fb ? "rgba(34,197,94,.25)" : "rgba(201,150,58,.25)"}` }}>
            {store.fb ? "🔥 Firebase — Temps réel" : "💾 Local (configurer Firebase)"}
          </span>
        </div>
        <nav style={{ flex: 1, padding: "12px 10px", display: "flex", flexDirection: "column", gap: 3, overflowY: "auto" }}>
          {[
            { icon: "🏠", label: "Accueil", p: "home" },
            { icon: "💳", label: "Paiements", p: "payment" },
            { icon: "❤️", label: "Favoris", p: "favorites", badge: wish.length || null },
            { icon: "🛒", label: "Panier", p: "cart", badge: cartCount || null },
          ].map((item, i) => (
            <button key={i} className={`nav-item${page === item.p ? " active" : ""}`} onClick={() => navTo(item.p)}>
              <span style={{ fontSize: 18 }}>{item.icon}</span>
              <span>{item.label}</span>
              {item.badge ? <span style={{ marginLeft: "auto", background: "var(--gold)", color: "#080810", borderRadius: "50%", width: 20, height: 20, fontSize: 11, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{item.badge}</span> : null}
            </button>
          ))}
        </nav>
        <div style={{ padding: "12px 14px", borderTop: "1px solid var(--border)" }}>
          <div style={{ fontSize: 11, color: "var(--text3)", marginBottom: 6 }}>🚚 Livraison gratuite dès {fmt(FREE_DELIVERY)}</div>
          <div style={{ fontSize: 10, color: "rgba(240,237,232,.15)", textAlign: "center" }}>© 2026 Boutique Traore · ☁ Cloudinary</div>
        </div>
      </div>

      {/* CONTENU */}
      <div style={{ paddingTop: 84 }}>

        {/* HOME */}
        {page === "home" && (
          <main style={{ maxWidth: 1100, margin: "0 auto", padding: "0 12px 70px" }}>
            {/* HERO */}
            <div style={{ margin: "14px 0 16px", borderRadius: 22, overflow: "hidden", position: "relative", background: "linear-gradient(135deg,#0E0A00,#1A1200,#08080F)", border: "1px solid rgba(201,150,58,.2)", padding: "32px 26px" }}>
              <div style={{ position: "absolute", top: 0, right: 0, width: "50%", height: "100%", background: "radial-gradient(ellipse at 80% 50%,rgba(201,150,58,.1),transparent 70%)", pointerEvents: "none" }} />
              <div style={{ position: "relative", zIndex: 1, maxWidth: 500 }}>
                <div style={{ display: "inline-flex", alignItems: "center", gap: 8, background: "rgba(201,150,58,.1)", border: "1px solid rgba(201,150,58,.3)", borderRadius: 20, padding: "5px 14px", marginBottom: 14 }}>
                  <span style={{ animation: "pulse 2s infinite", display: "block", fontSize: 12 }}>🌍</span>
                  <span style={{ fontSize: 11, fontWeight: 700, color: "var(--gold)", letterSpacing: ".05em" }}>LIVRAISON GRATUITE DÈS {fmt(FREE_DELIVERY)}</span>
                </div>
                <h1 className="font-display" style={{ fontSize: "clamp(20px,4vw,36px)", fontWeight: 900, lineHeight: 1.15, marginBottom: 10, letterSpacing: "-1px" }}>
                  <span style={{ color: "var(--text)" }}>Bienvenue à la </span>
                  <span style={{ color: "var(--gold)" }}>Boutique Traore</span>
                </h1>
                <p style={{ fontSize: 13, color: "var(--text2)", marginBottom: 20, lineHeight: 1.7 }}>
                  Produits authentiques, livraison rapide,<br />satisfaction garantie.
                </p>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                  <button onClick={() => navTo("payment")} className="btn-gold" style={{ padding: "10px 22px", borderRadius: 12, fontSize: 13 }}>💳 Modes de paiement</button>
                  {filtered.length > 0 && <button onClick={() => setSwipeProd({ products: filtered, startIdx: 0 })} className="btn-ghost" style={{ padding: "10px 18px", borderRadius: 12, fontSize: 13 }}>↔️ Mode swipe</button>}
                </div>
              </div>
            </div>

            {/* STATS MINI */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 8, marginBottom: 18 }}>
              {[
                { v: "190+", l: "Pays", icon: "🌍" },
                { v: "100%", l: "Sécurisé", icon: "🔒" },
                { v: "24/7", l: "Support", icon: "💬" },
                { v: "★4.9", l: "Satisfaction", icon: "⭐" },
              ].map((s, i) => (
                <div key={i} style={{ background: "var(--bg2)", border: "1px solid var(--border)", borderRadius: 14, padding: "10px 8px", textAlign: "center" }}>
                  <div style={{ fontSize: 16, marginBottom: 2 }}>{s.icon}</div>
                  <div className="font-grotesk" style={{ fontWeight: 700, fontSize: 14, color: "var(--gold)" }}>{s.v}</div>
                  <div style={{ fontSize: 9, color: "var(--text3)", marginTop: 1 }}>{s.l}</div>
                </div>
              ))}
            </div>

            {cart.length > 0 && cartTotal < FREE_DELIVERY && (
              <div style={{ marginBottom: 16, animation: "fadeUp .4s ease both" }}>
                <DeliveryAlert cartTotal={cartTotal} />
              </div>
            )}

            {/* FILTRES */}
            {cats.length > 1 && (
              <div style={{ display: "flex", gap: 7, overflowX: "auto", paddingBottom: 6, marginBottom: 16, scrollbarWidth: "none" }}>
                {cats.map(c => (
                  <button key={c} className={`cat-pill${filterCat === c ? " active" : ""}`} onClick={() => setFilterCat(c)}>
                    {c === "all" ? "Tout" : c}
                  </button>
                ))}
              </div>
            )}

            {/* PRODUITS */}
            {loading ? (
              <div style={{ textAlign: "center", padding: "60px 20px" }}>
                <div className="spin" style={{ marginBottom: 14 }} />
                <p style={{ color: "var(--text3)", fontSize: 14 }}>Chargement depuis Firebase…</p>
              </div>
            ) : filtered.length === 0 ? (
              <div style={{ textAlign: "center", padding: "50px 20px" }}>
                <div style={{ fontSize: 56, marginBottom: 12, opacity: .2 }}>🛍</div>
                <div className="font-display" style={{ fontSize: 17, color: "var(--text3)", marginBottom: 8, fontWeight: 700 }}>
                  {search ? "Aucun résultat" : "BOUTIQUE EN PRÉPARATION"}
                </div>
                <div style={{ fontSize: 13, color: "var(--text3)", lineHeight: 1.8, maxWidth: 300, margin: "0 auto" }}>
                  {search ? `"${search}" introuvable` : "L'admin ajoutera bientôt des articles."}
                </div>
              </div>
            ) : (
              <div className="products-grid" style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(168px,1fr))", gap: 12 }}>
                {filtered.map((p, pidx) => {
                  const isW = wish.find(x => x.id === p.id);
                  const bc = p.badge && BADGES[p.badge];
                  return (
                    <div key={p.id} className="pcard anim-up" style={{ animationDelay: (pidx % 8) * .06 + "s" }} onClick={() => openDetail(p)}>
                      <div style={{ height: 138, overflow: "hidden", background: "var(--bg3)", display: "flex", alignItems: "center", justifyContent: "center", position: "relative", flexShrink: 0 }}>
                        {p.image ? <img src={p.image} alt={p.name} style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ fontSize: 52, userSelect: "none" }}>{p.emoji || "📦"}</span>}
                        {bc && <div className="badge" style={{ position: "absolute", top: 7, left: 7, background: bc.bg, color: bc.c }}>{bc.l}</div>}
                        <button onClick={e => { e.stopPropagation(); toggleWish(p); }} style={{ position: "absolute", top: 7, right: 7, background: "rgba(0,0,0,.55)", border: "none", borderRadius: "50%", width: 28, height: 28, fontSize: 13, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(6px)" }}>
                          {isW ? "❤️" : "🤍"}
                        </button>
                        {!p.inStock && <div style={{ position: "absolute", inset: 0, background: "rgba(0,0,0,.7)", display: "flex", alignItems: "center", justifyContent: "center" }}><span style={{ background: "rgba(239,68,68,.9)", color: "#fff", fontWeight: 700, fontSize: 10, padding: "3px 10px", borderRadius: 18 }}>Rupture</span></div>}
                        {Number(p.price) >= FREE_DELIVERY && p.inStock && <div style={{ position: "absolute", bottom: 6, left: 6, background: "rgba(34,197,94,.9)", color: "#fff", fontSize: 8, fontWeight: 700, padding: "2px 6px", borderRadius: 10 }}>🚚 Gratuit</div>}
                      </div>
                      <div style={{ padding: "10px 11px 11px", flex: 1, display: "flex", flexDirection: "column", gap: 3 }} onClick={e => e.stopPropagation()}>
                        <div style={{ fontWeight: 600, fontSize: 12, lineHeight: 1.35, color: "rgba(240,237,232,.9)", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden", flex: 1 }} onClick={() => openDetail(p)}>{p.name}</div>
                        {p.category && <div style={{ fontSize: 9, color: "var(--text3)" }}>{p.category}</div>}
                        {Number(p.rating) > 0 && <div style={{ display: "flex", alignItems: "center", gap: 4 }}><Stars r={p.rating} /><span style={{ fontSize: 9, color: "var(--text3)" }}>({p.reviews || 0})</span></div>}
                        <div className="font-display" style={{ fontWeight: 800, fontSize: 14, color: "var(--gold)", margin: "3px 0" }}>{fmt(p.price)}</div>
                        <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                          <button onClick={e => { e.stopPropagation(); p.inStock && setQuickProd(p); }} disabled={!p.inStock} style={{ width: "100%", padding: "7px 0", borderRadius: 9, border: "none", background: p.inStock ? "linear-gradient(135deg,#25D366,#128C7E)" : "rgba(255,255,255,.05)", color: p.inStock ? "#fff" : "var(--text3)", fontWeight: 700, fontSize: 11, cursor: p.inStock ? "pointer" : "default", fontFamily: "Inter,sans-serif", display: "flex", alignItems: "center", justifyContent: "center", gap: 5 }}>
                            {p.inStock ? <><WaIco s={12} /> Commander</> : "Rupture"}
                          </button>
                          {p.inStock && (
                            <button onClick={e => { e.stopPropagation(); addCart(p, e); }} className="btn-gold" style={{ width: "100%", padding: "6px 0", borderRadius: 9, fontSize: 11, display: "flex", alignItems: "center", justifyContent: "center", gap: 5 }}>
                              🛒 Ajouter
                            </button>
                          )}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* RÉCEMMENT VUS */}
            {recent.length > 0 && (
              <div style={{ marginTop: 32 }}>
                <div className="font-display" style={{ fontSize: 15, fontWeight: 700, color: "var(--text2)", marginBottom: 14 }}>👁 Vus récemment</div>
                <div style={{ display: "flex", gap: 10, overflowX: "auto", paddingBottom: 8, scrollbarWidth: "none" }}>
                  {recent.map(p => {
                    const full = products.find(x => x.id === p.id) || p;
                    return (
                      <div key={p.id} onClick={() => openDetail(full)} style={{ flexShrink: 0, width: 110, background: "var(--bg2)", border: "1px solid var(--border)", borderRadius: 14, overflow: "hidden", cursor: "pointer" }}>
                        <div style={{ height: 76, background: "var(--bg3)", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden", fontSize: 32 }}>
                          {p.image ? <img src={p.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : p.emoji || "📦"}
                        </div>
                        <div style={{ padding: "7px 8px" }}>
                          <div style={{ fontSize: 10, fontWeight: 600, color: "var(--text2)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</div>
                          <div className="font-display" style={{ fontSize: 11, fontWeight: 700, color: "var(--gold)" }}>{fmt(p.price)}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>
        )}

        {/* CART */}
        {page === "cart" && (
          <main style={{ maxWidth: 680, margin: "0 auto", padding: "22px 12px 80px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 20 }}>
              <button onClick={() => setPage("home")} className="btn-ghost" style={{ width: 36, height: 36, borderRadius: 10, fontSize: 18, padding: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>←</button>
              <h2 className="font-display" style={{ fontSize: 20, fontWeight: 800 }}>🛒 Panier ({cartCount})</h2>
            </div>
            {cart.length > 0 && <DeliveryAlert cartTotal={cartTotal} />}
            {cart.length === 0 ? (
              <div style={{ textAlign: "center", padding: "50px 20px" }}>
                <div style={{ fontSize: 58, marginBottom: 12 }}>🛒</div>
                <p style={{ color: "var(--text3)", fontSize: 15, marginBottom: 20 }}>Votre panier est vide</p>
                <button onClick={() => setPage("home")} className="btn-gold" style={{ padding: "11px 28px", borderRadius: 14, fontSize: 14 }}>Continuer mes achats</button>
              </div>
            ) : (
              <>
                <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 16 }}>
                  {cart.map(item => (
                    <div key={item.id} className="card-flat" style={{ padding: "12px 13px", display: "flex", gap: 11, alignItems: "center" }}>
                      <div style={{ width: 52, height: 52, borderRadius: 11, overflow: "hidden", flexShrink: 0, background: "var(--bg3)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 26, cursor: "pointer" }} onClick={() => { const full = products.find(x => x.id === item.id) || item; openDetail(full); }}>
                        {item.image ? <img src={item.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", borderRadius: 11 }} /> : item.emoji || "📦"}
                      </div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontWeight: 600, fontSize: 13, marginBottom: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.name}</div>
                        <div className="font-display" style={{ fontWeight: 800, fontSize: 13, color: "var(--gold)" }}>{fmt(item.price)}</div>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 6 }}>
                          <button onClick={() => updQty(item.id, -1)} className="btn-ghost" style={{ width: 26, height: 26, borderRadius: "50%", fontSize: 14, padding: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
                          <span style={{ fontWeight: 700, fontSize: 14, minWidth: 18, textAlign: "center" }}>{item.qty}</span>
                          <button onClick={() => updQty(item.id, 1)} className="btn-ghost" style={{ width: 26, height: 26, borderRadius: "50%", fontSize: 14, padding: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
                          <span style={{ fontSize: 11, color: "var(--text3)" }}>= {fmt(item.price * item.qty)}</span>
                        </div>
                      </div>
                      <button onClick={() => rmCart(item.id)} style={{ background: "rgba(239,68,68,.1)", border: "1px solid rgba(239,68,68,.25)", borderRadius: 9, padding: "6px 9px", color: "#ef4444", cursor: "pointer", fontSize: 12, fontWeight: 600 }}>🗑</button>
                    </div>
                  ))}
                </div>
                <div className="card-flat" style={{ padding: "14px 16px", marginBottom: 12 }}>
                  <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 5, fontSize: 12, color: "var(--text3)" }}>
                    <span>🚚 Livraison</span>
                    <span style={{ color: cartTotal >= FREE_DELIVERY ? "#22c55e" : "var(--text2)", fontWeight: 600 }}>{cartTotal >= FREE_DELIVERY ? "GRATUITE" : "Selon zone"}</span>
                  </div>
                  <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 700, fontSize: 16 }}>
                    <span>Total</span>
                    <span className="font-display" style={{ color: "var(--gold)" }}>{fmt(cartTotal)}</span>
                  </div>
                </div>
                <button onClick={() => setOrderModal(true)} className="btn-wa" style={{ width: "100%", padding: "14px 0", borderRadius: 14, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center", gap: 9 }}>
                  <WaIco s={20} /> Commander via WhatsApp — {fmt(cartTotal)}
                </button>
              </>
            )}
          </main>
        )}

        {/* PAYMENT */}
        {page === "payment" && (
          <main style={{ maxWidth: 520, margin: "0 auto", padding: "22px 12px 80px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 22 }}>
              <button onClick={() => setPage(cart.length ? "cart" : "home")} className="btn-ghost" style={{ width: 36, height: 36, borderRadius: 10, fontSize: 18, padding: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>←</button>
              <h2 className="font-display" style={{ fontSize: 20, fontWeight: 800 }}>💳 Paiement Sécurisé</h2>
            </div>
            <p style={{ color: "var(--text2)", fontSize: 13, marginBottom: 20 }}>Choisissez votre mode de paiement lors de la commande.</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 22 }}>
              {PM.map(m => (
                <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 14, padding: "14px 16px", borderRadius: 14, border: `1px solid ${m.c}33`, background: `${m.c}0D` }}>
                  <span style={{ fontSize: 24 }}>{m.icon}</span>
                  <span style={{ fontWeight: 600, fontSize: 14 }}>{m.n}</span>
                  <span style={{ marginLeft: "auto", fontSize: 11, color: "var(--text3)" }}>Disponible</span>
                </div>
              ))}
            </div>
            {cart.length > 0 ? (
              <button onClick={() => setOrderModal(true)} className="btn-wa" style={{ width: "100%", padding: "14px 0", borderRadius: 14, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center", gap: 9 }}>
                <WaIco s={20} /> Commander via WhatsApp — {fmt(cartTotal)}
              </button>
            ) : (
              <button onClick={() => setPage("home")} className="btn-gold" style={{ width: "100%", padding: "14px 0", borderRadius: 14, fontSize: 15 }}>🛍 Voir les produits</button>
            )}
            <div style={{ display: "flex", justifyContent: "center", gap: 16, marginTop: 16, fontSize: 11, color: "var(--text3)", flexWrap: "wrap" }}>
              {["🔒 SSL", "🛡 3D Secure", "🔄 Remboursement 30j"].map((s, i) => <span key={i}>{s}</span>)}
            </div>
          </main>
        )}

        {/* FAVORITES */}
        {page === "favorites" && (
          <main style={{ maxWidth: 800, margin: "0 auto", padding: "22px 12px 80px" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 22 }}>
              <button onClick={() => setPage("home")} className="btn-ghost" style={{ width: 36, height: 36, borderRadius: 10, fontSize: 18, padding: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>←</button>
              <h2 className="font-display" style={{ fontSize: 20, fontWeight: 800 }}>❤️ Favoris ({wish.length})</h2>
            </div>
            {wish.length === 0 ? (
              <div style={{ textAlign: "center", padding: "50px 20px" }}>
                <div style={{ fontSize: 58, marginBottom: 12 }}>🤍</div>
                <p style={{ color: "var(--text3)", fontSize: 15, marginBottom: 20 }}>Aucun favori encore</p>
                <button onClick={() => setPage("home")} className="btn-gold" style={{ padding: "11px 28px", borderRadius: 14, fontSize: 14 }}>Découvrir les produits</button>
              </div>
            ) : (
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(160px,1fr))", gap: 12 }}>
                {wish.map(p => (
                  <div key={p.id} className="pcard" onClick={() => { const full = products.find(x => x.id === p.id) || p; openDetail(full); }}>
                    <div style={{ height: 110, overflow: "hidden", background: "var(--bg3)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                      {p.image ? <img src={p.image} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <span style={{ fontSize: 46 }}>{p.emoji || "📦"}</span>}
                    </div>
                    <div style={{ padding: "10px 11px" }} onClick={e => e.stopPropagation()}>
                      <div style={{ fontWeight: 600, fontSize: 12, marginBottom: 4, lineHeight: 1.35, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{p.name}</div>
                      <div className="font-display" style={{ fontWeight: 800, fontSize: 13, color: "var(--gold)", marginBottom: 8 }}>{fmt(p.price)}</div>
                      <div style={{ display: "flex", gap: 6 }}>
                        <button onClick={e => { e.stopPropagation(); setQuickProd(p); }} className="btn-wa" style={{ flex: 1, padding: "6px 0", borderRadius: 9, fontSize: 10, display: "flex", alignItems: "center", justifyContent: "center", gap: 4 }}>
                          <WaIco s={11} /> Commander
                        </button>
                        <button onClick={e => { e.stopPropagation(); toggleWish(p); }} style={{ padding: "6px 9px", borderRadius: 9, border: "1px solid rgba(239,68,68,.35)", background: "rgba(239,68,68,.08)", color: "#ef4444", cursor: "pointer", fontSize: 11 }}>✕</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </main>
        )}

        {/* ORDER DONE */}
        {page === "orderDone" && (
          <main style={{ maxWidth: 460, margin: "0 auto", padding: "70px 20px", textAlign: "center" }}>
            <div style={{ fontSize: 70, marginBottom: 18, animation: "ringPop .6s cubic-bezier(.34,1.56,.64,1) both" }}>🎉</div>
            <h2 className="font-display" style={{ fontSize: 26, fontWeight: 900, marginBottom: 10, color: "var(--gold)" }}>Commande envoyée !</h2>
            <p style={{ color: "var(--text2)", lineHeight: 1.8, marginBottom: 8 }}>Merci ! On vous contacte très vite.</p>
            <p style={{ color: "var(--text3)", fontSize: 13, marginBottom: 32 }}>📱 +237 698 083 058</p>
            <button onClick={() => setPage("home")} className="btn-gold" style={{ padding: "13px 36px", borderRadius: 16, fontSize: 15 }}>🏠 Continuer mes achats</button>
          </main>
        )}

        {/* FOOTER */}
        {page === "home" && (
          <footer style={{ borderTop: "1px solid var(--border)", padding: "26px 14px", textAlign: "center", marginTop: 16 }}>
            <div className="font-display" style={{ fontSize: 18, fontWeight: 900, color: "var(--gold)", marginBottom: 4, letterSpacing: "-1px" }}>BOUTIQUE TRAORE</div>
            <p style={{ fontSize: 11, color: "var(--text3)", lineHeight: 2 }}>
              🌍 190+ pays · 🔒 Paiement sécurisé · 🚚 Gratuit dès {fmt(FREE_DELIVERY)}<br />
              ☁ Cloudinary · 📱 WhatsApp: +237 698 083 058<br />
              © 2026 Boutique Traore — AKIT Commerce
            </p>
          </footer>
        )}
      </div>

      {toast && <Toast msg={toast.msg} ok={toast.ok} icon={toast.icon} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
