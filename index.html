<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#0A0A0F"/>
<title>AKIT Commerce — Boutique Traoré</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body,#root{height:100%;width:100%;}
body{background:#0A0A0F;color:#F2EFE9;font-family:'DM Sans',sans-serif;overflow-x:hidden;}
::-webkit-scrollbar{width:2px;}
::-webkit-scrollbar-thumb{background:#C9963A;border-radius:2px;}

/* ── SPLASH ── */
@keyframes splashFadeOut{0%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1.08)}}
@keyframes logoIn{0%{opacity:0;transform:translateY(18px) scale(.9)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes tagIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
@keyframes barLoad{0%{width:0}100%{width:100%}}
@keyframes shimmerSplash{0%{background-position:200% 0}100%{background-position:-200% 0}}

#splash{position:fixed;inset:0;z-index:9999;background:#0A0A0F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;}
#splash.hide{animation:splashFadeOut .7s cubic-bezier(.4,0,.2,1) forwards;}

.splash-logo-wrap{animation:logoIn .7s cubic-bezier(.22,1,.36,1) both;}
.splash-bt{width:110px;height:110px;border-radius:28px;background:linear-gradient(145deg,#C9963A,#E8B84B);display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(201,150,58,.35),0 0 0 1px rgba(201,150,58,.2);position:relative;overflow:hidden;}
.splash-bt::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.18) 0%,transparent 60%);border-radius:inherit;}
.splash-bt-text{font-family:'Syne',sans-serif;font-weight:900;font-size:42px;color:#0A0A0F;letter-spacing:-2px;position:relative;z-index:1;}
.splash-brand{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;color:#F2EFE9;margin-top:22px;letter-spacing:.5px;animation:tagIn .6s .4s cubic-bezier(.22,1,.36,1) both;}
.splash-sub{font-size:13px;color:rgba(242,239,233,.35);margin-top:6px;letter-spacing:2px;text-transform:uppercase;animation:tagIn .6s .55s cubic-bezier(.22,1,.36,1) both;}
.splash-bar-wrap{width:140px;height:2px;background:rgba(201,150,58,.15);border-radius:2px;margin-top:44px;overflow:hidden;animation:tagIn .4s .7s both;}
.splash-bar{height:100%;background:linear-gradient(90deg,#C9963A,#E8B84B);border-radius:2px;animation:barLoad 1.6s .8s cubic-bezier(.4,0,.2,1) forwards;width:0;}

/* ── GLOBAL ANIMS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
@keyframes countIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}

.anim-up{animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both;}
.anim-scale{animation:scaleIn .38s cubic-bezier(.22,1,.36,1) both;}
.anim-slide{animation:slideUp .45s cubic-bezier(.22,1,.36,1) both;}

/* ── TYPE ── */
.font-display{font-family:'Syne',sans-serif;}

/* ── GOLD SYSTEM ── */
:root{
  --gold:#C9963A;
  --gold-light:#E8B84B;
  --gold-dim:rgba(201,150,58,.12);
  --gold-border:rgba(201,150,58,.22);
  --surface:#13131C;
  --surface2:rgba(255,255,255,.035);
  --surface3:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.07);
  --text:rgba(242,239,233,.9);
  --text-dim:rgba(242,239,233,.45);
  --text-ghost:rgba(242,239,233,.2);
}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;transition:border-color .25s,transform .28s;}
.card:hover{border-color:var(--gold-border);transform:translateY(-3px);}
.card-flat{background:var(--surface2);border:1px solid var(--border);border-radius:16px;}

/* ── BUTTONS ── */
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#0A0A0F;font-weight:700;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:filter .2s,transform .15s,box-shadow .2s;box-shadow:0 4px 20px rgba(201,150,58,.25);}
.btn-gold:hover{filter:brightness(1.08);box-shadow:0 6px 28px rgba(201,150,58,.38);}
.btn-gold:active{transform:scale(.97);}
.btn-ghost{background:var(--surface3);border:1px solid var(--border);color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .2s,border-color .2s;}
.btn-ghost:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.14);}
.btn-wa{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;font-weight:700;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:filter .2s,transform .15s;box-shadow:0 4px 18px rgba(18,140,126,.3);}
.btn-wa:hover{filter:brightness(1.08);}
.btn-wa:active{transform:scale(.97);}

/* ── INPUT ── */
.inp{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:11px;padding:11px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s,background .2s;}
.inp:focus{border-color:var(--gold);background:rgba(201,150,58,.04);}
.inp::placeholder{color:var(--text-ghost);}
select.inp option{background:#13131C;}

/* ── BANNER ── */
.banner{position:fixed;top:0;left:0;right:0;z-index:201;height:34px;overflow:hidden;background:linear-gradient(90deg,var(--gold),var(--gold-light),var(--gold));display:flex;align-items:center;}

/* ── HEADER ── */
.header{position:fixed;top:34px;left:0;right:0;z-index:200;background:rgba(10,10,15,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);}

/* ── SIDEBAR ── */
.sidebar{position:fixed;top:0;left:0;height:100%;width:290px;background:#0A0A0F;border-right:1px solid var(--border);z-index:250;display:flex;flex-direction:column;transition:transform .38s cubic-bezier(.4,0,.2,1);}

/* ── PRODUCT CARD ── */
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;transition:transform .28s,border-color .25s,box-shadow .28s;cursor:pointer;}
.pcard:hover{transform:translateY(-5px);border-color:var(--gold-border);box-shadow:0 12px 40px rgba(0,0,0,.4);}
.pcard:active{transform:scale(.98);}

/* ── BADGE ── */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.03em;}

/* ── OVERLAY / MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(10px);}
.overlay.center{align-items:center;padding:16px;}
.modal{background:#13131C;border:1px solid var(--gold-border);border-radius:24px 24px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;animation:slideUp .38s cubic-bezier(.22,1,.36,1) both;}
.modal.centered{border-radius:22px;animation:scaleIn .35s cubic-bezier(.22,1,.36,1) both;}

/* ── GALLERY ── */
.gallery-main{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:0;background:var(--surface2);}
.gallery-thumb{width:60px;height:60px;border-radius:10px;object-fit:cover;cursor:pointer;border:2px solid transparent;transition:border-color .2s,transform .2s;flex-shrink:0;}
.gallery-thumb.active{border-color:var(--gold);}
.gallery-thumb:hover{transform:scale(1.06);}

/* ── ZOOM ── */
.zoom-container{position:relative;overflow:hidden;cursor:zoom-in;}
.zoom-container.zoomed{cursor:zoom-out;}
.zoom-img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease;transform-origin:center center;}

/* ── STARS ── */
.stars{color:var(--gold);font-size:12px;letter-spacing:1px;}

/* ── TOGGLE ── */
.toggle{width:46px;height:25px;border-radius:13px;position:relative;cursor:pointer;transition:background .2s;}
.toggle-thumb{position:absolute;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .22s cubic-bezier(.22,1,.36,1);}

/* ── SPINNER ── */
.spin{border:2.5px solid rgba(201,150,58,.2);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}

/* ── UPLOAD ── */
.upload-zone{border:1.5px dashed var(--gold-border);border-radius:14px;padding:18px;text-align:center;cursor:pointer;transition:all .2s;background:var(--gold-dim);}
.upload-zone:hover,.upload-zone.drag{border-color:var(--gold);background:rgba(201,150,58,.1);}

/* ── PROG BAR ── */
.prog-bar{height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-light));border-radius:3px;transition:width .3s;}

/* ── NAV ITEM ── */
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 16px;border-radius:12px;border:none;background:transparent;color:var(--text);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;width:100%;text-align:left;transition:background .15s;}
.nav-item:hover{background:var(--surface3);}
.nav-item.active{background:var(--gold-dim);color:var(--gold);}

/* ── CAT PILL ── */
.cat-pill{padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text-dim);transition:all .2s;white-space:nowrap;flex-shrink:0;}
.cat-pill.active{border-color:var(--gold);background:var(--gold-dim);color:var(--gold);}

/* ── PMCARD ── */
.pmcard{padding:12px 14px;border-radius:13px;border:1.5px solid var(--border);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:10px;}
.pmcard.sel{border-color:var(--gold);background:var(--gold-dim);}

/* ── SHARE TOAST ── */
.share-pill{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:40px;font-size:13px;font-weight:600;background:rgba(10,10,15,.95);border:1px solid var(--gold-border);color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,.6);}

/* ── STAT CARD ── */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;}

/* ── REVIEW CARD ── */
.review-card{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:14px;}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .products-grid{grid-template-columns:repeat(2,1fr)!important;}
  .stats-row{grid-template-columns:repeat(2,1fr)!important;}
  .admin-split{grid-template-columns:1fr!important;}
  .modal{max-height:95vh;}
}
@media(min-width:601px){
  .overlay{align-items:center;padding:20px;}
  .modal{border-radius:22px;animation:scaleIn .35s cubic-bezier(.22,1,.36,1) both;}
}
</style>
</head>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ── PAYMENT METHODS ── */
const PM = [
  {id:"orange",n:"Orange Money",icon:"🟠",c:"#FF6600"},

  tendance:{bg:"#10b981",c:"#fff",l:"Tendance"},
  exclusif:{bg:"#ec4899",c:"#fff",l:"Exclusif"},
};

const BANNER_TXT = "✦  BOUTIQUE TRAORÉ — AKIT COMMERCE  ✦  LIVRAISON INTERNATIONALE  ✦  PAIEMENT SÉCURISÉ  ✦  RETOURS GRATUITS  ✦  QUALITÉ GARANTIE  ✦  ";

const fmt = n => Number(n).toLocaleString("fr-FR") + " FCFA";

/* ── FIREBASE STORE ── */
function useStore(){
  const fb = !!window.db;
  const load = async()=>{
    if(fb){ const s=await window.db.collection("products").orderBy("createdAt","asc").get(); return s.docs.map(d=>({...d.data(),id:d.id})); }
    try{ return JSON.parse(localStorage.getItem("akit_p")||"[]"); }catch{ return []; }
  };
  const add = async(p)=>{
    if(fb){ const r=await window.db.collection("products").add({...p,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); return r.id; }
    const id=Date.now().toString(); const ps=JSON.parse(localStorage.getItem("akit_p")||"[]"); ps.push({...p,id}); localStorage.setItem("akit_p",JSON.stringify(ps)); return id;
  };
  const upd = async(id,p)=>{
    if(fb){ await window.db.collection("products").doc(id).update(p); return; }
    const ps=JSON.parse(localStorage.getItem("akit_p")||"[]"); const i=ps.findIndex(x=>x.id===id); if(i>=0){ps[i]={...ps[i],...p};localStorage.setItem("akit_p",JSON.stringify(ps));}
  };
  const del = async(id)=>{
    if(fb){ await window.db.collection("products").doc(id).delete(); return; }
    const ps=JSON.parse(localStorage.getItem("akit_p")||"[]"); localStorage.setItem("akit_p",JSON.stringify(ps.filter(x=>x.id!==id)));
  };
  const sub = (cb)=>{
    if(fb) return window.db.collection("products").orderBy("createdAt","asc").onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))));
    return null;
  };
  /* Reviews */
  const addReview = async(productId, review)=>{
    if(fb){ await window.db.collection("reviews").add({...review,productId,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); return; }
    const key="akit_rv_"+productId; const rv=JSON.parse(localStorage.getItem(key)||"[]"); rv.push({...review,id:Date.now().toString()}); localStorage.setItem(key,JSON.stringify(rv));
  };
  const getReviews = async(productId)=>{
    if(fb){ const s=await window.db.collection("reviews").where("productId","==",productId).orderBy("createdAt","desc").get(); return s.docs.map(d=>({...d.data(),id:d.id})); }
    try{ return JSON.parse(localStorage.getItem("akit_rv_"+productId)||"[]"); }catch{ return []; }
  };
  /* Orders stat */
  const addOrder = async(order)=>{
    if(fb){ await window.db.collection("orders").add({...order,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); return; }
    const os=JSON.parse(localStorage.getItem("akit_orders")||"[]"); os.push({...order,id:Date.now().toString(),createdAt:new Date().toISOString()}); localStorage.setItem("akit_orders",JSON.stringify(os));
  };
  const getOrders = async()=>{
    if(fb){ const s=await window.db.collection("orders").orderBy("createdAt","desc").get(); return s.docs.map(d=>({...d.data(),id:d.id})); }
    try{ return JSON.parse(localStorage.getItem("akit_orders")||"[]"); }catch{ return []; }
  };
  return {fb,load,add,upd,del,sub,addReview,getReviews,addOrder,getOrders};
}
